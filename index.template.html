/* Expanded lessons: illustration, reasons, examples, and actionable reading sections. */
.slide-content{align-items:start;min-height:0;grid-template-columns:1.05fr 1fr}
.slide-text{padding:30px 26px 24px 30px}
.slide-text p{line-height:2.05;margin-bottom:18px;overflow-wrap:anywhere}
.slide-text p:last-child{margin-bottom:0}
.slide-text .why-title{font-size:16px;margin:24px 0 10px;padding-top:18px;border-top:1px solid var(--line);color:var(--teal-dark)}
.lesson-figure{margin:0;padding:30px 26px 20px 0;align-self:center;min-width:0}
.illustration-frame{border-radius:14px;overflow:hidden;background:#f3eee3;border:1px solid #e9e6d9}
.lesson-figure img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}
.lesson-figure figcaption{font-size:12px;line-height:1.9;margin-top:12px;color:var(--muted);padding:0 3px;overflow-wrap:anywhere}
.lesson-details{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;padding:0 26px 26px 30px;align-items:start}
.lesson-example,.lesson-actions{border-radius:12px;padding:23px;min-width:0}
.lesson-example{background:#fcf4e9;border:1px solid #eee0cc}
.lesson-actions{background:#f0f6f0;border:1px solid #dbe8dd}
.section-kicker{font-size:11px!important;font-weight:750;letter-spacing:.05em;margin:0 0 8px!important;color:#94603d}
.lesson-actions .section-kicker{color:var(--teal)}
.lesson-details h3{font-size:17px;margin:0 0 14px}
.lesson-details p{font-size:14px;line-height:2;margin:0 0 14px;overflow-wrap:anywhere}
.lesson-details p:last-child{margin-bottom:0}
.example-note{font-size:11px!important;color:#7a6d58;border-top:1px solid #e7d9c3;padding-top:12px}
.dialogue{margin:18px 0 0;display:grid;gap:10px}
.lesson-details .dialogue-line{display:flex;gap:10px;margin:0;align-items:flex-start;font-size:13px;background:#fff9;padding:11px 12px;border-radius:9px}
.dialogue-line strong{font-size:10px;color:#916044;white-space:nowrap;padding-top:3px;min-width:25px}
.action-list{padding:0;list-style:none;counter-reset:actions;margin:0}
.action-list li{counter-increment:actions;position:relative;padding-left:31px;margin:0 0 16px;font-size:14px;line-height:1.95;overflow-wrap:anywhere}
.action-list li:before{content:counter(actions);position:absolute;left:0;top:3px;width:22px;height:22px;background:#d8e9dc;color:var(--teal-dark);font-size:11px;font-weight:700;line-height:22px;text-align:center;border-radius:50%}
.reflection{border-top:1px solid #d3e2d6;padding-top:16px;margin-top:19px}
.reflection-label{display:block;font-size:11px;color:var(--teal-dark);font-weight:750;margin-bottom:5px}
.reflection p{font-size:13px;margin:0 0 8px}
.reflection-hint{font-size:11px;color:var(--muted);line-height:1.8;display:block}

<script id="course-app">
'use strict';
const HERO='__HERO__';
const chapters=__CHAPTERS__;
const availableChapters=chapters.map(c=>c.number);
const requestedChapter=Number(new URLSearchParams(location.search).get('chapter'));
const chapterNumber=availableChapters.includes(requestedChapter)?requestedChapter:1;
const activeChapter=chapters.find(c=>c.number===chapterNumber);
const chapterTitle=activeChapter.title;
const chapterCode=String(chapterNumber).padStart(2,'0');
function chapterStorageKey(n){return n===1?'smartphone-safe-use-cert:v1':`smartphone-safe-use-cert:chapter${n}:v1`;}
const STORAGE_KEY=chapterStorageKey(chapterNumber);
const RULES_KEY='smartphone-safe-use-cert:family:v1';
const CONTENT_VERSION=1;
const roadmap=['スマホを持つ目的と責任','インターネットの仕組み','Web・アプリ・クラウド','URL・通信・履歴','アカウントと本人確認','パスワードと認証','端末とアプリの安全','詐欺とフィッシング','個人情報と情報漏えい','写真・動画・位置情報','投稿とデジタルの足跡','SNSと人間関係','ネットいじめと加害行為','知らない人との交流','性的な被害と脅迫','お金・課金・契約','犯罪への勧誘','情報の確かめ方','おすすめと広告の仕組み','生成AI','法律と他人の権利','使いすぎを防ぐ仕組み','健康・公共の場・現実の安全','トラブル時の行動'];
const lessons=activeChapter.lessons||__LESSONS__;
const chapterOneQuestions=[
{id:'purpose',tag:'使う目的',q:'スマホを受け取る前に、家族と話しておくとよいことは？',options:['使う目的や、困ったときの相談方法','好きなケースの色だけ','どれだけ長く使い続けられるか'],answer:0,why:'使う目的と助けを求める方法を考えることが、安全に使う最初の一歩だよ。',slide:0},
{id:'ownership',tag:'自分と他人の権利',q:'自分のスマホなら、友達の写真を自由に公開してよい？',options:['自分のスマホなので、いつでもよい','相手の気持ちや許可を確かめる必要がある','写真の色を変えれば、確認はいらない'],answer:1,why:'端末が自分のものでも、写っている人のことを勝手に決めてはいけないよ。',slide:1},
{id:'purchase',tag:'操作と許可',q:'ゲームで購入ボタンが押せる状態。家族と決めた購入の約束はまだ確認していない。どうする？',options:['ボタンが押せるので買ってよい','安ければ、いつでも買ってよい','買う前に家族の約束と許可を確認する'],answer:2,why:'操作できることと、購入の許可があることは別だよ。先に確認しよう。',slide:1},
{id:'finish',tag:'時間の使い方',q:'決めた終了時間に、面白そうな動画が次々に出てきた。どうする？',options:['ここで区切り、続きは次の利用時間に見る','おすすめがなくなるまで待つ','見つからなければ続けてよい'],answer:0,why:'おすすめに終わりを任せず、自分で区切ろう。時間の見直しは家族と話し合ってね。',slide:3},
{id:'environment',tag:'やめやすい工夫',q:'寝る前につい通知を見てしまう。どの工夫がよさそう？',options:['通知の音を大きくして、すぐ気づくようにする','家族と相談し、通知を切って寝る場所から離して置く','枕の下に置いて、気合いで見ないようにする'],answer:1,why:'我慢だけに頼らず、通知や置き場所を変えると切り替えやすくなるよ。',slide:2},
{id:'balance',tag:'生活とのバランス',q:'スマホを使い始めて、睡眠や外遊びの時間が減ってきた。どうする？',options:['楽しいので、生活への影響は考えなくてよい','使う時間を隠して、今までどおり続ける','生活への影響を家族と振り返り、使い方を見直す'],answer:2,why:'利用時間の数字だけでなく、大切な生活の時間が守れているかも確かめよう。',slide:2},
{id:'consent',tag:'写真と同意',q:'友達と一緒に撮った写真を、クラスのグループに送りたい。先にすることは？',options:['写っている友達に、どこへ送るかも伝えて確認する','撮影に応じたので、確認せず送る','クラス内なら絶対に広がらないので送る'],answer:0,why:'写真を撮る許可と、送る許可は別。送る相手も伝えて確認しよう。',slide:4},
{id:'no-consent',tag:'相手の意思',q:'友達に「その写真は送らないで」と言われた。どうする？',options:['面白い写真なら、送ってから謝る','友達の意思を尊重して送らない','名前を消せば、いつでも送ってよい'],answer:1,why:'相手の「送らないで」を尊重しよう。名前を消しただけで、自由に送れるわけではないよ。',slide:4},
{id:'pause',tag:'急がされる場面',q:'「今すぐ返事して。誰にも聞かないで」と言われ、判断に迷った。どうする？',options:['急がれているので、すぐ従う','友達の紹介なら何でも信じる','いったん止まり、信頼できる大人に相談する'],answer:2,why:'急がされても、その場で決めなくていいよ。迷ったときに相談するのも、大切な判断だよ。',slide:5},
{id:'pressure',tag:'断る力',q:'友達から「友達なら約束の時間を超えても返信して」と言われた。どうする？',options:['返信できる時間を伝え、困ったら大人に相談する','友達のためなら、必ず徹夜して返信する','家族には隠して使い続ける'],answer:0,why:'友達を大切にすることと、いつでも応じることは別。自分の時間と約束も守っていいよ。',slide:5},
{id:'ask-help',tag:'重要：助けを求める',critical:true,q:'約束を破って知らない相手に写真を送ったら、お金を要求された。どうする？',options:['怒られたくないので、誰にも相談しない','追加の写真やお金を送らず、すぐ信頼できる大人に相談する','一度だけ払って、必ず終わると信じる'],answer:1,why:'約束を破ったあとでも、助けを求めていいよ。要求に一人で応じず、まず安全を守ろう。',slide:6},
{id:'trusted',tag:'相談する相手',q:'困ったことを保護者にすぐ話せない。どうすればよい？',options:['保護者に言えないなら、誰にも相談できない','困らせている相手だけを頼る','先生など、別の信頼できる大人にも相談する'],answer:2,why:'相談できる相手は一人だけではないよ。信頼できる大人につながることを優先しよう。',slide:6},
{id:'family',tag:'家族のルール',q:'家族のスマホルールは、どう決めるとよい？',options:['使う目的や生活を守る理由を話し合って決める','子どもだけが一方的に我慢し、親は約束しない','一度決めたら、事情が変わっても話し合わない'],answer:0,why:'理由を確かめながら家族で決め、使ってみて困ったことは見直そう。',slide:7},
{id:'parent',tag:'親にも約束',q:'親側にも必要な約束は、どれ？',options:['子どもの写真は、親なら自由に公開してよい','子どもの相談を落ち着いて聞き、写真の公開も本人に確認する','子どもの相談は必ず罰から始める'],answer:1,why:'親も相手を尊重する約束を守ることで、安心して相談できる関係をつくろう。',slide:7},
{id:'review',tag:'ルールの見直し',q:'学校の連絡に必要な時間と、家族の利用ルールが合わなくなった。どうする？',options:['こっそり制限を回避する','必要な連絡も全部あきらめる','何に困っているか説明し、家族とルールを見直す'],answer:2,why:'ルールは生活を助けるためのもの。困る理由を伝え、一緒に調整しよう。',slide:7},
{id:'end-plan',tag:'使う前の準備',q:'ゲームを始める前に、切り替えやすくする方法は？',options:['終える時間と、そのあとにすることを決めておく','始めたら気がすむまで続けると決める','終える時間は、おすすめ表示に決めてもらう'],answer:0,why:'始める前に終わりを決めておくと、自分の時間を守る準備ができるよ。',slide:2}
];
const questions=activeChapter.questions||chapterOneQuestions;
function freshState(){return {version:CONTENT_VERSION,slide:0,learned:false,attempts:[],rules:null};}
function sanitizeState(raw,lessonCount=lessons.length){const clean=freshState();if(!raw||raw.version!==CONTENT_VERSION)return clean;clean.slide=Number.isInteger(raw.slide)?Math.max(0,Math.min(lessonCount-1,raw.slide)):0;clean.learned=raw.learned===true;clean.attempts=Array.isArray(raw.attempts)?raw.attempts.filter(a=>a&&Number.isInteger(a.correct)&&a.correct>=0&&a.correct<=10&&typeof a.passed==='boolean'&&typeof a.at==='string').slice(-20):[];if(raw.rules&&typeof raw.rules==='object'){const r=raw.rules;if(['30','60','90','120'].includes(r.minutes)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end)&&['living','hall','family'].includes(r.place)&&['parent','adult'].includes(r.help))clean.rules={minutes:r.minutes,end:r.end,place:r.place,help:r.help};}return clean;}
let storageOK=true;
function readStored(key){try{return JSON.parse(localStorage.getItem(key));}catch{storageOK=false;return null;}}
function load(){const loaded=sanitizeState(readStored(STORAGE_KEY));const shared=readStored(RULES_KEY);const legacy=readStored(chapterStorageKey(1));loaded.rules=sanitizeState({version:1,rules:shared||legacy?.rules||loaded.rules}).rules;return loaded;}
let state=load(), slideChoice=null, slideFeedback=null, exam=null, result=null;
const main=document.getElementById('main');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageOK=false;}}
function shuffle(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createExam(rng=Math.random){const selected=[questions.find(q=>q.critical)];for(let slide=0;slide<lessons.length;slide++){if(selected.some(q=>q.slide===slide))continue;selected.push(shuffle(questions.filter(q=>q.slide===slide),rng)[0]);}const ids=new Set(selected.map(q=>q.id));selected.push(...shuffle(questions.filter(q=>!ids.has(q.id)),rng).slice(0,10-selected.length));return shuffle(selected,rng).map(q=>{const options=shuffle(q.options.map((text,i)=>({text,original:i})),rng);return {...q,options:options.map(o=>o.text),answer:options.findIndex(o=>o.original===q.answer)};});}
function grade(items,answers){const correct=items.reduce((n,q,i)=>n+Number(answers[i]===q.answer),0);const criticalOK=items.every((q,i)=>!q.critical||answers[i]===q.answer);return {correct,total:items.length,criticalOK,passed:correct/items.length>=.9&&criticalOK};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;}
function progress(){document.getElementById('published-label').textContent=`第1〜${availableChapters.at(-1)}章 公開中`;const pct=state.learned?100:Math.round(state.slide/lessons.length*100);document.getElementById('side-percent').textContent=pct+'%';document.getElementById('side-track').style.width=pct+'%';document.getElementById('side-caption').textContent=state.learned?'学習完了。テストに挑戦しよう。':'自分のペースで、少しずつ。';}
function route(){const hash=location.hash;const match=hash.match(/^#\/learn\/(\d+)$/);if(match){const n=Number(match[1]);state.slide=Math.max(0,Math.min(n,state.learned?lessons.length-1:state.slide));save();slideChoice=null;slideFeedback=null;}const path=hash.replace(/^#\/?/,'').split('/')[0]||'home';const page=['home','learn','test','family','about','finish'].includes(path)?path:'home';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===page);if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('breadcrumb').textContent={home:'はじめの一歩',learn:`第${chapterNumber}章を学ぶ`,test:`第${chapterNumber}章の確認テスト`,family:'家族の約束',about:'保護者の方へ',finish:'全課程の最終確認'}[page];document.title=({home:'ホーム',learn:`第${chapterNumber}章 学習`,test:`第${chapterNumber}章 テスト`,family:'家族の約束',about:'保護者の方へ',finish:'全課程の最終確認'}[page])+'｜スマホ安全活用検定';({home:renderHome,learn:renderLearn,test:renderTest,family:renderFamily,about:renderAbout,finish:renderFinish}[page])();progress();if(!storageOK)main.insertAdjacentHTML('afterbegin','<p class="notice">このブラウザでは進み具合を保存できません。ページを閉じると記録が失われる場合があります。</p>');main.focus({preventScroll:true});window.scrollTo(0,0);}
function readChapterState(n){try{return sanitizeState(JSON.parse(localStorage.getItem(chapterStorageKey(n))),chapters.find(c=>c.number===n)?.lessons?.length||8);}catch{return freshState();}}
function renderHome(){const passedCount=availableChapters.filter(n=>(n===chapterNumber?state:readChapterState(n)).attempts.some(a=>a.passed)).length;main.innerHTML=`<section class="hero"><div><p class="eyebrow">LEARN TODAY. USE SMART TOMORROW.</p><h1>スマホと、<br>いい関係を。</h1><p class="lead">はじめてのスマホ。その前に、知っておこう。<br>自分も、友達も守れる使い方を、<br>ひとつずつ身につけよう。</p><div class="actions"><a class="btn" href="#/learn">${state.learned?'もう一度、学習する':state.slide?'学習のつづきへ':`第${chapterNumber}章をはじめる`} <span aria-hidden="true">→</span></a><a class="btn quiet" href="#/about">保護者の方へ ↗</a></div><p class="footnote">1章の目安 約15〜25分 / 途中で休んで、何度でも学習できます</p></div><img class="hero-image" src="${HERO}" alt="スマホの使い方について笑顔で話し合う親子と、盾を持つロボット。周りには本、バスケットボール、月のモチーフ。" width="1200" height="800"></section><section aria-labelledby="steps-title"><div class="section-title"><h2 id="steps-title">できるようになるまでの、3ステップ</h2></div><div class="steps"><article class="step"><span class="step-number">01 / LEARN</span><h3>イラストで学ぶ</h3><p>挿し絵と具体例を読み、<br>「こんなとき」を考えよう。</p></article><article class="step"><span class="step-number">02 / TRY</span><h3>テストで確かめる</h3><p>間違えてもだいじょうぶ。<br>解説を読んで、また挑戦。</p></article><article class="step"><span class="step-number">03 / TALK</span><h3>家族で話し合う</h3><p>わが家に合う使い方を、<br>一緒に決めていこう。</p></article></div></section><section aria-labelledby="chapter-title"><div class="section-title"><h2 id="chapter-title">学ぶ章を選ぼう</h2><span>${chapters.length===24?'全24章を公開中':'全24章を順次公開'}</span></div><div class="course-overview"><strong>公開中 ${chapters.length}章</strong><span>学習画面 ${chapters.length*8}項目 · 確認テスト合格 ${passedCount} / ${chapters.length}章</span><p>一度に全部進めなくていいよ。1章ずつ学んで、家族と話し合おう。</p><a class="btn secondary small" href="#/finish">修了状況と親子の最終確認 →</a></div><div class="chapter-grid">${availableChapters.map(n=>{const record=n===chapterNumber?state:readChapterState(n);const course=chapters.find(c=>c.number===n);const title=course.title;const done=record.attempts.some(a=>a.passed);return `<article class="chapter"><div class="chapter-inner"><div class="chapter-num">${String(n).padStart(2,'0')}</div><div class="chapter-copy"><span class="badge">${done?'✓ 確認テスト合格':record.learned?'✓ 学習完了':'公開中'}</span><h3>${esc(title)}</h3><p>${esc(course.description)}</p></div><a class="btn secondary small" href="?chapter=${n}#/learn">学習する →</a></div><div class="chapter-bottom"><span>8つの学習画面 / 3つの考える問題 / 確認テスト10問</span><a href="?chapter=${n}#/test">確認テストへ →</a></div></article>`;}).join('')}</div>${chapters.length<roadmap.length?`<details><summary>これから学ぶテーマを見る（残り${roadmap.length-chapters.length}章・準備中）</summary><ol class="roadmap">${roadmap.slice(chapters.length).map((t,i)=>`<li><span class="num">${String(i+chapters.length+1).padStart(2,'0')}</span>${t} <span class="subtle">· 準備中</span></li>`).join('')}</ol></details>`:''}</section><p class="footnote">現在は第1〜${availableChapters.at(-1)}章を公開しています。全24章の合格後は、親子の最終確認へ進もう。スマホを渡す最終判断は保護者が行います。</p>`;}
function chapterMenu(){return `<details class="chapter-picker"><summary>第${chapterNumber}章を学習中 · 別の章を選ぶ</summary><div class="chapter-links">${chapters.map(c=>`<a href="?chapter=${c.number}#/learn" ${c.number===chapterNumber?'aria-current="page"':''}><span>${String(c.number).padStart(2,'0')}</span>${esc(c.title)}</a>`).join('')}</div><p class="subtle">進み具合は章ごとに保存されます。</p></details>`;}
function chapterSources(){return chapters.filter(c=>c.sources?.length).map(c=>`<details class="chapter-sources"><summary>第${c.number}章 ${esc(c.title)} の参考資料</summary><ul class="source-list">${c.sources.map(source=>`<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} ↗</a><br>${esc(source.note)}<br><span class="subtle">確認日：${esc(source.checked)}</span></li>`).join('')}</ul></details>`).join('');}
function visual(lesson){const panel=lesson.imagePanel;const atlas=Number.isInteger(panel);return `<figure class="lesson-figure"><div class="illustration-frame ${atlas?'atlas-frame':''}"><img src="${esc(lesson.image)}" alt="${esc(lesson.imageAlt)}" ${atlas?`style="left:${-(panel%2)*100}%;top:${-Math.floor(panel/2)*100}%"`:'width="1200" height="675"'} decoding="async"></div><figcaption>${esc(lesson.caption)}</figcaption></figure>`;}
function renderExample(example){return `<section class="lesson-example" aria-labelledby="example-title"><p class="section-kicker">たとえば、こんな場面</p><h3 id="example-title">${esc(example.title)}</h3>${example.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${example.dialogue?`<div class="dialogue" aria-label="伝え方の例">${example.dialogue.map(line=>`<p class="dialogue-line"><strong>${esc(line.speaker)}</strong><span>「${esc(line.text)}」</span></p>`).join('')}</div>`:''}${example.note?`<p class="example-note">${esc(example.note)}</p>`:''}</section>`;}
function renderLearn(){
  const s=lessons[state.slide],check=s.check;
  main.innerHTML=`${chapterMenu()}<div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode}</p><h1>${chapterTitle}</h1><p class="subtle">説明 → 具体例 → やってみること。ひとつずつ、読んでみよう。</p></div><span class="page-count">${state.slide+1} / ${lessons.length}</span></div>
  <div class="slide-dots" role="img" aria-label="${lessons.length}画面中${state.slide+1}画面目">${lessons.map((_,i)=>`<span class="${i===state.slide?'current':i<state.slide?'done':''}"></span>`).join('')}</div>
  <article class="slide-card" aria-labelledby="lesson-title">
    <div class="slide-content"><div class="slide-text"><p class="eyebrow">${esc(s.label)}</p><h2 id="lesson-title">${esc(s.title)}</h2><p>${esc(s.body)}</p><h3 class="why-title">${esc(s.explanationTitle)}</h3><p>${esc(s.body2)}</p></div>${visual(s)}</div>
    <div class="lesson-details">${renderExample(s.example)}<section class="lesson-actions" aria-labelledby="action-title"><p class="section-kicker">自分なら、どうする？</p><h3 id="action-title">${esc(s.actionTitle)}</h3><ol class="action-list">${s.actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><div class="reflection"><span class="reflection-label">ちょっと考えよう</span><p>${esc(s.reflect)}</p><span class="reflection-hint">答えの入力はいらないよ。頭の中で考えたり、家族と話したりしてみよう。</span></div></section></div>
    <div class="takeaway"><strong>POINT</strong><span>${esc(s.key)}</span></div>
  </article>
  ${check?`<section class="choice-box" aria-labelledby="check-title"><p class="eyebrow">ここまでの内容を、確かめよう</p><h3 id="check-title">${check.prompt}</h3><div class="options">${check.options.map((o,i)=>`<button class="option ${slideChoice===i?'chosen':''}" data-choice="${i}" aria-pressed="${slideChoice===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div id="lesson-feedback" role="status">${slideFeedback?`<div class="feedback ${slideFeedback.good?'good':''}"><strong>${slideFeedback.good?'その考え方でOK！':'もう一度、考えてみよう。'}</strong><p>${slideFeedback.text}</p></div>`:''}</div></section>`:''}
  <div class="lesson-controls"><button class="btn secondary" data-action="prev-slide" ${state.slide===0?'disabled':''}>← 前へ</button><span class="subtle">${check?'答えを選ぶと進めるよ':'読み終わったら、次へ'}</span><button class="btn" data-action="next-slide" ${check&&(!slideFeedback||!slideFeedback.good)?'disabled':''}>${state.slide===lessons.length-1?'学習を終えて、テストへ':'次へ →'}</button></div><div class="bottom-links"><a href="#/">ホームへ戻る</a><a href="#/about">参考資料を見る</a></div>`;
}
function renderTest(){if(!state.learned){main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>まずは、お話を読んでみよう。</h1><div class="panel"><p>テストは、第${chapterNumber}章の${lessons.length}つの画面と、途中の考える問題を終えると受けられるよ。</p><p class="subtle">急がなくてだいじょうぶ。前の画面にも戻れるよ。</p><a class="btn" href="#/learn">学習${state.slide?'のつづき':'をはじめる'} →</a></div></div>`;return;}if(result){renderResult();return;}if(exam){renderQuestion();return;}const last=state.attempts.at(-1);main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>「わかった」を、確かめよう。</h1><p class="subtle">第${chapterNumber}章「${chapterTitle}」確認テスト</p><div class="panel"><span class="badge">✓ 学習完了</span><div class="exam-stats"><div class="stat"><strong>10問</strong>選択式の場面問題</div><div class="stat"><strong>90点以上</strong>合格の目安</div><div class="stat"><strong>何度でも</strong>時間制限なし</div></div><ul class="check-list"><li>合格には、10問中9問以上の正解が必要。</li><li>安全な行動を選ぶ重要問題は、必ず正解しよう。</li><li>答えを選んだあと、最後にまとめて採点するよ。</li><li>間違えた問題は、解説とお話を見て学び直せるよ。</li></ul><p class="subtle">8つの学習項目すべてから出題します。問題と選択肢の順番は、受けるたびに変わります。途中の回答はページを再読み込みすると失われます。</p>${button('テストをはじめる →','start-exam')}<div class="bottom-links"><a href="#/learn">学習を読み返す</a></div></div>${last?`<p class="subtle">前回の結果：${last.correct*10}点 · ${last.passed?`第${chapterNumber}章 合格`:'学び直して、もう一度挑戦しよう'}</p>`:''}</div>`;}
function renderQuestion(){const q=exam.items[exam.index];main.innerHTML=`<div class="narrow"><div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>第${chapterNumber}章 確認テスト</h1></div><span class="page-count">${exam.index+1} / 10 問</span></div><div class="track"><span style="width:${(exam.index+1)*10}%"></span></div><section class="panel" aria-labelledby="question-title"><p class="question-meta">Q${String(exam.index+1).padStart(2,'0')} / ${q.tag}</p><h2 class="question-title" id="question-title">${q.q}</h2><div class="options" role="group" aria-label="答えを1つ選んでください">${q.options.map((o,i)=>`<button class="option ${exam.answers[exam.index]===i?'chosen':''}" data-answer="${i}" aria-pressed="${exam.answers[exam.index]===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div class="exam-nav"><button class="btn secondary" data-action="prev-question" ${exam.index===0?'disabled':''}>← 前の問題</button><button class="btn" data-action="next-question" ${exam.answers[exam.index]===undefined?'disabled':''}>${exam.index===9?'採点する':'次の問題 →'}</button></div></section><p class="subtle">選んだ答えは、採点するまで変更できます。回答済み ${exam.answers.filter(x=>x!==undefined).length} / 10問</p><button class="btn quiet small" data-action="exit-exam">テストを中断する</button></div>`;}
function renderResult(){const r=result;main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / RESULT</p><section class="panel"><div class="results-score"><span class="result-icon" aria-hidden="true">${r.passed?'✦':'▤'}</span><h1>${r.passed?`第${chapterNumber}章、合格！`:'もう一度、確かめてみよう。'}</h1><div class="score">${r.correct*10}<small> / 100点</small></div><p class="subtle">${r.correct} / ${r.total}問正解 · 重要問題 ${r.criticalOK?'正解':'学び直そう'}</p></div><div class="callout">${r.passed?'安全に使うための、はじめの一歩ができたね。<br>次は家族と、わが家の約束を話し合おう。':'間違いは、気づくチャンス。下の解説を読んで、お話に戻ってみよう。<br>合格は90点以上、かつ重要問題の正解が条件だよ。'}</div><div class="actions">${r.passed?'<a class="btn" href="#/family">家族の約束を話し合う →</a>':''}${r.passed&&availableChapters.includes(chapterNumber+1)?`<a class="btn secondary" href="?chapter=${chapterNumber+1}#/learn">第${chapterNumber+1}章へ →</a>`:''}${r.passed?'<a class="btn secondary" href="#/finish">全課程の修了状況を見る →</a>':''}${button('もう一度テストする','start-exam',r.passed?'secondary':'')}<a class="btn secondary" href="#/learn">学習に戻る</a></div><p class="footnote">第${chapterNumber}章のみの合格です。全課程の修了状況は、親子の最終確認画面で確認できます。スマホを渡す判断は保護者と話し合ってね。</p></section><h2>答えと解説</h2><div class="panel">${r.items.map((q,i)=>{const ok=r.answers[i]===q.answer;return `<article class="review-item"><p class="${ok?'status-good':'status-miss'}">${ok?'✓ 正解':'↻ 学び直し'} · Q${i+1}${q.critical?' · 重要問題':''}</p><h3>${q.q}</h3><p>あなたの答え：${esc(q.options[r.answers[i]])}</p>${!ok?`<p class="status-good">正解：${q.options[q.answer]}</p>`:''}<p>${q.why}</p><a class="subtle" href="#/learn/${q.slide}">学習画面 ${q.slide+1} に戻る →</a></article>`;}).join('')}</div><a href="#/" class="subtle">ホームへ戻る</a></div>`;}
function renderFamily(){const shared=readStored(RULES_KEY);if(shared)state.rules=sanitizeState({version:1,rules:shared}).rules;const r=state.rules||{minutes:'60',end:'20:30',place:'living',help:'parent'};const places={living:'リビングで充電する',hall:'廊下など、寝室以外で充電する',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow">FAMILY TALK</p><h1>わが家の約束を、話そう。</h1><p>子どもだけでなく、大人にも守る約束がある。<br>理由を聞き合いながら、一緒に決めてみよう。</p><div class="callout">これは話し合うための下書きです。表示されている時間は例で、すべての家庭への推奨値ではありません。</div><form id="rules-form" class="panel"><h2>まずは、4つから。</h2><div class="form-grid"><label class="field">娯楽で使う1日の時間の目安<select name="minutes">${['30','60','90','120'].map(n=>`<option value="${n}" ${r.minutes===n?'selected':''}>${n}分</option>`).join('')}</select></label><label class="field">夜に利用を終える時刻<input type="time" name="end" value="${r.end}" required></label><label class="field">夜、スマホを置く場所<select name="place">${Object.entries(places).map(([v,t])=>`<option value="${v}" ${r.place===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">困ったときの相談先<select name="help"><option value="parent" ${r.help==='parent'?'selected':''}>保護者。話せないときは先生など</option><option value="adult" ${r.help==='adult'?'selected':''}>先生など、信頼できる大人</option></select></label></div><p class="subtle" style="margin-top:20px">緊急連絡や学校の連絡など、例外が必要な場合も話し合おう。課金・アプリ追加・写真の共有・外出時の約束も、各章で学んだことを使って話し合おう。</p><button class="btn" type="submit">この端末に下書きを保存</button><p id="rules-status" role="status" class="subtle" style="margin:12px 0 0">${state.rules?'下書きが保存されています。':''}</p></form><section class="panel"><h2>大人からの約束</h2><ul class="check-list"><li>困ったことを相談した、そのこと自体は罰しません。</li><li>まず安全を守り、ルールの振り返りは落ち着いてから。</li><li>子どもの写真を投稿するときも、本人に確認します。</li><li>使い方を確認する範囲は、先に説明します。</li><li>家族の生活や成長に合わせて、一緒に見直します。</li></ul><p class="subtle">この画面の保存だけで、保護者の承認やスマホの設定が完了するわけではありません。実際に親子で話し合って確認してください。</p></section><div class="bottom-links"><a href="#/finish">全課程の修了状況と、親子の最終確認へ →</a></div><p class="footnote">保存先は、このブラウザの中だけです。保護者への自動送信・端末間同期はありません。</p></div>`;document.getElementById('rules-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.rules={minutes:f.get('minutes'),end:f.get('end'),place:f.get('place'),help:f.get('help')};try{localStorage.setItem(RULES_KEY,JSON.stringify(state.rules));}catch{storageOK=false;}save();document.getElementById('rules-status').textContent=storageOK?'下書きを保存しました。家族と話し合って、必要なら変更しよう。':'保存できませんでした。このブラウザの保存設定を確認してください。';});}
function renderAbout(){main.innerHTML=`<div class="narrow"><p class="eyebrow">FOR PARENTS</p><h1>「使わない」より、<br>安全に使う力を。</h1><p>スマホを受け取る前に、親子で学ぶための教材です。現在は、第1〜${availableChapters.at(-1)}章を公開しています。各章の学習とテストは独立して進められます。</p><section class="panel"><h2>今回、確認できること</h2><ul class="check-list"><li>各項目に挿し絵・理由・具体例・行動例を付けた各章8画面と、途中の3つの判断練習。</li><li>各章16問の問題バンクから、重要問題を含む10問を出題。</li><li>問題・選択肢の並べ替え、採点、全問の解説、再受験。</li><li>家族の約束の下書きと、学習進度のブラウザ内保存。</li></ul><p class="subtle">合格条件は90点以上、かつ各章の重要問題への正答です。全24章に合格し、家族の約束を保存して親子の最終確認を終えると、このブラウザに学習の修了記録を残せます。</p></section><section class="panel"><h2>親子で使うときに</h2><p>点数だけで判断せず、「なぜその答えを選んだか」「実際に困ったとき、誰にどう話すか」も確かめてください。学習と家庭内ルールに加え、端末の安全設定も必要です。</p><p>ルール違反の振り返りと、被害相談への対応は分けます。まずは安全の確保を優先し、相談したこと自体を罰しない関係をつくることを、この教材では大切にしています。</p><p class="subtle">保護者向けの画面に認証はありません。子どもも閲覧できます。これは監視アプリや利用制限アプリではなく、学習用のサイトです。</p></section><section class="panel"><h2>参考にした一次情報</h2><p class="subtle">各章の教材設計で参照。家庭での約束例や合格基準は、本サイト独自の提案です。確認日：2026年11月17日。</p><ul class="source-list"><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/leaflet/" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発リーフレット集 ↗</a><br>家庭のルール、安全設定、ネットでのトラブルについて。</li><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/internet_use_keihatu" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発コンテンツ ↗</a><br>親子のルールづくりと、安全に利用するための教材。</li><li><a href="https://www.npa.go.jp/bureau/cyber/countermeasures/defamation.html" target="_blank" rel="noopener noreferrer">警察庁：インターネット上の誹謗中傷等への対応 ↗</a><br>写真や個人情報を安易に掲載しないなどの被害防止策。</li><li><a href="https://www.nic.ad.jp/ja/basics/beginners/dns.html" target="_blank" rel="noopener noreferrer">JPNIC：DNSとは ↗</a><br>第2章：ドメイン名とIPアドレスの関係。</li><li><a href="https://developer.mozilla.org/ja/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works" target="_blank" rel="noopener noreferrer">MDN：ウェブのしくみ ↗</a><br>第2章：クライアント・サーバー、通信とパケット。</li></ul>${chapterSources()}</section><section class="panel"><h2>記録とプライバシー</h2><p>本サイトには、名前・メールアドレス・本物のパスワードを入力する欄はありません。学習進度、章ごとの直近20回の点数、家族ルールの下書きと親子の最終確認・修了記録は、このブラウザのlocalStorageに保存します。</p><p>本サイトのコードから学習記録を外部へ送信する機能や、アクセス解析、広告は入れていません。配信基盤のGitHub Pagesでは、通信に伴う情報が処理されます。別の端末との同期はなく、ブラウザのデータを消すと記録も消えます。</p><p class="subtle">イラストは生成AIで制作した教材用の画像です。実在する親子の写真ではありません。</p><button class="btn secondary small" data-action="reset">この章の学習記録をリセット</button><p id="reset-status" role="status" class="subtle"></p></section><div class="bottom-links"><a href="https://github.com/inamuu/smartphone-safe-use-cert" target="_blank" rel="noopener noreferrer">ソースコード ↗</a><a href="https://inamuu.github.io/links/">inamuu links ↗</a><a href="#/">ホームへ</a></div></div>`;}

const COMPLETION_KEY='smartphone-safe-use-cert:completion:v1';
const finalChecks=[
 ['purpose','何のためにスマホを使うか、自分の言葉で説明した。'],
 ['time','使う時間・終える時刻・置き場所と、緊急連絡などの例外を家族と決めた。'],
 ['apps','アプリ追加・年齢条件・課金や定期購入は、先に保護者と確認すると話した。'],
 ['account','端末ロック・固有のパスワード・追加の認証・復元方法を、家族と確認した。'],
 ['privacy','写真や個人情報を送る前の確認を、具体例で説明した。'],
 ['people','嫌な要求は断ってよく、友達や知らない相手へ秘密や認証コードを渡さないと確認した。'],
 ['information','うわさ・広告・AIの答えを、そのまま信じたり広めたりしない方法を説明した。'],
 ['rights','他人のアカウント・写真・作品・気持ちを大切にする理由を話した。'],
 ['health','睡眠や運動を守り、歩行中・自転車の運転中など危ない場面では使わないと確認した。'],
 ['help','困ったら追加の操作や支払いを止め、相談する大人を複数決めた。'],
 ['parents','大人も、相談したこと自体を罰せず、確認する範囲を先に説明すると約束した。'],
 ['review','実際の端末の安全設定を親子で確認し、ルールを見直す時期を決めた。']
];
function sanitizeCompletion(raw){const clean={version:1,checked:[],completedAt:null};if(!raw||raw.version!==1)return clean;const ids=finalChecks.map(([id])=>id);clean.checked=Array.isArray(raw.checked)?[...new Set(raw.checked.filter(id=>ids.includes(id)))]:[];if(clean.checked.length===ids.length&&typeof raw.completedAt==='string'&&Number.isFinite(Date.parse(raw.completedAt)))clean.completedAt=raw.completedAt;return clean;}
let completion=sanitizeCompletion(readStored(COMPLETION_KEY));
function saveCompletion(){try{localStorage.setItem(COMPLETION_KEY,JSON.stringify(completion));return true;}catch{storageOK=false;return false;}}
function courseStatus(){const records=roadmap.map((title,index)=>{const number=index+1;const published=availableChapters.includes(number);const record=number===chapterNumber?state:readChapterState(number);return {number,title,published,learned:published&&record.learned,passed:published&&record.learned&&record.attempts.some(a=>a.passed&&a.correct>=9)};});const passed=records.filter(c=>c.passed).length;return {records,passed,complete:chapters.length===roadmap.length&&passed===roadmap.length};}
function currentRules(){const raw=readStored(RULES_KEY)||readStored(chapterStorageKey(1))?.rules||state.rules;return sanitizeState({version:1,rules:raw}).rules;}
function canComplete(){return courseStatus().complete&&!!currentRules()&&completion.checked.length===finalChecks.length;}
function completeCourse(){if(!canComplete())return false;completion.completedAt=new Date().toISOString();const saved=saveCompletion();renderFinish();if(!saved)document.getElementById('finish-status').textContent='この画面の修了記録は作れましたが、ブラウザに保存できませんでした。ページを閉じると失われます。';main.focus({preventScroll:true});window.scrollTo(0,0);return saved;}
function renderFinish(){const status=courseStatus(),rules=currentRules();const eligible=status.complete&&!!rules;const recorded=eligible&&completion.checked.length===finalChecks.length&&!!completion.completedAt;const places={living:'リビングで充電',hall:'廊下など寝室以外で充電',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow no-print">FINISH / FAMILY REVIEW</p><h1 class="no-print">学んだことを、わが家の力に。</h1><p class="no-print">24章を少しずつ学んで、全部の章別テストに合格したら、最後に親子で話し合おう。点数だけでなく、実際にどう行動するかを確かめる時間だよ。</p><div class="panel no-print"><h2>章別テストの合格 ${status.passed} / 24章</h2><div class="track"><span style="width:${Math.round(status.passed/24*100)}%"></span></div><p class="subtle">各章10問中9問以上、かつ重要問題への正答が合格条件。何度でも学び直せます。</p>${status.complete?'<p class="status-good">すべての章別テストに合格しました。</p>':'<p>まだ合格していない章は、下の一覧から学ぼう。</p>'}<div class="completion-grid">${status.records.map(c=>`<div class="completion-row"><span class="${c.passed?'status-good':'subtle'}">${c.passed?'✓':String(c.number).padStart(2,'0')}</span>${c.published?`<a href="?chapter=${c.number}#/${c.learned?'test':'learn'}">${esc(c.title)}</a>`:`<span>${esc(c.title)}</span>`}<small>${c.passed?'合格':!c.published?'準備中':c.learned?'テストへ':'学習へ'}</small></div>`).join('')}</div></div><section class="panel no-print"><h2>わが家の約束を確認</h2>${rules?`<p>娯楽の目安：1日${esc(rules.minutes)}分 / 夜の終了：${esc(rules.end)}<br>${esc(places[rules.place])}<br>相談先：${rules.help==='parent'?'保護者。話せないときは先生など':'先生など信頼できる大人'}</p>`:'<p>家族の約束の下書きは、まだ保存されていません。先に家族と話して保存しよう。</p>'}<a href="#/family">家族の約束を見直す →</a><p class="subtle">この4項目だけでなく、アプリ・課金・共有・端末の安全設定も、以下で確認しよう。</p></section><section class="panel completion-checklist no-print"><h2>親子で確認する12のこと</h2><p>子どもが理由や行動例を話し、大人も自分の約束を確認します。入力欄に秘密を打ったり、危険な操作を試したりする必要はありません。</p>${finalChecks.map(([id,label])=>`<label class="finish-check"><input type="checkbox" data-finish-check="${id}" ${completion.checked.includes(id)?'checked':''}><span>${esc(label)}</span></label>`).join('')}<p class="notice">このチェックは保護者認証ではありません。親子で同じ画面を見て話し合ってください。スマホを渡す判断と、実際の端末設定は保護者が行います。</p><button id="complete-course" class="btn" data-action="complete-course" ${canComplete()?'':'disabled'}>親子で確認して、修了の記録を残す</button><p id="finish-status" class="subtle" role="status">${!status.complete?'全24章の合格が必要です。':!rules?'家族の約束を先に保存しよう。':!canComplete()?'12項目を話し合って確認しよう。':'修了の記録を残せます。'}</p></section>${recorded?`<article id="completion-certificate" class="certificate"><span class="badge">全24章 章別確認テスト合格</span><h2>スマホ安全活用検定<br>学習の修了記録</h2><p>192項目を学び、全24章の確認テストに合格しました。<br>家族の約束と、親子の最終確認を記録しました。</p><p class="certificate-date">記録日：${esc(new Date(completion.completedAt).toLocaleDateString('ja-JP'))}</p><p>困ったら止まって相談する。<br>自分も、周りの人も大切にしながら使おう。</p><p class="footnote">このブラウザ内の学習・自己確認の記録です。公的資格、本人確認、保護者による利用許可を証明するものではありません。</p></article><div class="no-print actions"><button id="print-completion" class="btn secondary" data-action="print-completion">修了の記録を印刷する</button></div>`:''}<p class="footnote no-print">最終確認と修了記録も、このブラウザに保存します。名前の入力や保護者への自動送信はありません。別の端末では引き継がれません。章の記録をリセットすると、再合格するまで修了の記録は表示されません。</p><div class="bottom-links no-print"><a href="#/">章の一覧へ</a><a href="#/about">保護者の方へ・参考資料</a></div></div>`;}
main.addEventListener('change',e=>{const id=e.target.dataset?.finishCheck;if(!finalChecks.some(([key])=>key===id))return;completion.checked=e.target.checked?[...new Set([...completion.checked,id])]:completion.checked.filter(key=>key!==id);completion.completedAt=null;saveCompletion();const certificate=document.getElementById('completion-certificate');if(certificate)certificate.hidden=true;const printButton=document.getElementById('print-completion');if(printButton)printButton.disabled=true;document.getElementById('complete-course').disabled=!canComplete();document.getElementById('finish-status').textContent=!storageOK?'保存できませんでした。ブラウザの保存設定を確認してください。':canComplete()?'修了の記録を残せます。':'全24章の合格、家族の約束の保存、12項目の確認が必要です。';});
main.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const check=lessons[state.slide].check;slideChoice=Number(choice.dataset.choice);const good=slideChoice===check.answer;slideFeedback={good,text:check.explain};renderLearn();main.querySelector(`[data-choice="${slideChoice}"]`).focus({preventScroll:true});return;}const answer=e.target.closest('[data-answer]');if(answer&&exam){exam.answers[exam.index]=Number(answer.dataset.answer);renderQuestion();main.querySelector(`[data-answer="${answer.dataset.answer}"]`).focus({preventScroll:true});return;}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'complete-course':completeCourse();break;case'print-completion':if(canComplete()&&completion.completedAt)window.print();break;case'prev-slide':if(state.slide>0){state.slide--;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'next-slide':if(lessons[state.slide].check&&!slideFeedback?.good)return;if(state.slide===lessons.length-1){state.learned=true;save();exam=null;result=null;location.hash='/test';}else{state.slide++;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'start-exam':if(!state.learned)return;exam={items:createExam(),answers:[],index:0};result=null;renderQuestion();main.focus();window.scrollTo(0,0);break;case'prev-question':if(exam&&exam.index>0){exam.index--;renderQuestion();main.focus();window.scrollTo(0,0);}break;case'next-question':if(!exam||exam.answers[exam.index]===undefined)return;if(exam.index<9){exam.index++;renderQuestion();}else{result={...grade(exam.items,exam.answers),items:exam.items,answers:[...exam.answers]};state.attempts.push({correct:result.correct,passed:result.passed,at:new Date().toISOString()});state.attempts=state.attempts.slice(-20);save();exam=null;renderResult();}main.focus();window.scrollTo(0,0);break;case'exit-exam':if(confirm('テストを中断しますか？ 途中の回答は消えます。学習の進み具合は残ります。')){exam=null;renderTest();main.focus();}break;case'reset':if(confirm('この章の学習の進み具合とテスト結果をリセットしますか？ 家族の約束と他の章の記録は残ります。')){const rules=state.rules;state=freshState();state.rules=rules;exam=null;result=null;slideChoice=null;slideFeedback=null;save();progress();document.getElementById('reset-status').textContent=storageOK?'学習記録をリセットしました。':'保存領域を更新できませんでした。ブラウザのサイトデータ設定から削除してください。';}break;}});
window.addEventListener('hashchange',route);
route();
</script>
