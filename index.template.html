const lessons=[
{label:'はじめの一歩',title:'スマホで、何をしたい？',body:'家族に連絡する。好きなことを調べる。友達と話す。<br>スマホは、きみの「やりたい」を手伝ってくれる道具だよ。',body2:'この章では、便利さを楽しみながら、自分と周りの人を守る使い方を考えよう。',visual:'family',key:'「何のために使うか」を、家族と話してみよう。'},
{label:'持つことと、使ってよいこと',title:'自分のスマホでも、何でも自由？',body:'自分のスマホでも、友達の写真や家族のお金は、自分だけのものではないよ。',body2:'写真を載せる、アプリを入れる、お金を使う。<br>「操作できる」と「してよい」は、別のことなんだ。',visual:'shield',key:'自分の端末でも、他の人の権利と家族の約束を守ろう。'},
{label:'生活の中のスマホ',title:'楽しいことは、画面の外にも。',body:'動画やゲームは楽しいね。でも、寝る時間や、食事、勉強、運動の時間も大切。',body2:'使う前に「何をするか」「いつ終えるか」を決めると、切り替えやすくなるよ。通知を切る、寝る前に離れた場所に置くのも方法の一つ。',visual:'balance',key:'気合いだけに任せず、やめやすい環境をつくろう。'},
{label:'考えてみよう ①',title:'「あと1本」見たい夜。',body:'家族と決めた終了時間になった。でも、おすすめに面白そうな動画が出てきた。',body2:'こんなとき、どうする？<br>この場面では、どの行動が約束と生活を守れるかな。',visual:'night',key:'終わりを決めておくのは、自分の時間を守るため。',check:{prompt:'決めた終了時間。どれを選ぶ？',options:['今日はここで終わり、続きは次の利用時間に見る','おすすめが出なくなるまで見続ける','家族に分からないように音を消して見る'],answer:0,explain:'おすすめは次々に出てくることがあるよ。自分で区切ろう。時間の約束を変えたいときは、隠して延ばさず、家族と相談してね。'}},

function freshState(){return {version:CONTENT_VERSION,slide:0,learned:false,attempts:[],rules:null};}
function sanitizeState(raw){const clean=freshState();if(!raw||raw.version!==CONTENT_VERSION)return clean;clean.slide=Number.isInteger(raw.slide)?Math.max(0,Math.min(lessons.length-1,raw.slide)):0;clean.learned=raw.learned===true;clean.attempts=Array.isArray(raw.attempts)?raw.attempts.filter(a=>a&&Number.isInteger(a.correct)&&a.correct>=0&&a.correct<=10&&typeof a.passed==='boolean'&&typeof a.at==='string').slice(-20):[];if(raw.rules&&typeof raw.rules==='object'){const r=raw.rules;if(['30','60','90','120'].includes(r.minutes)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end)&&['living','hall','family'].includes(r.place)&&['parent','adult'].includes(r.help))clean.rules={minutes:r.minutes,end:r.end,place:r.place,help:r.help};}return clean;}
let storageOK=true;
function load(){try{return sanitizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)));}catch{storageOK=false;return freshState();}}
let state=load(), slideChoice=null, slideFeedback=null, exam=null, result=null;
const main=document.getElementById('main');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageOK=false;}}
function shuffle(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createExam(rng=Math.random){const critical=questions.find(q=>q.critical);return shuffle([critical,...shuffle(questions.filter(q=>!q.critical),rng).slice(0,9)],rng).map(q=>{const options=shuffle(q.options.map((text,i)=>({text,original:i})),rng);return {...q,options:options.map(o=>o.text),answer:options.findIndex(o=>o.original===q.answer)};});}
function grade(items,answers){const correct=items.reduce((n,q,i)=>n+Number(answers[i]===q.answer),0);const criticalOK=items.every((q,i)=>!q.critical||answers[i]===q.answer);return {correct,total:items.length,criticalOK,passed:correct/items.length>=.9&&criticalOK};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;}
function progress(){const pct=state.learned?100:Math.round(state.slide/lessons.length*100);document.getElementById('side-percent').textContent=pct+'%';document.getElementById('side-track').style.width=pct+'%';document.getElementById('side-caption').textContent=state.learned?'学習完了。テストに挑戦しよう。':'自分のペースで、少しずつ。';}
function route(){const hash=location.hash;const match=hash.match(/^#\/learn\/(\d+)$/);if(match){const n=Number(match[1]);state.slide=Math.max(0,Math.min(n,state.learned?lessons.length-1:state.slide));save();slideChoice=null;slideFeedback=null;}const path=hash.replace(/^#\/?/,'').split('/')[0]||'home';const page=['home','learn','test','family','about'].includes(path)?path:'home';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===page);if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('breadcrumb').textContent={home:'はじめの一歩',learn:'第1章を学ぶ',test:'第1章の確認テスト',family:'家族の約束',about:'保護者の方へ'}[page];document.title=({home:'ホーム',learn:'第1章 学習',test:'第1章 テスト',family:'家族の約束',about:'保護者の方へ'}[page])+'｜スマホ安全活用検定';({home:renderHome,learn:renderLearn,test:renderTest,family:renderFamily,about:renderAbout}[page])();progress();if(!storageOK)main.insertAdjacentHTML('afterbegin','<p class="notice">このブラウザでは進み具合を保存できません。ページを閉じると記録が失われる場合があります。</p>');main.focus({preventScroll:true});window.scrollTo(0,0);}
function renderHome(){const passed=state.attempts.some(a=>a.passed);main.innerHTML=`<section class="hero"><div><p class="eyebrow">LEARN TODAY. USE SMART TOMORROW.</p><h1>スマホと、<br>いい関係を。</h1><p class="lead">はじめてのスマホ。その前に、知っておこう。<br>自分も、友達も守れる使い方を、<br>ひとつずつ身につけよう。</p><div class="actions"><a class="btn" href="#/learn">${state.learned?'もう一度、学習する':state.slide?'学習のつづきへ':'第1章をはじめる'} <span aria-hidden="true">→</span></a><a class="btn quiet" href="#/about">保護者の方へ ↗</a></div><p class="footnote">目安 約5〜10分 / 何度でも学習できます</p></div><img class="hero-image" src="${HERO}" alt="スマホの使い方について笑顔で話し合う親子と、盾を持つロボット。周りには本、バスケットボール、月のモチーフ。" width="1200" height="800"></section><section aria-labelledby="steps-title"><div class="section-title"><h2 id="steps-title">できるようになるまでの、3ステップ</h2></div><div class="steps"><article class="step"><span class="step-number">01 / LEARN</span><h3>イラストで学ぶ</h3><p>短いお話を読みながら、<br>「こんなとき」を考えよう。</p></article><article class="step"><span class="step-number">02 / TRY</span><h3>テストで確かめる</h3><p>間違えてもだいじょうぶ。<br>解説を読んで、また挑戦。</p></article><article class="step"><span class="step-number">03 / TALK</span><h3>家族で話し合う</h3><p>わが家に合う使い方を、<br>一緒に決めていこう。</p></article></div></section><section aria-labelledby="chapter-title"><div class="section-title"><h2 id="chapter-title">今回のレッスン</h2><span>全24章を順次作成予定</span></div><article class="chapter"><div class="chapter-inner"><div class="chapter-num">01</div><div class="chapter-copy"><span class="badge">${passed?'✓ 確認テスト合格':state.learned?'✓ 学習完了':'公開中'}</span><h3>スマホを持つ目的と責任</h3><p>便利さを楽しむための、はじめの約束。</p></div><a class="btn secondary small" href="#/learn">学習する <span aria-hidden="true">→</span></a></div><div class="chapter-bottom"><span>8つの学習画面 / 3つの考える問題 / 確認テスト10問</span><span>自分のペースでOK</span></div></article><details><summary>これから学ぶテーマを見る（残り23章・準備中）</summary><ol class="roadmap">${roadmap.slice(1).map((t,i)=>`<li><span class="num">${String(i+2).padStart(2,'0')}</span>${t} <span class="subtle">· 準備中</span></li>`).join('')}</ol></details></section><p class="footnote">この版は第1章の確認用です。第1章の合格は、全課程の修了やスマホを渡す最終判断を意味しません。</p>`;}
function visual(type){if(type==='family')return `<div class="slide-visual photo"><img src="${HERO}" alt="スマホをテーブルに置き、使い方を話し合う親子" width="1200" height="800"></div>`;const shapes={shield:'<div class="shield" aria-hidden="true">✓</div><p class="scene-title">できること ≠ してよいこと</p><p class="scene-caption">自分の自由と、相手の権利。<br>どちらも大切に。</p>',balance:'<div class="balance-grid"><div class="balance-item"><span aria-hidden="true">☾</span>ねむる</div><div class="balance-item"><span aria-hidden="true">▤</span>まなぶ</div><div class="balance-item"><span aria-hidden="true">🏀</span>あそぶ</div><div class="balance-item"><span aria-hidden="true">♧</span>はなす</div></div><p class="scene-title">画面の外の時間も、きみのもの。</p>',night:'<div class="phone"><span class="scene-icon" aria-hidden="true">☾</span><p class="scene-title">今日はここまで。</p><div class="bubble">続きは、次の利用時間に。</div></div><p class="scene-caption">終了時間は、家族と決めよう。</p>',photo:'<div class="phone"><span class="scene-icon" aria-hidden="true">▣</span><div class="bubble">この写真、クラスのグループに<br>送ってもいい？</div><div class="bubble reply">確認してくれて、ありがとう。</div></div>',pause:'<div class="shield" aria-hidden="true">Ⅱ</div><p class="scene-title">① 止まる　② 確かめる<br>③ 相談する</p><p class="scene-caption">すぐに答えなくていい。</p>',help:'<div class="phone"><div class="bubble">困っていることがあるんだ。<br>一緒に考えてほしい。</div><div class="bubble reply">話してくれて、ありがとう。<br>まずは安全を守ろう。</div></div><p class="scene-caption">失敗したあとでも、相談していい。</p>'};return `<div class="slide-visual"><div class="scene">${shapes[type]}</div></div>`;}
function renderLearn(){const s=lessons[state.slide],check=s.check;main.innerHTML=`<div class="lesson-head"><div><p class="eyebrow">CHAPTER 01</p><h1>スマホを持つ目的と責任</h1><p class="subtle">少しずつ読んで、いっしょに考えよう。</p></div><span class="page-count">${state.slide+1} / ${lessons.length}</span></div><div class="slide-dots" role="img" aria-label="8画面中${state.slide+1}画面目">${lessons.map((_,i)=>`<span class="${i===state.slide?'current':i<state.slide?'done':''}"></span>`).join('')}</div><article class="slide-card"><div class="slide-content"><div class="slide-text"><p class="eyebrow">${s.label}</p><h2>${s.title}</h2><p>${s.body}</p><p>${s.body2}</p></div>${visual(s.visual)}</div><div class="takeaway"><strong>POINT</strong><span>${s.key}</span></div></article>${check?`<section class="choice-box" aria-labelledby="check-title"><h3 id="check-title">${check.prompt}</h3><div class="options">${check.options.map((o,i)=>`<button class="option ${slideChoice===i?'chosen':''}" data-choice="${i}" aria-pressed="${slideChoice===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div id="lesson-feedback" role="status">${slideFeedback?`<div class="feedback ${slideFeedback.good?'good':''}"><strong>${slideFeedback.good?'その考え方でOK！':'もう一度、考えてみよう。'}</strong><p>${slideFeedback.text}</p></div>`:''}</div></section>`:''}<div class="lesson-controls"><button class="btn secondary" data-action="prev-slide" ${state.slide===0?'disabled':''}>← 前へ</button><span class="subtle">${check?'答えを選ぶと進めるよ':''}</span><button class="btn" data-action="next-slide" ${check&&(!slideFeedback||!slideFeedback.good)?'disabled':''}>${state.slide===lessons.length-1?'学習を終えて、テストへ':'次へ →'}</button></div><div class="bottom-links"><a href="#/">ホームへ戻る</a><a href="#/about">参考資料を見る</a></div>`;}
function renderTest(){if(!state.learned){main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER 01 / CHECK</p><h1>まずは、お話を読んでみよう。</h1><div class="panel"><p>テストは、第1章の8つの画面と、途中の考える問題を終えると受けられるよ。</p><p class="subtle">急がなくてだいじょうぶ。前の画面にも戻れるよ。</p><a class="btn" href="#/learn">学習${state.slide?'のつづき':'をはじめる'} →</a></div></div>`;return;}if(result){renderResult();return;}if(exam){renderQuestion();return;}const last=state.attempts.at(-1);main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER 01 / CHECK</p><h1>「わかった」を、確かめよう。</h1><p class="subtle">第1章「スマホを持つ目的と責任」確認テスト</p><div class="panel"><span class="badge">✓ 学習完了</span><div class="exam-stats"><div class="stat"><strong>10問</strong>選択式の場面問題</div><div class="stat"><strong>90点以上</strong>合格の目安</div><div class="stat"><strong>何度でも</strong>時間制限なし</div></div><ul class="check-list"><li>合格には、10問中9問以上の正解が必要。</li><li>「助けを求める」重要問題は、必ず正解しよう。</li><li>答えを選んだあと、最後にまとめて採点するよ。</li><li>間違えた問題は、解説とお話を見て学び直せるよ。</li></ul><p class="subtle">問題と選択肢の順番は、受けるたびに変わります。途中の回答はページを再読み込みすると失われます。</p>${button('テストをはじめる →','start-exam')}<div class="bottom-links"><a href="#/learn">学習を読み返す</a></div></div>${last?`<p class="subtle">前回の結果：${last.correct*10}点 · ${last.passed?'第1章 合格':'学び直して、もう一度挑戦しよう'}</p>`:''}</div>`;}
function renderQuestion(){const q=exam.items[exam.index];main.innerHTML=`<div class="narrow"><div class="lesson-head"><div><p class="eyebrow">CHAPTER 01 / CHECK</p><h1>第1章 確認テスト</h1></div><span class="page-count">${exam.index+1} / 10 問</span></div><div class="track"><span style="width:${(exam.index+1)*10}%"></span></div><section class="panel" aria-labelledby="question-title"><p class="question-meta">Q${String(exam.index+1).padStart(2,'0')} / ${q.tag}</p><h2 class="question-title" id="question-title">${q.q}</h2><div class="options" role="group" aria-label="答えを1つ選んでください">${q.options.map((o,i)=>`<button class="option ${exam.answers[exam.index]===i?'chosen':''}" data-answer="${i}" aria-pressed="${exam.answers[exam.index]===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div class="exam-nav"><button class="btn secondary" data-action="prev-question" ${exam.index===0?'disabled':''}>← 前の問題</button><button class="btn" data-action="next-question" ${exam.answers[exam.index]===undefined?'disabled':''}>${exam.index===9?'採点する':'次の問題 →'}</button></div></section><p class="subtle">選んだ答えは、採点するまで変更できます。回答済み ${exam.answers.filter(x=>x!==undefined).length} / 10問</p><button class="btn quiet small" data-action="exit-exam">テストを中断する</button></div>`;}
function renderResult(){const r=result;main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER 01 / RESULT</p><section class="panel"><div class="results-score"><span class="result-icon" aria-hidden="true">${r.passed?'✦':'▤'}</span><h1>${r.passed?'第1章、合格！':'もう一度、確かめてみよう。'}</h1><div class="score">${r.correct*10}<small> / 100点</small></div><p class="subtle">${r.correct} / ${r.total}問正解 · 重要問題 ${r.criticalOK?'正解':'学び直そう'}</p></div><div class="callout">${r.passed?'安全に使うための、はじめの一歩ができたね。<br>次は家族と、わが家の約束を話し合おう。':'間違いは、気づくチャンス。下の解説を読んで、お話に戻ってみよう。<br>合格は90点以上、かつ重要問題の正解が条件だよ。'}</div><div class="actions">${r.passed?'<a class="btn" href="#/family">家族の約束を話し合う →</a>':''}${button('もう一度テストする','start-exam',r.passed?'secondary':'')}<a class="btn secondary" href="#/learn">学習に戻る</a></div><p class="footnote">第1章のみの合格です。全24章の修了証や、スマホを渡す許可ではありません。</p></section><h2>答えと解説</h2><div class="panel">${r.items.map((q,i)=>{const ok=r.answers[i]===q.answer;return `<article class="review-item"><p class="${ok?'status-good':'status-miss'}">${ok?'✓ 正解':'↻ 学び直し'} · Q${i+1}${q.critical?' · 重要問題':''}</p><h3>${q.q}</h3><p>あなたの答え：${esc(q.options[r.answers[i]])}</p>${!ok?`<p class="status-good">正解：${q.options[q.answer]}</p>`:''}<p>${q.why}</p><a class="subtle" href="#/learn/${q.slide}">学習画面 ${q.slide+1} に戻る →</a></article>`;}).join('')}</div><a href="#/" class="subtle">ホームへ戻る</a></div>`;}
function renderFamily(){const r=state.rules||{minutes:'60',end:'20:30',place:'living',help:'parent'};const places={living:'リビングで充電する',hall:'廊下など、寝室以外で充電する',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow">FAMILY TALK</p><h1>わが家の約束を、話そう。</h1><p>子どもだけでなく、大人にも守る約束がある。<br>理由を聞き合いながら、一緒に決めてみよう。</p><div class="callout">これは話し合うための下書きです。表示されている時間は例で、すべての家庭への推奨値ではありません。</div><form id="rules-form" class="panel"><h2>まずは、4つから。</h2><div class="form-grid"><label class="field">娯楽で使う1日の時間の目安<select name="minutes">${['30','60','90','120'].map(n=>`<option value="${n}" ${r.minutes===n?'selected':''}>${n}分</option>`).join('')}</select></label><label class="field">夜に利用を終える時刻<input type="time" name="end" value="${r.end}" required></label><label class="field">夜、スマホを置く場所<select name="place">${Object.entries(places).map(([v,t])=>`<option value="${v}" ${r.place===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">困ったときの相談先<select name="help"><option value="parent" ${r.help==='parent'?'selected':''}>保護者。話せないときは先生など</option><option value="adult" ${r.help==='adult'?'selected':''}>先生など、信頼できる大人</option></select></label></div><p class="subtle" style="margin-top:20px">緊急連絡や学校の連絡など、例外が必要な場合も話し合おう。課金・アプリ追加・外出時の約束は、次の章以降も学びながら決めていきます。</p><button class="btn" type="submit">この端末に下書きを保存</button><p id="rules-status" role="status" class="subtle" style="margin:12px 0 0">${state.rules?'下書きが保存されています。':''}</p></form><section class="panel"><h2>大人からの約束</h2><ul class="check-list"><li>困ったことを相談した、そのこと自体は罰しません。</li><li>まず安全を守り、ルールの振り返りは落ち着いてから。</li><li>子どもの写真を投稿するときも、本人に確認します。</li><li>使い方を確認する範囲は、先に説明します。</li><li>家族の生活や成長に合わせて、一緒に見直します。</li></ul><p class="subtle">この画面の保存だけで、保護者の承認やスマホの設定が完了するわけではありません。実際に親子で話し合って確認してください。</p></section><p class="footnote">保存先は、このブラウザの中だけです。保護者への自動送信・端末間同期はありません。</p></div>`;document.getElementById('rules-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.rules={minutes:f.get('minutes'),end:f.get('end'),place:f.get('place'),help:f.get('help')};save();document.getElementById('rules-status').textContent=storageOK?'下書きを保存しました。家族と話し合って、必要なら変更しよう。':'保存できませんでした。このブラウザの保存設定を確認してください。';});}
function renderAbout(){main.innerHTML=`<div class="narrow"><p class="eyebrow">FOR PARENTS</p><h1>「使わない」より、<br>安全に使う力を。</h1><p>スマホを受け取る前に、親子で学ぶための教材です。現在は、方向性を確認するための第1章のみを実装しています。</p><section class="panel"><h2>今回、確認できること</h2><ul class="check-list"><li>全8画面の紙芝居と、途中の3つの判断練習。</li><li>16問の問題バンクから、重要問題を含む10問を出題。</li><li>問題・選択肢の並べ替え、採点、全問の解説、再受験。</li><li>家族の約束の下書きと、学習進度のブラウザ内保存。</li></ul><p class="subtle">合格条件は90点以上、かつ「助けを求める」重要問題への正答です。今後の全課程の合格条件は、教材を拡張する際に調整します。</p></section><section class="panel"><h2>親子で使うときに</h2><p>点数だけで判断せず、「なぜその答えを選んだか」「実際に困ったとき、誰にどう話すか」も確かめてください。学習と家庭内ルールに加え、端末の安全設定も必要です。</p><p>ルール違反の振り返りと、被害相談への対応は分けます。まずは安全の確保を優先し、相談したこと自体を罰しない関係をつくることを、この教材では大切にしています。</p><p class="subtle">保護者向けの画面に認証はありません。子どもも閲覧できます。これは監視アプリや利用制限アプリではなく、学習用のサイトです。</p></section><section class="panel"><h2>参考にした一次情報</h2><p class="subtle">第1章の教材設計で参照。家庭での約束例や合格基準は、本サイト独自の提案です。確認日：2026年11月16日。</p><ul class="source-list"><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/leaflet/" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発リーフレット集 ↗</a><br>家庭のルール、安全設定、ネットでのトラブルについて。</li><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/internet_use_keihatu" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発コンテンツ ↗</a><br>親子のルールづくりと、安全に利用するための教材。</li><li><a href="https://www.npa.go.jp/bureau/cyber/countermeasures/defamation.html" target="_blank" rel="noopener noreferrer">警察庁：インターネット上の誹謗中傷等への対応 ↗</a><br>写真や個人情報を安易に掲載しないなどの被害防止策。</li></ul></section><section class="panel"><h2>記録とプライバシー</h2><p>本サイトには、名前・メールアドレス・本物のパスワードを入力する欄はありません。学習進度、直近20回の点数、家族ルールの下書きは、このブラウザのlocalStorageに保存します。</p><p>本サイトのコードから学習記録を外部へ送信する機能や、アクセス解析、広告は入れていません。配信基盤のGitHub Pagesでは、通信に伴う情報が処理されます。別の端末との同期はなく、ブラウザのデータを消すと記録も消えます。</p><p class="subtle">イラストは生成AIで制作した教材用の画像です。実在する親子の写真ではありません。</p><button class="btn secondary small" data-action="reset">このブラウザの学習記録をリセット</button><p id="reset-status" role="status" class="subtle"></p></section><div class="bottom-links"><a href="https://github.com/inamuu/smartphone-safe-use-cert" target="_blank" rel="noopener noreferrer">ソースコード ↗</a><a href="https://inamuu.github.io/links/">inamuu links ↗</a><a href="#/">ホームへ</a></div></div>`;}
main.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const check=lessons[state.slide].check;slideChoice=Number(choice.dataset.choice);const good=slideChoice===check.answer;slideFeedback={good,text:good?check.explain:'相手の権利、自分の生活、安全に相談することを手がかりに、もう一度選んでみよう。'};renderLearn();main.querySelector(`[data-choice="${slideChoice}"]`).focus({preventScroll:true});return;}const answer=e.target.closest('[data-answer]');if(answer&&exam){exam.answers[exam.index]=Number(answer.dataset.answer);renderQuestion();main.querySelector(`[data-answer="${answer.dataset.answer}"]`).focus({preventScroll:true});return;}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'prev-slide':if(state.slide>0){state.slide--;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'next-slide':if(lessons[state.slide].check&&!slideFeedback?.good)return;if(state.slide===lessons.length-1){state.learned=true;save();exam=null;result=null;location.hash='/test';}else{state.slide++;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'start-exam':if(!state.learned)return;exam={items:createExam(),answers:[],index:0};result=null;renderQuestion();main.focus();window.scrollTo(0,0);break;case'prev-question':if(exam&&exam.index>0){exam.index--;renderQuestion();main.focus();window.scrollTo(0,0);}break;case'next-question':if(!exam||exam.answers[exam.index]===undefined)return;if(exam.index<9){exam.index++;renderQuestion();}else{result={...grade(exam.items,exam.answers),items:exam.items,answers:[...exam.answers]};state.attempts.push({correct:result.correct,passed:result.passed,at:new Date().toISOString()});state.attempts=state.attempts.slice(-20);save();exam=null;renderResult();}main.focus();window.scrollTo(0,0);break;case'exit-exam':if(confirm('テストを中断しますか？ 途中の回答は消えます。学習の進み具合は残ります。')){exam=null;renderTest();main.focus();}break;case'reset':if(confirm('このブラウザに保存した学習の進み具合・テスト結果・家族の約束の下書きをリセットしますか？')){state=freshState();exam=null;result=null;slideChoice=null;slideFeedback=null;save();progress();document.getElementById('reset-status').textContent=storageOK?'学習記録をリセットしました。':'保存領域を更新できませんでした。ブラウザのサイトデータ設定から削除してください。';}break;}});
window.addEventListener('hashchange',route);
route();
</script>
