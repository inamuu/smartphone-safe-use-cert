/* Expanded lessons: illustration, reasons, examples, and actionable reading sections. */
.slide-content{align-items:start;min-height:0;grid-template-columns:1.05fr 1fr}
.slide-text{padding:30px 26px 24px 30px}
.slide-text p{line-height:2.05;margin-bottom:18px;overflow-wrap:anywhere}
.slide-text p:last-child{margin-bottom:0}
.slide-text .why-title{font-size:16px;margin:24px 0 10px;padding-top:18px;border-top:1px solid var(--line);color:var(--teal-dark)}
.lesson-figure{margin:0;padding:30px 26px 20px 0;align-self:center;min-width:0}
.illustration-frame{border-radius:14px;overflow:hidden;background:#f3eee3;border:1px solid #e9e6d9}
.lesson-figure img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}
.lesson-figure figcaption{font-size:12px;line-height:1.9;margin-top:12px;color:var(--muted);padding:0 3px;overflow-wrap:anywhere}
.lesson-details{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;padding:0 26px 26px 30px;align-items:start}
.lesson-example,.lesson-actions{border-radius:12px;padding:23px;min-width:0}
.lesson-example{background:#fcf4e9;border:1px solid #eee0cc}
.lesson-actions{background:#f0f6f0;border:1px solid #dbe8dd}
.section-kicker{font-size:11px!important;font-weight:750;letter-spacing:.05em;margin:0 0 8px!important;color:#94603d}
.lesson-actions .section-kicker{color:var(--teal)}
.lesson-details h3{font-size:17px;margin:0 0 14px}
.lesson-details p{font-size:14px;line-height:2;margin:0 0 14px;overflow-wrap:anywhere}
.lesson-details p:last-child{margin-bottom:0}
.example-note{font-size:11px!important;color:#7a6d58;border-top:1px solid #e7d9c3;padding-top:12px}
.dialogue{margin:18px 0 0;display:grid;gap:10px}
.lesson-details .dialogue-line{display:flex;gap:10px;margin:0;align-items:flex-start;font-size:13px;background:#fff9;padding:11px 12px;border-radius:9px}
.dialogue-line strong{font-size:10px;color:#916044;white-space:nowrap;padding-top:3px;min-width:25px}
.action-list{padding:0;list-style:none;counter-reset:actions;margin:0}
.action-list li{counter-increment:actions;position:relative;padding-left:31px;margin:0 0 16px;font-size:14px;line-height:1.95;overflow-wrap:anywhere}
.action-list li:before{content:counter(actions);position:absolute;left:0;top:3px;width:22px;height:22px;background:#d8e9dc;color:var(--teal-dark);font-size:11px;font-weight:700;line-height:22px;text-align:center;border-radius:50%}
.reflection{border-top:1px solid #d3e2d6;padding-top:16px;margin-top:19px}
.reflection-label{display:block;font-size:11px;color:var(--teal-dark);font-weight:750;margin-bottom:5px}
.reflection p{font-size:13px;margin:0 0 8px}
.reflection-hint{font-size:11px;color:var(--muted);line-height:1.8;display:block}

const chapters=[{"number":1,"title":"スマホを持つ目的と責任","description":"便利さを楽しむための、はじめの約束。"},{"lessons":[{"label":"つながりの全体像","title":"インターネットは、ネットワーク同士のつながり","body":"家のスマホや学校のパソコンは、近くの機器とつながるだけでなく、通信会社などのネットワークを通して遠くのコンピュータとも情報をやり取りできる。このように、たくさんのネットワークがつながった全体をインターネットというよ。どこか一つの会社が持つ巨大な箱、というわけではないんだ。","explanationTitle":"画面の向こうにも、機器と人がいる","body2":"検索した結果も動画も、スマホの中から何でも生まれてくるわけではない。遠くのコンピュータから届く情報も多いんだ。便利さの裏側では、通信する道や、情報を届ける機器を動かす人が支えている。だから、相手側の故障で使えなくなることもあるよ。","example":{"title":"離れた場所の情報に会いに行く","paragraphs":["家で図書館の開館時間を調べるとき、スマホは図書館の情報を届けるコンピュータなどと通信する。図書館まで歩かなくても情報を受け取れるのは、ネットワークがつながっているからだよ。","画面に表示された情報にも、作った人や届ける仕組みがある。「インターネットにあるから正しい」とは限らないことも、これから学んでいこう。"]},"actionTitle":"つながりを身近な例で考えよう","actions":["家でネットを使う機器を二つ思い浮かべる。","その機器で、遠くから受け取っている情報を一つ考える。","情報を届ける側にも機器や人がいると覚えておく。"],"reflect":"今日見た天気予報は、スマホの中だけで作られた情報かな？","key":"ネットの向こうには、情報を届ける機器と人がいる。","image":"assets/lessons/201-network.jpg","imageAlt":"家・学校・図書館の模型がつながった世界を、子どもとロボットが眺めている。","caption":"ネットの向こうには、情報を届ける機器と人がいる。"},{"label":"接続の入口","title":"Wi-Fiとインターネットは、同じもの？","body":"Wi-Fi（ワイファイ）は、近くの機器を無線でつなぐための仕組み。家ではスマホがWi-Fiルーターにつながり、その先の回線を通してインターネットを使うことが多いよ。一方、モバイル通信では携帯電話会社の基地局などを通してつながる。入口が違っても、同じWebサイトを開けるんだ。","explanationTitle":"Wi-Fiのマークだけでは判断できない","body2":"スマホとルーターがつながっていても、家の回線に問題があれば外のサイトを見られないことがある。Wi-Fiのマークは「インターネットが必ず使える」という保証ではないよ。また、知らないWi-Fiに勝手につながず、利用する接続先は家族と確認しよう。","example":{"title":"家のWi-Fiにはつながるのに、動画が止まる","paragraphs":["スマホにはWi-Fiのマークが出ている。でも家の回線が止まっていたら、ルーターまではつながっていても、その先へ情報を届けられないことがある。","Wi-Fiを切るとモバイル通信へ切り替わる設定の場合は、データ使用量が増えることもある。「見られたから直った」と決めず、どちらで通信しているか大人と確かめよう。"]},"actionTitle":"入口を確かめる練習","actions":["家族と一緒に、今の接続がWi-Fiかモバイル通信かを見る。","自宅で使ってよいWi-Fiの名前を確認する。","つながらないときは、知らない接続先を試す前に相談する。"],"reflect":"Wi-Fiのマークが出ているのに、Webサイトが開かないことはあるかな？","key":"Wi-Fiは接続の入口。インターネット全体とは別のもの。","image":"assets/lessons/202-network.jpg","imageAlt":"家のルーターと外の携帯電話の基地局を、親子が見比べている。","caption":"Wi-Fiは接続の入口。インターネット全体とは別のもの。","check":{"prompt":"Wi-Fiのマークが出ているのに、サイトが開かない。どう考える？","options":["マークがあるので、絶対にネットは使える","Wi-Fiの先の回線などに問題がある可能性もある","知らないWi-Fiへ片っ端からつなぐ"],"answer":1,"explain":"Wi-Fiとスマホがつながっていても、その先の回線などに問題があることがあるよ。家族と確認しよう。"}},{"label":"お願いと返事","title":"サイトを見るときも、情報を送っている","body":"天気のページを開くと、スマホは相手のコンピュータに「この情報を見せて」とお願いし、相手は表示に必要なデータを返す。お願いする側をクライアント、情報や機能を提供する側をサーバーというよ。難しい名前より、お願いと返事のやり取りを想像できれば大丈夫。","explanationTitle":"見るだけでも、通信は起きる","body2":"何も投稿しなくても、ページを開くためのお願いは送られる。通信相手には、接続元のIPアドレスなど、通信に必要な情報が伝わる。サイトによっては利用状況を記録することもあるよ。「見るだけなら、自分に関する情報は一切伝わらない」とは考えないでね。","example":{"title":"動画の再生ボタンを押したら","paragraphs":["再生を押すと、動画を届けるサーバーに必要なデータをお願いし、受け取ったデータをスマホが映像や音にする。再生中も少しずつデータを受け取ることがあるよ。","サーバーが混雑したり、通信が遅かったりすると、待ち時間が長くなる。ボタンを何十回も押す前に、一度待って様子を見よう。"]},"actionTitle":"お願いと返事を説明してみよう","actions":["ページを開く操作を「お願いを送る」と言い換えてみる。","画面に届く情報を「相手からの返事」と考える。","見るだけでも通信相手に伝わる情報があると覚える。"],"reflect":"動画が届く前に、スマホから何かお願いを送っているかな？","key":"「見る」操作にも、送る情報と受け取る情報がある。","image":"assets/lessons/203-network.jpg","imageAlt":"サーバーを守る図書館員のようなロボットに、子どもが本をお願いして受け取っている。","caption":"「見る」操作にも、送る情報と受け取る情報がある。"},{"label":"宛先を見つける","title":"名前から、通信する宛先を調べる","body":"人は「example.com」のようなドメイン名を使うけれど、通信ではIPアドレスという宛先の番号を使う。ドメイン名に対応するIPアドレスを調べる仕組みがDNS（ディーエヌエス）。人が使いやすい名前と、通信に使う宛先を結びつける住所録のような役割だよ。","explanationTitle":"住所録のたとえにも、限りがある","body2":"IPアドレスは人の名前や自宅の住所そのものではない。変わる場合も、複数の人が外向きの同じIPアドレスを使う場合もある。「IPアドレスだけで、必ずその人の名前や部屋まで分かる」というものではないよ。今は、通信の宛先に使う情報だと覚えよう。","example":{"title":"お店の名前から、行き先を探す","paragraphs":["初めて行くお店なら、名前を手がかりに住所を調べるね。DNSもそれに少し似ていて、ドメイン名を手がかりに通信先を調べる。実際の仕組みでは、いくつものサーバーが協力しているよ。","ただし、宛先が見つかったことは「そのサイトの内容が正しい」「安心して買い物できる」という証明ではない。行き先が分かることと、安全を確かめることは別なんだ。"]},"actionTitle":"用語は役割で覚えよう","actions":["ドメイン名は、人が使いやすい名前だと覚える。","IPアドレスは、通信の宛先に使う情報だと覚える。","DNSは、その対応を調べる仕組みだと説明してみる。"],"reflect":"住所が調べられたお店は、それだけで必ず信用できるかな？","key":"DNSは名前とIPアドレスの対応を調べる仕組み。安全の保証ではない。","image":"assets/lessons/204-network.jpg","imageAlt":"子どもとロボットが住所録を開き、家の絵と宛先のカードを見比べている。","caption":"DNSは名前とIPアドレスの対応を調べる仕組み。安全の保証ではない。","check":{"prompt":"DNSで宛先が分かったサイトなら、必ず信用できる？","options":["宛先が分かることと、信用できることは別","DNSが内容の正しさを審査しているので安心","IPアドレスがあるサイトに危険はない"],"answer":0,"explain":"DNSは名前とIPアドレスの対応を調べる仕組み。内容や運営者の信用まで保証するものではないよ。"}},{"label":"データの運び方","title":"写真や動画は、小さな単位で運ばれる","body":"大きな写真や動画のデータも、通信では小さな単位に分けて運ばれる。この単位をパケットというよ。途中のルーターなどの機器が宛先を手がかりに次の行き先へ送り、受け取る側では、必要な仕組みによってデータを元の形に組み立てる。","explanationTitle":"一枚の写真が、一つの箱で届くとは限らない","body2":"小分けの荷物を届けるように考えると分かりやすい。ただし、本物の通信は荷物とまったく同じではないよ。途中でデータが届かないこともあり、通信の方式によっては送り直しなどで補う。ここでは「機器を経由して小分けに運ぶ」とつかめれば十分だよ。","example":{"title":"動画が途中で止まったとき","paragraphs":["次に再生するためのデータが間に合わないと、動画が待ち状態になることがある。いつもスマホの性能だけが原因とは限らず、途中の通信や相手側の混雑が関係することもあるんだ。","焦ってアプリを入れ直したり、よく分からない「高速化アプリ」を入れたりしない。まず少し待つ、再生画質を家族と見直すなど、簡単な確認から始めよう。"]},"actionTitle":"運び方をたとえてみよう","actions":["写真のデータが、小分けに運ばれる様子を想像する。","途中に情報を送り渡す機器があると覚える。","遅いときに、知らないアプリで解決しようとしない。"],"reflect":"動画が止まったら、スマホ本体以外にも原因がありそうかな？","key":"情報は、小さな単位に分かれて機器を経由して届く。","image":"assets/lessons/205-network.jpg","imageAlt":"写真の絵を小さな封筒に分けて、子どもとロボットが運ぶ準備をしている。","caption":"情報は、小さな単位に分かれて機器を経由して届く。"},{"label":"通信量とお金","title":"動画を見ると、どれくらい運ぶ？","body":"文字だけの連絡より、写真や動画では多くのデータをやり取りすることが多い。通信したデータの量を通信量といい、MB（メガバイト）やGB（ギガバイト）などで表すよ。動画の画質や長さによっても量は変わる。何分なら必ず何GB、と一つの数字では決められないんだ。","explanationTitle":"Wi-Fiでも、データは流れている","body2":"Wi-Fiにするとデータが消えるわけではない。携帯電話の契約とは別の回線を使うことが多い、ということ。契約によって料金や容量の条件が違うので「Wi-Fiならどんな使い方でも無料」とは限らないよ。モバイル通信で容量を使い切ると、契約によって速度制限や追加料金などにつながる。","example":{"title":"外で動画を長く見たい日","paragraphs":["家では気にならなくても、外で高画質の動画を続けて見るとモバイル通信の使用量が増えやすい。家族と契約を確かめ、使える範囲や、動画を見てよい場面を決めよう。","事前に保存して見る機能があるサービスでも、保存するときには通信が必要。サービスの利用条件やスマホの空き容量もあるので、勝手に大量保存せず相談してね。"]},"actionTitle":"使う前に確かめること","actions":["家族と契約のデータ容量や追加料金の条件を確認する。","端末のデータ使用量の画面を、一緒に見てみる。","自動再生や画質の設定を、家族と確認する。"],"reflect":"Wi-Fiを使うと、動画のデータ量そのものがゼロになるかな？","key":"通信量と料金の条件を知って、使い方を家族と決めよう。","image":"assets/lessons/206-network.jpg","imageAlt":"親子がスマホの抽象的な使用量メーターと、写真の封筒の山を見ている。","caption":"通信量と料金の条件を知って、使い方を家族と決めよう。"},{"label":"つながらないとき","title":"使えない原因を、落ち着いて分ける","body":"ページが開かないとき、スマホ、Wi-Fi、家の回線、通信会社、相手のサービスなど、いろいろな場所で問題が起きている可能性がある。全部を自分で直す必要はないよ。エラーの内容と、何が使えて何が使えないかを大人に伝えるだけでも、確認の手がかりになる。","explanationTitle":"ネットがなくても、できることはある","body2":"端末に保存済みの写真を見るなど、通信なしでできる操作もある。ただし、アプリによっては本人確認やデータの読み込みに通信が必要。「アプリが起動する」と「すべての機能が使える」も別なんだ。何度も同じ操作を繰り返す前に、一呼吸おこう。","example":{"title":"一つのサイトだけ開かない","paragraphs":["ほかのサイトは見られるのに、一つだけ開かないなら、相手側の不調の可能性もある。でも、それだけで原因が確定するわけではない。困った画面を大人に見せて、一緒に確認しよう。","見知らぬ人が「直してあげるからパスワードや認証コードを送って」と言っても渡さない。困っているときほど、いつもの相談先を頼ろう。"]},"actionTitle":"困ったときの伝え方","actions":["「いつから」「何をしたら」「どんな表示か」を伝える。","設定の大幅な変更や、アプリの追加は大人と行う。","パスワードや認証コードを、修理を名乗る相手にも送らない。"],"reflect":"動画だけ動かないとき、どんなことを大人に伝えると分かりやすいかな？","key":"原因を決めつけず、いつもの大人に相談する。","image":"assets/lessons/207-network.jpg","imageAlt":"止まった動画を子どもが見せ、保護者がルーターを確認している。そばに本と音楽プレーヤーがある。","caption":"原因を決めつけず、いつもの大人に相談する。"},{"label":"仕組みを安全につなげる","title":"送った情報は、自分のスマホの外へ出る","body":"メッセージや写真を送ると、サービスのサーバーや相手の端末など、自分のスマホ以外の場所にもデータが届く。自分の画面から削除しても、相手が保存したものやサービス側の記録まで、必ず全部消せるわけではないよ。サービスによって保存の方法や削除の仕組みは違うんだ。","explanationTitle":"「送信」を押す前が、考える時間","body2":"限られたグループに送っても、受け取った人がコピーしたり、別の人に見せたりする可能性がある。ネットの仕組みを知ることは、怖がるためではなく、自分で止まって確かめるため。写真・名前・学校名などを送る前に、相手、内容、目的を見直そう。","example":{"title":"間違えて写真を送ってしまったら","paragraphs":["まず送信先を確認し、取り消し機能があれば使い、必要なら相手に削除をお願いする。ただし「取り消したから絶対に誰も見ていない」とは言い切れないよ。","個人情報や、見られて困る内容なら、すぐ信頼できる大人へ。消そうと焦って、お金を払ったり、追加の写真を送ったりしない。失敗したあとでも相談していいんだ。"]},"actionTitle":"送る前の三つの確認","actions":["誰に届くのか、送信先を確かめる。","自分や友達の情報が含まれていないか確認する。","送ってよいか迷ったら、そのまま送らず大人に相談する。"],"reflect":"自分のスマホから写真を消すと、相手が保存した写真も必ず消えるかな？","key":"送ったデータは、自分だけでは管理しきれなくなることがある。","image":"assets/lessons/208-network.jpg","imageAlt":"送信前に親子が立ち止まり、遠くの相手とロボットが写真の封筒を受け取る様子を想像している。","caption":"送ったデータは、自分だけでは管理しきれなくなることがある。","check":{"prompt":"写真を間違えて送った。自分のスマホから消せば十分？","options":["相手の保存分も必ず消えるので十分","何もしなくても時間がたてば必ず消える","全部消えるとは限らない。必要な対処をし、大人に相談する"],"answer":2,"explain":"相手の保存分などが残ることもある。取り消しだけで安心せず、困る内容なら大人と一緒に対処しよう。"}}],"questions":[{"id":"network-1","tag":"つながりの全体像","q":"インターネットとは？","options":["多くのネットワークがつながった全体","一つの動画アプリの別名","自分のスマホの保存場所だけ"],"answer":0,"why":"ネットワーク同士がつながり、離れた機器とも通信できる仕組みだよ。","slide":0},{"id":"network-2","tag":"つながりの全体像","q":"家で図書館のWebサイトを見るとき、情報はどこから来る？","options":["すべてスマホが想像して作る","情報を届けるコンピュータなどから通信で届く","家の充電器から届く"],"answer":1,"why":"画面の向こうには、情報を届ける機器や人がいるよ。","slide":0},{"id":"network-3","tag":"接続の入口","q":"Wi-Fiについて正しい説明は？","options":["インターネット全体の名前","どんな場所でも必ず無料の回線","近くの機器を無線でつなぐ仕組み"],"answer":2,"why":"Wi-Fiは接続の入口になる仕組み。インターネット全体とは別だよ。","slide":1},{"id":"network-4","tag":"接続の入口","q":"Wi-Fiのマークは出るが、Webサイトが開かない。どうする？","options":["家族と、回線や接続先を確認する","必ずスマホが壊れたので捨てる","知らないWi-Fiにつながるまで試す"],"answer":0,"why":"Wi-Fiの先の回線や相手側などにも原因があるかもしれないね。","slide":1},{"id":"network-5","tag":"お願いと返事","q":"動画を見るとき、スマホからも情報は送られる？","options":["見るだけなら何も送らない","必要なデータをお願いする通信などを送る","文字を入力したときだけ通信する"],"answer":1,"why":"見る操作にもお願いと返事の通信があるよ。","slide":2},{"id":"network-6","tag":"お願いと返事","q":"サーバーの役割として近いものは？","options":["スマホの画面を拭く道具","スマホを充電する電池","情報や機能を提供するコンピュータなど"],"answer":2,"why":"お願いに応じて情報や機能を提供する側をサーバーというよ。","slide":2},{"id":"network-7","tag":"宛先を見つける","q":"DNSの役割は？","options":["ドメイン名に対応するIPアドレスを調べる","サイトの情報が正しいか採点する","使いすぎを自動で防ぐ"],"answer":0,"why":"DNSは、名前と通信の宛先を結びつける役割を持つよ。","slide":3},{"id":"network-8","tag":"宛先を見つける","q":"IPアドレスについて、正しい考え方は？","options":["必ず一人だけが一生使う番号","通信の宛先に使われ、変わったり共有されたりすることもある","それだけで必ず部屋番号まで分かる"],"answer":1,"why":"IPアドレスは人の名前や自宅の住所そのものではないよ。","slide":3},{"id":"network-9","tag":"データの運び方","q":"パケットとは？","options":["動画を見るための有料チケット","スマホのケース","通信で運ばれるデータの小さな単位"],"answer":2,"why":"大きなデータも、小さな単位で機器を経由して運ばれるよ。","slide":4},{"id":"network-10","tag":"データの運び方","q":"動画が止まった。どう考えるとよい？","options":["通信や相手側の混雑も考え、落ち着いて確認する","必ずスマホだけが原因だと決める","広告の高速化アプリをすぐ入れる"],"answer":0,"why":"通信経路や相手側の状態も影響することがあるよ。","slide":4},{"id":"network-11","tag":"通信量とお金","q":"Wi-Fiで動画を見ると、データ量はどうなる？","options":["データ量は必ずゼロになる","Wi-Fiでもデータは流れる。料金などは契約による","どんな契約でも完全に無料になる"],"answer":1,"why":"使う回線が変わっても、動画のデータ自体は運ばれるよ。","slide":5},{"id":"network-12","tag":"通信量とお金","q":"外で動画を見る前に確認したいことは？","options":["スマホのケースの色だけ","何も確認しなくてよい","データ容量や追加料金の条件、家族の約束"],"answer":2,"why":"通信量と契約条件を知って使おう。","slide":5},{"id":"network-13","tag":"つながらないとき","q":"一つのサイトだけ見られない。まずどうする？","options":["何が使えないかを大人に伝え、一緒に確認する","すべての設定を勝手に変える","スマホ内の写真を全部消す"],"answer":0,"why":"原因を決めつけず、状況を伝えることが確認の手がかりになるよ。","slide":6},{"id":"network-14","tag":"つながらないとき","q":"知らない相手が「接続を直すから認証コードを送って」と言う。どうする？","options":["困っているので送る","送らず、いつもの信頼できる大人に相談する","一度だけなら送る"],"answer":1,"why":"認証コードやパスワードを渡さず、普段の相談先を頼ろう。","slide":6},{"id":"network-15","tag":"仕組みを安全につなげる","q":"自分のスマホから写真を削除したら？","options":["相手のコピーも必ず消える","サービス側の記録も必ず全部消える","相手の保存分などが残ることがある"],"answer":2,"why":"自分の端末で消すことと、すべての場所から消すことは別だよ。","slide":7},{"id":"network-16","tag":"仕組みを安全につなげる","q":"個人情報を間違えて送り、相手からお金を要求された。どうする？","options":["追加の情報やお金を送らず、すぐ信頼できる大人に相談する","払えば必ず全部消せると信じる","怒られるかもしれないので隠す"],"answer":0,"why":"送ってしまったあとでも相談していい。ひとりで要求に応じず、安全を優先しよう。","slide":7,"critical":true}],"number":2,"title":"インターネットの仕組み","description":"情報が届く仕組みを知って、安全な行動につなげよう。"},{"title":"Web・アプリ・クラウド","description":"道具と保存先の違いを知り、追加・削除・共有を落ち着いて判断しよう。","lessons":[{"label":"Webとブラウザ","title":"ブラウザは、Webを見るための道具","body":"Web（ウェブ）は、ページ同士がリンクで結びついた情報の仕組み。ブラウザは、そのページを開いて表示するためのアプリだよ。スマホのChromeやSafariなどがその例で、検索欄に言葉を入れることも、Webサイトの住所であるURLを指定して開くこともできる。インターネット全体と、Webと、ブラウザは同じ意味ではないんだ。","explanationTitle":"道具と、届けられる中身を分けよう","body2":"本屋で本を選ぶように、同じブラウザから、いろいろな運営者のページに移動できる。ブラウザの名前を知っているからといって、その中に表示された広告や記事まで全部信頼できるわけではないよ。今、どのサイトの、誰が出した情報を見ているかも意識しよう。","example":{"title":"図書館の開館時間を調べたい","paragraphs":["家族と図書館へ行く前に、ブラウザで図書館の公式サイトを開く。検索結果の一覧は入口で、開館時間を案内するページとは別だね。休館日や更新日も見て、必要な情報を確かめよう。","同じブラウザの次の画面に、関係のない広告が出ることもある。それは図書館からのお知らせとは限らないよ。「ブラウザに表示されたから公式」と決めず、情報を出した相手を見よう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["使っているブラウザの名前を、家族と確認する。","検索結果と、開いたサイトのページを区別する。","見ているサイトの運営者や更新日を探してみる。"],"reflect":"ブラウザが有名なら、その中のすべての広告も信用できるかな？","key":"ブラウザは見るための道具。情報の信用は、出した相手も確かめる。","imageAlt":"子どもがスマホのブラウザで図書館の案内を読み、隣で保護者が見守っている。","caption":"ブラウザは見るための道具。情報の信用は、出した相手も確かめる。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":0},{"label":"Web版とアプリ版","title":"入口が違っても、同じサービスのことがある","body":"動画や音楽などのサービスには、ブラウザで使うWeb版と、端末に追加する専用アプリ版がある場合がある。同じアカウントで使えることもあるけれど、機能や料金、使える端末などの条件が同じとは限らない。見た目が似ていても、別の運営者のアプリがまねをしている可能性もあるよ。","explanationTitle":"入れればよい、と急いで決めない","body2":"アプリが必要なのか、Webだけで用事が済むのかを考えよう。追加するなら、家族と公式の案内から配布元や開発者を確かめ、必要な権限や料金を確認する。検索で一番上に出たものや、友達が送ったファイルを、そのまま本物だと信じないでね。安全な追加方法は第7章でも学ぶよ。","example":{"title":"音楽を聴くために、知らないアプリをすすめられた","paragraphs":["いつもの音楽サービスを開こうとしたら、広告に「特別版を入れよう」と表示された。サービスの名前や色が同じでも、運営元が同じとは限らない。いったん止めて、保護者と公式の案内を確かめよう。","公式のWeb版だけで目的が済むこともあるし、正規のアプリが便利なこともある。無料という言葉だけで選ばず、何に使い、どこから入れ、何を許可するかを一緒に決めるといいね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["Webで使うのか、専用アプリで使うのかを確認する。","追加する前に、配布元・開発者・料金を家族と見る。","広告から届いたファイルを、そのまま入れない。"],"reflect":"同じサービス名が付いたアプリなら、全部が公式なのかな？","key":"Web版とアプリ版の違いを知り、追加する前に公式の案内を確認しよう。","imageAlt":"親子が、同じ音楽サービスを表すブラウザ画面と専用アプリの画面を見比べている。","caption":"Web版とアプリ版の違いを知り、追加する前に公式の案内を確認しよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":1,"check":{"prompt":"サービス名が同じアプリを見つけた。追加する前にすることは？","options":["名前が同じなら、すぐ入れる","無料なら、どこからでも入れる","家族と公式の案内や開発者、料金を確認する"],"answer":2,"explain":"名前や色だけでは公式とは分からない。追加する前に確認しよう。"}},{"label":"クラウドの正体","title":"クラウドは、空の上の箱ではない","body":"クラウドは、ネットワークを通して、サービス側のコンピュータの保存場所や働きを利用する仕組みだよ。写真を預ける、文書を共同で編集する、といった使い方がある。雲の絵で表されても、実際には建物の中などにあるコンピュータが情報を保存したり処理したりしているんだ。","explanationTitle":"便利さと、管理する相手を知ろう","body2":"スマホが壊れても、クラウド側に残るデータを使えることがある。一方、利用には通信やログインが必要な場合があり、サービスの不調やアカウントの問題で使えないこともあるよ。大切な情報を預けるときは、保存の条件や運営者、家族の約束を確認しよう。","example":{"title":"宿題の文書を、別の場所から開く","paragraphs":["家のパソコンでクラウドに保存した宿題を、許可された別の端末で開けることがある。データが空から降ってきたのではなく、サービス側の保存場所にアクセスして受け取っているんだ。","ただし「クラウドだから、何があっても永久に残る」わけではない。削除や契約終了、保存容量の上限などの条件もある。大切なデータをどう残すかは、一つの場所だけに任せず家族と考えよう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["サービス側にも情報の保存場所があると覚える。","自分が使うクラウドのサービス名を確認する。","大切なデータを残す方法を、家族と相談する。"],"reflect":"スマホをなくしても、クラウドのデータを必ず誰でも取り出せるのかな？","key":"クラウドは、ネット越しにサービス側の機器を利用する仕組み。","imageAlt":"保護者が、雲の模型ではなく地上にあるサーバーの模型を指して説明している。","caption":"クラウドは、ネット越しにサービス側の機器を利用する仕組み。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":2},{"label":"同期の働き","title":"同じアカウントで、情報がそろうことがある","body":"同期（どうき）は、複数の場所にある情報を、同じ状態にそろえるための働きだよ。設定によっては、スマホで撮った写真や編集した文書が、同じアカウントの別の端末にも現れる。何が同期されるか、いつ反映されるかは、サービスや設定、通信の状態によって違うんだ。","explanationTitle":"家族の端末へ、意図せず届かないように","body2":"便利だからこそ、誰のアカウントで使っているかが大切になる。家族共用のアカウントや端末では、見られると思っていなかった写真などが表示されることもあるよ。友達の端末に自分のアカウントで入ったままにせず、利用が必要なときも先に大人と確認しよう。","example":{"title":"スマホの写真が、家のタブレットにも出てきた","paragraphs":["自分だけが持っているつもりの写真が、家のタブレットにも表示された。同じアカウントで写真の同期が有効になっていたのかもしれない。誰かが勝手に盗んだと決めつける前に、家族と設定を確認しよう。","学校用と家庭用のアカウントがある場合も、今どちらを使っているかで保存先が変わることがある。送信や保存をする前に、画面のアカウント表示を確かめる習慣をつけるといいね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["今使っているアカウントの表示を家族と確認する。","どの端末に何が同期されるか、設定を一緒に見る。","友達の端末に、自分のログイン状態を残さない。"],"reflect":"自分の写真が別の端末に出たら、どんな設定を確かめるとよいかな？","key":"同期は情報をそろえる働き。アカウントと共有端末を確認しよう。","imageAlt":"スマホとタブレットに同じ写真が表示され、親子がアカウントのつながりを確かめている。","caption":"同期は情報をそろえる働き。アカウントと共有端末を確認しよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":3,"check":{"prompt":"同期について、正しい説明は？","options":["複数の場所の情報を、同じ状態にそろえる働き","どんなデータも絶対に消えない保証","すべての端末を無料で交換する機能"],"answer":0,"explain":"写真や編集内容などが別の端末にも反映されることがあるよ。"}},{"label":"保存先とバックアップ","title":"「見えている」と「ここに保存」は別","body":"写真が画面に見えていても、端末に元のデータがある場合と、クラウドから表示している場合がある。小さな見本だけが端末に残っていることもあるよ。端末だけに保存している情報は、その端末の故障や紛失で失うかもしれない。大切な情報は、保存先と残し方を確かめよう。","explanationTitle":"バックアップは、戻すための備え","body2":"バックアップは、故障や操作ミスなどに備えて、データのコピーを残すこと。同期と重なる機能があるサービスもあるけれど、同期していれば過去の状態が必ず残るとは限らないよ。復元できる範囲や期間も違うので、大人と公式の説明を読み、必要な備えを考えよう。","example":{"title":"機種変更したら、大事な写真が見つからない","paragraphs":["前のスマホではいつも見られた写真でも、端末だけの保存なら、新しいスマホに自動で現れるとは限らない。前の端末を初期化する前に、必要な情報が移せたかを家族と一緒に確認しよう。","クラウドの一覧に写真が見える場合も、元の大きさで開けるか、バックアップが完了しているかを確かめたいね。「画面に出たから全部保存できた」と思い込まず、大切な情報から点検しよう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["大切な写真や文書がどこに保存されるか確かめる。","機種変更や初期化の前に、家族と移行を確認する。","バックアップと復元の条件を、公式の説明で見る。"],"reflect":"写真が一覧に見えれば、元のデータも必ずその端末にあるのかな？","key":"大切な情報は、表示だけで安心せず保存先とバックアップを確かめよう。","imageAlt":"親子が、端末内の写真を表す箱と、クラウドの保存場所を表す箱を見比べている。","caption":"大切な情報は、表示だけで安心せず保存先とバックアップを確かめよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":4},{"label":"削除と同期","title":"一つ消すと、ほかの場所も変わる？","body":"同期するサービスでは、一つの端末で写真や文書を削除すると、クラウドやほかの端末にも反映される場合がある。逆に「端末からだけ削除する」専用の操作があるサービスもあるよ。同じ「削除」という言葉でも、どこから何が消えるのかは、サービスや操作によって違うんだ。","explanationTitle":"容量を空ける前に、説明を読もう","body2":"「別の端末にもあるから大丈夫」と思って大量に消すと、必要な情報まで失うことがある。ごみ箱から戻せる期間が決まっていたり、完全削除すると戻せなかったりする場合もあるよ。容量不足で困ったら、確認画面を読み、何を消す操作か分からないまま実行しないでね。","example":{"title":"スマホだけ軽くするつもりだったのに","paragraphs":["スマホの空きを増やそうと写真を削除したら、タブレットからも消えた。同期で削除が反映された可能性があるね。繰り返し操作せず、大人とごみ箱や公式ヘルプを確認しよう。","サービスによっては「空き容量を増やす」と「写真を削除する」が別の機能になっている。名前が似ているだけで同じ操作だと決めず、どの保存場所に影響するかを確かめてから使おう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["削除の確認画面で、対象の保存場所を読む。","たくさん消すときや完全削除は、先に大人に相談する。","消し間違えたら、追加の操作を急がず相談する。"],"reflect":"タブレットにも写真があるから、スマホから自由に消して大丈夫かな？","key":"同期や削除の範囲はサービスごとに違う。消す前に確かめよう。","imageAlt":"スマホで消した写真がタブレットでも消え、親子が落ち着いて確認画面を見直している。","caption":"同期や削除の範囲はサービスごとに違う。消す前に確かめよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":5},{"label":"アプリ削除と退会","title":"アプリを消しても、会員情報は残ることがある","body":"アプリのアンインストールは、端末からそのアプリを取り除くこと。サービスのアカウント削除や退会とは別の手続きだよ。アプリを消しても、サーバーにある投稿やプロフィール、契約が残る場合がある。定期購入も、アプリを消すだけで自動的に止まるとは限らないんだ。","explanationTitle":"やめるときも、確認することがある","body2":"使わなくなったサービスは、家族と退会方法や課金の有無を確認しよう。必要な写真などを保存し、解約やアカウント削除の条件を読んでから進める。退会後も、法令などの理由で運営側が一定の情報を残す場合があるので「退会したら、すべての記録が必ずすぐ消える」とも考えないでね。","example":{"title":"ゲームを消したのに、お知らせが届く","paragraphs":["遊ばなくなったゲームのアプリを削除したのに、登録したメールへ案内が届いた。端末からアプリが消えただけで、サービスの会員登録は続いているのかもしれない。家族と公式の設定を確認しよう。","課金がある場合は、サービスや購入したストアなどで解約手続きが必要なこともある。知らない「退会代行」にパスワードを渡すのではなく、公式ヘルプと保護者を頼ってね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["アプリ削除・解約・退会は、同じ操作ではないと覚える。","使わないサービスと課金の有無を家族と見直す。","やめる手続きは、公式ヘルプで確認する。"],"reflect":"アプリのアイコンがなくなったら、会員登録や課金も必ず終わるかな？","key":"アンインストールと、解約・退会は別。使い終わりも家族と確認しよう。","imageAlt":"消したアプリのアイコンと、まだ残る会員証を親子が別々に見比べている。","caption":"アンインストールと、解約・退会は別。使い終わりも家族と確認しよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":6},{"label":"共有リンク","title":"リンクを知っている人は、誰まで？","body":"クラウドの写真や文書は、リンクを送って共有できることがある。共有先を指定した人だけにする設定もあれば、リンクを知っている人が開ける設定もあるよ。「閲覧だけ」「編集もできる」などの権限も違う。リンクを作る前に、誰に、何を許可するかを確認しよう。","explanationTitle":"便利なリンクも、転送されることがある","body2":"友達一人に送ったつもりでも、そのリンクが別の人へ転送される可能性がある。公開範囲が広ければ、知らない人が見たり書き換えたりできることもあるよ。自分や友達の情報が入ったデータは、まず大人に相談し、必要な相手と必要な権限だけに絞ろう。","example":{"title":"クラスの写真を、リンクでまとめて送りたい","paragraphs":["写真を集めたアルバムに、友達の顔や名前が入っている。「リンクを知っている全員」にして送る前に、写っている人の許可と共有範囲を確認しよう。便利さだけで公開を決めないでね。","もし広い範囲で共有してしまったら、共有を停止したり範囲を狭めたりできるか、大人とすぐ確認する。ただし、すでに保存されたコピーまで必ず消せるわけではない。失敗したあとも早めに相談しよう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["共有先と、閲覧・編集などの権限を確認する。","友達の情報を含むときは、本人と家族に確認する。","共有を間違えたら、止める方法を大人と確認する。"],"reflect":"一人に送った共有リンクは、その人以外には絶対に届かないかな？","key":"共有前に、相手と権限を確認。間違えたら、一人で抱えず相談しよう。","imageAlt":"親子がアルバムの共有先を点検し、必要な相手だけに渡すリンクを選んでいる。","caption":"共有前に、相手と権限を確認。間違えたら、一人で抱えず相談しよう。","image":"assets/lessons/chapter03-atlas.jpg","imagePanel":7,"check":{"prompt":"共有リンクを作る前に、確認したいことは？","options":["リンクの色だけ","送信ボタンの大きさだけ","誰が開けて、閲覧や編集のどの権限を持つか"],"answer":2,"explain":"共有先と権限を必要な範囲に絞ろう。"}}],"questions":[{"slide":0,"q":"ブラウザとは、どんな道具？","options":["Webページを開いて表示するアプリ","インターネット上の情報を全部作る会社","スマホを充電する機器"],"answer":0,"why":"ChromeやSafariなどは、Webを見るためのブラウザだよ。","id":"chapter3-1","tag":"Webとブラウザ"},{"slide":0,"q":"有名なブラウザに表示された広告なら、全部信用してよい？","options":["ブラウザが有名なら必ず本物","広告を出した相手や内容を別に確かめる","表示された順に全部申し込む"],"answer":1,"why":"表示する道具の信用と、その中の情報を出した相手の信用は別だよ。","id":"chapter3-2","tag":"Webとブラウザ"},{"slide":1,"q":"サービス名が同じアプリを見つけた。追加する前にすることは？","options":["名前が同じなら、すぐ入れる","無料なら、どこからでも入れる","家族と公式の案内や開発者、料金を確認する"],"answer":2,"why":"名前や色だけでは公式とは分からない。追加する前に確認しよう。","id":"chapter3-3","tag":"Web版とアプリ版"},{"slide":1,"q":"Web版とアプリ版について正しい考え方は？","options":["同じサービスでも、機能や料金などが違う場合がある","必ず料金も機能も完全に同じ","Web版ではアカウントを使うことはない"],"answer":0,"why":"入口が違うと条件が異なることもあるので、公式の案内を見よう。","id":"chapter3-4","tag":"Web版とアプリ版"},{"slide":2,"q":"クラウドの説明として近いものは？","options":["空に浮かぶ雲が写真を覚えている","ネット越しにサービス側の機器の保存場所や働きを使う","スマホにしか情報を置かない仕組み"],"answer":1,"why":"実際には、サービス側のコンピュータが情報を保存・処理しているよ。","id":"chapter3-5","tag":"クラウドの正体"},{"slide":2,"q":"クラウドに預ければ、何があっても永久に使える？","options":["どんな契約でも永久に残る","ログインできなくても誰でも開ける","保存条件やアカウントの状態などを確認する必要がある"],"answer":2,"why":"クラウドにも、サービスの不調や保存容量、契約などの条件があるよ。","id":"chapter3-6","tag":"クラウドの正体"},{"slide":3,"q":"同期について、正しい説明は？","options":["複数の場所の情報を、同じ状態にそろえる働き","どんなデータも絶対に消えない保証","すべての端末を無料で交換する機能"],"answer":0,"why":"写真や編集内容などが別の端末にも反映されることがあるよ。","id":"chapter3-7","tag":"同期の働き"},{"slide":3,"q":"自分の写真が家のタブレットにも出てきた。まずどうする？","options":["必ず盗まれたと決めつける","家族と、アカウントや同期の設定を確認する","全部の写真を急いで消す"],"answer":1,"why":"同じアカウントの同期で表示された可能性などを確認しよう。","id":"chapter3-8","tag":"同期の働き"},{"slide":4,"q":"写真が一覧に見えれば、元データは必ずその端末にある？","options":["見えれば、必ず全部端末にある","通信がなくても必ず開ける","クラウドから表示している場合もあるので保存先を確認する"],"answer":2,"why":"表示されることと、その端末に元のデータが保存されていることは別だよ。","id":"chapter3-9","tag":"保存先とバックアップ"},{"slide":4,"q":"前のスマホを初期化する前に、することは？","options":["大切な情報を移せたか、家族と確認する","写真があったことを思い出すだけでよい","初期化してから必要な情報を考える"],"answer":0,"why":"失う前に、保存先とバックアップ・移行を確かめよう。","id":"chapter3-10","tag":"保存先とバックアップ"},{"slide":5,"q":"同期中の写真を一つの端末で削除すると？","options":["ほかの場所には絶対に影響しない","ほかの端末やクラウドにも削除が反映される場合がある","必ず世界中のコピーが全部消える"],"answer":1,"why":"削除の範囲は、サービスや操作によって違うよ。","id":"chapter3-11","tag":"削除と同期"},{"slide":5,"q":"空き容量を増やしたいが、削除の範囲が分からない。どうする？","options":["とりあえず完全削除を押す","全部消してから考える","確認画面を読み、大人と公式ヘルプを確かめる"],"answer":2,"why":"どこから何が消えるか分からないまま、大量に削除しないでね。","id":"chapter3-12","tag":"削除と同期"},{"slide":6,"q":"アプリをアンインストールしたら？","options":["退会や定期購入の解約まで終わるとは限らない","会員情報も課金も必ず全部消える","運営側の記録が必ず即座に消える"],"answer":0,"why":"端末からアプリを取り除くことと、契約や会員登録を終えることは別だよ。","id":"chapter3-13","tag":"アプリ削除と退会"},{"slide":6,"q":"使わないサービスをやめるときは？","options":["知らない退会代行にパスワードを渡す","保護者と公式の退会・解約方法を確認する","アイコンを隠すだけでよい"],"answer":1,"why":"保存したい情報や課金の有無も確認して、公式の手順で進めよう。","id":"chapter3-14","tag":"アプリ削除と退会"},{"slide":7,"q":"共有リンクを作る前に、確認したいことは？","options":["リンクの色だけ","送信ボタンの大きさだけ","誰が開けて、閲覧や編集のどの権限を持つか"],"answer":2,"why":"共有先と権限を必要な範囲に絞ろう。","id":"chapter3-15","tag":"共有リンク"},{"slide":7,"q":"友達の情報を含む写真を、広い範囲に共有してしまった。どうする？","options":["すぐ大人に相談し、共有停止などの対処を一緒に確認する","怒られそうなので隠す","消す方法を教えるという知らない人にログイン情報を渡す"],"answer":0,"why":"失敗したあとでも相談していい。共有を止めるなど、早めの対処をしよう。","critical":true,"id":"chapter3-16","tag":"共有リンク"}],"sources":[{"title":"MDN：ウェブのしくみ","url":"https://developer.mozilla.org/ja/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works","note":"Web、ブラウザ、クライアントとサーバーの基礎。","checked":"2026-11-17"},{"title":"Google フォト：写真や動画をバックアップする","url":"https://support.google.com/photos/answer/6193313?hl=ja","note":"サービスごとのバックアップ、複数端末での利用の例。","checked":"2026-11-17"},{"title":"Google フォト：写真や動画を削除する","url":"https://support.google.com/photos/answer/6128858?hl=ja","note":"削除が影響する範囲や、端末だけから取り除く操作の違い。","checked":"2026-11-17"},{"title":"Google Play：定期購入を解約、一時停止、変更する","url":"https://support.google.com/googleplay/answer/7018481?hl=ja","note":"アプリのアンインストールでは定期購入は解約されない。","checked":"2026-11-17"},{"title":"Google ドライブ：ファイルを共有する","url":"https://support.google.com/drive/answer/2494822?hl=ja","note":"共有する相手と、閲覧・編集などのアクセス権。","checked":"2026-11-17"}],"number":3},{"title":"URL・通信・履歴","description":"行き先と通信の保護、残る記録の違いを知り、怪しい入口で立ち止まろう。","lessons":[{"label":"URLという住所","title":"ページの住所を、少しだけ読んでみよう","body":"URL（ユーアールエル）は、Web上のページやファイルなどの場所を示す情報だよ。「https://example.com/guide」のように、通信の方式、接続する相手の名前、ページの場所などを組み合わせている。全部の記号を暗記する必要はないけれど、今どこへ行こうとしているのかを考える手がかりになる。","explanationTitle":"見出しより、実際の行き先を確かめる","body2":"リンクに表示された「公式サイト」という文字と、実際に開くURLが一致するとは限らない。画面が小さいと住所の一部が隠れることもあるよ。よく分からないURLを見て、見た目だけで本物と判断しなくていい。大切な情報を入力する前には、いつもの公式アプリや保存した公式の入口を使おう。","example":{"title":"「学校のお知らせ」と書かれたリンク","paragraphs":["メッセージに学校名が書かれていても、リンク先が学校のサイトとは限らない。文字は送った相手が自由に付けられるからだよ。いつも学校が案内する方法や公式の連絡先で、同じお知らせがあるか確認しよう。","住所の読み方に自信がないときは、分からないまま進まず大人に見せよう。この教材では本物のパスワードや個人情報を入力して練習しないよ。安全に確認する方法を覚えれば十分なんだ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["URLは行き先を示す情報だと覚える。","リンクの表示名だけを本物の証拠にしない。","入力が必要な場面は、公式の入口から開き直す。"],"reflect":"「公式」と書かれた文字だけで、本当の行き先が分かるかな？","key":"URLは行き先の手がかり。リンクの名前だけで信用しない。","imageAlt":"子どもとロボットが、家の住所札を読むようにスマホのURL欄を確かめている。","caption":"URLは行き先の手がかり。リンクの名前だけで信用しない。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":0},{"label":"似た名前の行き先","title":"そっくりな文字でも、違うサイトのことがある","body":"本物に似せたドメイン名や、長いURLの中に有名な名前を入れたものが使われることがある。例えば「school.example.com」と「school-example.com」は違う名前だよ。文字の見た目や有名な単語が含まれることだけでは、運営者が同じだと判断できないんだ。","explanationTitle":"URLの目視だけで、全部見破ろうとしない","body2":"短縮URLなど、開く前には行き先が分かりにくい仕組みもある。正しいURLを丸暗記すればすべて安心、ということでもないよ。パスワードや支払いを求められたときは、送られたリンクを入口にせず、家族と確認した公式アプリやブックマークから確かめよう。","example":{"title":"有名なゲームの名前が入ったURL","paragraphs":["友達から「無料でアイテムがもらえる」とリンクが来た。ゲーム名が入っているけれど、公式のドメインと同じとは限らない。名前に気を取られて、電話番号やパスワードを入力しないでね。","まず、普段使う公式アプリから同じキャンペーンがあるかを探す。分からなければ大人と公式ヘルプを確認しよう。住所のクイズを一人で解けるかより、怪しい入口から離れる行動が大切だよ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["似た文字や長いURLだけで本物と決めない。","短縮されたリンクは、行き先が見えにくいと知る。","ログインや購入は、確認済みの公式の入口から行う。"],"reflect":"URLのどこかに好きなゲームの名前があれば、その公式サイトかな？","key":"似たURLを見破る力だけに頼らず、公式の入口から確認しよう。","imageAlt":"そっくりな二つのお店の看板を、親子が立ち止まって見比べている。","caption":"似たURLを見破る力だけに頼らず、公式の入口から確認しよう。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":1,"check":{"prompt":"ゲーム名を含むURLからログインを求められた。どうする？","options":["名前が入っていれば、すぐ入力する","長いURLなら必ず安心","公式アプリなど、確認済みの入口から確かめる"],"answer":2,"explain":"似た名前を使った別のサイトもある。目視だけに頼らず公式の入口を使おう。"}},{"label":"HTTPSと暗号化","title":"通信を守る仕組みと、相手への信用は別","body":"HTTPS（エイチティーティーピーエス）は、ブラウザとサイトの間の通信を暗号化などで守る仕組みを使うよ。途中の第三者に内容を盗み見られたり、書き換えられたりしにくくする。ただし、情報を受け取るサイト自身には、入力した内容が届くことを忘れないでね。","explanationTitle":"保護された通信でも、だますサイトはある","body2":"HTTPSのURLや接続が保護されている表示は、「その店が必ず商品を送る」「書いてある情報が全部正しい」という保証ではない。だます目的のサイトもHTTPSを使えるんだ。接続の安全性を確かめることに加え、運営者や公式の案内を確認する必要があるよ。","example":{"title":"鍵の付いた封筒を、誰に送る？","paragraphs":["封筒に鍵が掛かっていても、宛先が悪い相手なら、中身を渡してしまう。HTTPSを考えるときも少し似ているよ。途中を守る仕組みがあっても、送信先が信用できるかまでは確かめてくれない。","「接続は安全」と見えても、突然プレゼントのためにパスワードを求められたら止まろう。普段の公式アプリから確認し、分からないときは大人に相談する。鍵の表示だけで決めないでね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["HTTPSは通信を守る仕組みだと覚える。","入力した情報は、送信先のサイトに届くと考える。","通信の表示と、運営者の信用を分けて確認する。"],"reflect":"鍵付きの封筒なら、誰を宛先にしても安心して秘密を入れてよいかな？","key":"HTTPSは通信を守る。サイトの内容や運営者の信用までは保証しない。","imageAlt":"親子が鍵付きの封筒を持ち、誰に渡すかを考えている。","caption":"HTTPSは通信を守る。サイトの内容や運営者の信用までは保証しない。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":2},{"label":"警告と開き直し","title":"警告が出たら、急いで通り抜けない","body":"ブラウザが「危険なサイト」「接続の安全性に問題がある」などの警告を出すことがある。サイトや通信、端末の状態など、理由はいろいろで、警告だけでは原因が決まらないこともあるよ。でも、よく分からないまま警告を無視して、個人情報を入れるのはやめよう。","explanationTitle":"急がせる言葉から、一歩離れよう","body2":"「今すぐ確認しないと使えなくなる」と言われても、送られたリンクをそのまま使う必要はない。画面を閉じ、確認済みの公式アプリやブックマークから開き直して、大人と確かめよう。警告を消すために、知らない証明書やアプリを入れたり、安全設定を弱めたりしないでね。","example":{"title":"プレゼントのページで、赤い警告が出た","paragraphs":["「警告は無視して進んで」とメッセージに書いてあっても、それに従う必要はないよ。送ってきた相手が友達の名前でも、なりすましや乗っ取りの可能性がある。いったんページから離れよう。","公式の入口では同じ案内が見つからないなら、その場で申し込まなくていい。判断に迷う画面を大人に見せることが、安全に使う行動だよ。焦って押したあとでも、隠さず相談してね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["ブラウザの警告を、分からないまま無視しない。","送られたリンクから離れ、公式の入口で確かめる。","警告を消すためのアプリ追加や設定変更をしない。"],"reflect":"友達から「警告は気にしないで」と言われたら、そのまま進んでよいかな？","key":"警告や急な要求があれば止まり、公式の入口と大人に確認しよう。","imageAlt":"急な通知のリンクを開こうとする子どもに、保護者が落ち着いて公式の入口を示している。","caption":"警告や急な要求があれば止まり、公式の入口と大人に確認しよう。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":3,"check":{"prompt":"警告が出たリンクを「無視して進んで」と言われた。どうする？","options":["止まって大人に相談し、公式の入口で確認する","友達の名前なら警告を無視する","安全設定を全部切って開く"],"answer":0,"explain":"警告の原因が分からないまま進んだり、設定を弱めたりしないでね。"}},{"label":"いろいろな履歴","title":"記録は、一か所だけにあるとは限らない","body":"ブラウザには、訪れたページの一覧である閲覧履歴が残ることがある。検索サービスのアカウントに残る検索履歴や、サイト側の利用記録は、別の場所の記録だよ。同期が有効なら、ブラウザの履歴が同じアカウントのほかの端末に反映される場合もある。","explanationTitle":"一つ消せば、全部消えるわけではない","body2":"端末の閲覧履歴を削除しても、検索サービスや訪問先の記録まで必ず消えるわけではない。また、消したくないタブや保存した情報まで変わる操作もあるので、設定の説明を読もう。記録を隠す方法を探すより、困るページを開いたときに相談できることが大切だよ。","example":{"title":"調べ物の履歴が、家のパソコンにも見えた","paragraphs":["同じアカウントでブラウザの履歴を同期していると、スマホで見たページが別の端末にも表示される場合がある。「自分のスマホだから、どんな記録もここにしか残らない」とは限らないんだ。","何を家族が確認するかは、先に親子で話し合っておこう。保護者も、理由を説明せず何でも見るのではなく、安全確認の範囲と相談の約束を共有することが大切だね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["閲覧履歴と、検索サービスなどの記録は別だと知る。","同期される端末や範囲を家族と確認する。","安全確認で見る範囲を、親子で先に話し合う。"],"reflect":"スマホの閲覧履歴を消したら、訪問したサイトの記録も必ず全部消えるかな？","key":"端末の履歴、アカウントの記録、サイト側の記録は別々に考える。","imageAlt":"子どもとロボットが、端末やサービスのそれぞれに残る足跡の模型を眺めている。","caption":"端末の履歴、アカウントの記録、サイト側の記録は別々に考える。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":4},{"label":"シークレットモード","title":"履歴を残しにくくする機能と、匿名は別","body":"シークレットモードなどは、その利用を終えたあと、ブラウザに閲覧履歴やCookieなどを残しにくくするための機能だよ。ただし、保存したファイルや追加したブックマークが残る場合がある。具体的な働きは、ブラウザの公式の説明で確かめよう。","explanationTitle":"通信相手から見えなくなる機能ではない","body2":"このモードでも、訪れたサイトや、利用するネットワークの管理者などに、利用に関する情報が分かる可能性がある。サイトにログインすれば、そのアカウントで使っていることも相手に伝わる。「誰にも分からない」「危険なサイトも安全になる」という機能ではないんだ。","example":{"title":"「このモードなら、何をしてもばれない」？","paragraphs":["友達が、履歴が残らないから全部安心だと言った。でも、ブラウザの手元の記録を減らすことと、通信の相手やネットワークから見えなくなることは違う。言い方が似ていても、同じ意味ではないよ。","困るページを開いてしまったら、モードに関係なく閉じて相談していい。危険な行為を試したり、家族の約束や学校の制限を回避したりするための抜け道として考えないでね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["利用後に残る記録と、通信先に伝わる情報を分ける。","保存したファイルなどは残る場合があると覚える。","分からない機能は、公式の説明を大人と確認する。"],"reflect":"カーテンを閉めた部屋から電話しても、電話の相手には声が届くよね。ブラウザではどうかな？","key":"シークレットモードでも、ネット上で完全に匿名になるわけではない。","imageAlt":"カーテンの内側にいる子どものスマホから、外の通信相手へ情報が届く様子を表している。","caption":"シークレットモードでも、ネット上で完全に匿名になるわけではない。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":5},{"label":"Cookieとサイトデータ","title":"サイトが覚えておく、小さな情報","body":"Cookie（クッキー）は、サイトがブラウザに保存させる小さな情報。ログインした状態や、買い物かごの中身などを保つために使われることがあるよ。一方、複数のサイトでの行動を手がかりに広告などへ利用される場合もある。Cookieそのものを、全部ウイルスだと思う必要はないんだ。","explanationTitle":"便利さと、プライバシーを考えよう","body2":"サイトにはCookie以外の保存の仕組みもある。何を保存し、何に使うかを説明する画面が出たら、分からないまま何でも許可せず、家族と確認しよう。Cookieなどを削除すると、ログアウトしたり設定が元に戻ったりすることがあるので、影響も知ってから操作してね。","example":{"title":"買い物かごの品物が、次に開いても残っていた","paragraphs":["サイトは、ブラウザに置いた情報などを使って、前の状態を呼び出すことがある。便利だけれど、家族共用の端末なら、ほかの人にも状態が見えることがあるね。購入の操作は家族の約束に従おう。","「Cookieを消せば、ネット上の記録が全部なくなる」とは限らない。サイト側の記録などは別だからだよ。便利さのための保存と、自分に関する情報の利用を、少しずつ区別していこう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["Cookieは小さな保存情報で、働きはいろいろだと知る。","許可の説明が分からなければ、大人と確認する。","削除するとログアウトなどが起きる場合を考える。"],"reflect":"Cookieは全部危険なのかな？ 便利に使われる場面もあるかな？","key":"Cookieの役割と使われ方を知り、許可や削除の影響を確かめよう。","imageAlt":"ロボットがログイン状態や買い物かごを表す小さなメモカードを、子どもに見せている。","caption":"Cookieの役割と使われ方を知り、許可や削除の影響を確かめよう。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":6},{"label":"共有端末の後片付け","title":"タブを閉じることと、ログアウトは別","body":"家族共用のパソコンなどでサービスにログインしたら、使い終わりにも気を付けよう。タブやアプリを閉じても、ログイン状態が残っている場合がある。そのまま次の人が使うと、自分のメッセージやデータが開けたり、自分の名前で操作できたりするかもしれない。","explanationTitle":"本物の情報を残さない使い方を選ぼう","body2":"そもそも借りた端末でログインしてよいか、先に大人に確認する。必要なときはパスワードを保存せず、終わったらサービスからログアウトし、置いたファイルも確認しよう。うっかり保存したり、他人のログイン画面が開いたりしたときは、勝手に中を見ず、その端末の持ち主や大人に伝えてね。","example":{"title":"学校の共用端末で、前の人の画面が開いた","paragraphs":["友達のアカウントのメールや写真が見えても、「見られるから見ていい」わけではない。その人になり代わって操作せず、画面から離れて先生に知らせよう。面白がって撮影したり転送したりしないでね。","自分が使ったあとも、タブを閉じるだけで済ませず、決められた終了方法を守ろう。もし残してしまったかもと思ったら、大人と公式の方法でログイン中の端末などを確認する。早めに伝えることが助けになるよ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["共用端末でのログインは、先に大人へ確認する。","終了時は、決められたログアウト方法を守る。","他人の画面が開いたら、中を見ず大人に知らせる。"],"reflect":"前の人のメッセージが開いたままだったら、何をせず、誰に伝える？","key":"共有端末は、入り方と終わり方を確認。他人の情報が見えたら勝手に見ない。","imageAlt":"子どもが共有パソコンからログアウトして席を立ち、ロボットが片付けを見守っている。","caption":"共有端末は、入り方と終わり方を確認。他人の情報が見えたら勝手に見ない。","image":"assets/lessons/chapter04-atlas.jpg","imagePanel":7,"check":{"prompt":"共用端末で使い終わったら、タブを閉じるだけで必ずログアウトできる？","options":["必ずできる","画面を暗くするだけでもよい","ログイン状態が残る場合があるので、決められた終了方法を守る"],"answer":2,"explain":"タブを閉じることと、サービスのログアウトは別だよ。"}}],"questions":[{"slide":0,"q":"URLの役割として近いものは？","options":["Web上のページなどの場所を示す","ページの内容の正しさを採点する","スマホの使用時間を制限する"],"answer":0,"why":"URLは、通信の相手やページの場所などを示す情報だよ。","id":"chapter4-1","tag":"URLという住所"},{"slide":0,"q":"リンクに「公式」と表示されている。どう考える？","options":["文字だけで必ず公式だと分かる","表示名だけで信用せず、公式の入口などで確認する","文字の色がきれいなら必ず本物"],"answer":1,"why":"表示する文字と実際の行き先が一致するとは限らないよ。","id":"chapter4-2","tag":"URLという住所"},{"slide":1,"q":"ゲーム名を含むURLからログインを求められた。どうする？","options":["名前が入っていれば、すぐ入力する","長いURLなら必ず安心","公式アプリなど、確認済みの入口から確かめる"],"answer":2,"why":"似た名前を使った別のサイトもある。目視だけに頼らず公式の入口を使おう。","id":"chapter4-3","tag":"似た名前の行き先"},{"slide":1,"q":"短縮URLについて正しい考え方は？","options":["行き先が分かりにくい場合がある","短ければすべて公式","短いリンクには個人情報を入れても危険がない"],"answer":0,"why":"短さや見た目を信用の証拠にしないでね。","id":"chapter4-4","tag":"似た名前の行き先"},{"slide":2,"q":"HTTPSの主な役割は？","options":["運営者が必ず正直だと保証する","サイトとの間の通信を暗号化などで守る","あらゆるネット上の記録を消す"],"answer":1,"why":"途中の盗み見などを防ぎやすくする仕組みだよ。","id":"chapter4-5","tag":"HTTPSと暗号化"},{"slide":2,"q":"HTTPSのサイトなら、入力した情報はサイト運営者にも届かない？","options":["誰にも一切届かない","入力すると自動で消える","送信先には情報が届くので、相手の信用も確認する"],"answer":2,"why":"途中を守ることと、送信先を信用できることは別だよ。","id":"chapter4-6","tag":"HTTPSと暗号化"},{"slide":3,"q":"警告が出たリンクを「無視して進んで」と言われた。どうする？","options":["止まって大人に相談し、公式の入口で確認する","友達の名前なら警告を無視する","安全設定を全部切って開く"],"answer":0,"why":"警告の原因が分からないまま進んだり、設定を弱めたりしないでね。","id":"chapter4-7","tag":"警告と開き直し"},{"slide":3,"q":"急なメッセージで、アカウント確認のリンクが届いた。どうする？","options":["締切が近ければ何でも従う","リンクから離れ、いつもの公式アプリなどで確認する","警告を消す専用アプリをすぐ入れる"],"answer":1,"why":"急がされても、そのリンクを使う必要はないよ。","id":"chapter4-8","tag":"警告と開き直し"},{"slide":4,"q":"端末の閲覧履歴を消すと、サイト側の記録も必ず全部消える？","options":["どんな記録も世界中から消える","検索サービスの記録も必ず消える","別の場所の記録まで消えるとは限らない"],"answer":2,"why":"閲覧履歴、検索サービスの履歴、サイト側の記録は別だよ。","id":"chapter4-9","tag":"いろいろな履歴"},{"slide":4,"q":"閲覧履歴が別の端末でも見えた。考えられることは？","options":["同じアカウントの同期が働いた可能性がある","必ずスマホが壊れた","履歴は絶対に別端末に出ない"],"answer":0,"why":"同期設定によって、履歴がほかの端末に反映されることがあるよ。","id":"chapter4-10","tag":"いろいろな履歴"},{"slide":5,"q":"シークレットモードを使うと？","options":["通信先にも必ず完全に匿名になる","手元の履歴などを残しにくくするが、通信先などに情報が伝わる場合がある","危険なサイトも全部安全になる"],"answer":1,"why":"手元の記録を減らすことと、ネット上で見えなくなることは別だよ。","id":"chapter4-11","tag":"シークレットモード"},{"slide":5,"q":"シークレットモードで保存したファイルは？","options":["必ずすぐ自動で消える","誰にも見られない特別な形になる","端末に残る場合があるので確認する"],"answer":2,"why":"ダウンロードやブックマークは残る場合があるよ。","id":"chapter4-12","tag":"シークレットモード"},{"slide":6,"q":"Cookieについて正しい説明は？","options":["ログイン状態などを保つためにも使う、小さな保存情報","全部がウイルスである","サイトの通信をすべて止める機能"],"answer":0,"why":"便利な働きにも、広告などの用途にも使われることがあるよ。","id":"chapter4-13","tag":"Cookieとサイトデータ"},{"slide":6,"q":"Cookieなどを削除する前に知りたいことは？","options":["削除すれば相手側の記録も必ずなくなる","ログアウトや設定の変化など、影響がある場合もある","どんなサイトでも機能は一切変わらない"],"answer":1,"why":"許可や削除の説明を、分からなければ大人と確認しよう。","id":"chapter4-14","tag":"Cookieとサイトデータ"},{"slide":7,"q":"共用端末で使い終わったら、タブを閉じるだけで必ずログアウトできる？","options":["必ずできる","画面を暗くするだけでもよい","ログイン状態が残る場合があるので、決められた終了方法を守る"],"answer":2,"why":"タブを閉じることと、サービスのログアウトは別だよ。","id":"chapter4-15","tag":"共有端末の後片付け"},{"slide":7,"q":"共用端末で、前の人のメールが開いたままだった。どうする？","options":["中を見たり操作したりせず、先生などの大人に知らせる","読める状態なので自由に読む","面白い部分を撮って友達に送る"],"answer":0,"why":"見られる状態でも許可があるとは限らない。勝手に使わず、相談しよう。","critical":true,"id":"chapter4-16","tag":"共有端末の後片付け"}],"sources":[{"title":"MDN：URLとは何か","url":"https://developer.mozilla.org/ja/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_URL","note":"URLの構成と、Web上の場所を示す役割。","checked":"2026-11-17"},{"title":"Google Chrome：サイトの接続が安全かどうかを確認する","url":"https://support.google.com/chrome/answer/95617?hl=ja","note":"接続の保護、警告、正しいサイトかの確認。","checked":"2026-11-17"},{"title":"Google Chrome：シークレットモードでブラウジングする","url":"https://support.google.com/chrome/answer/95464?hl=ja","note":"履歴やCookie、残るファイル、匿名化されない範囲。","checked":"2026-11-17"},{"title":"Google Chrome：閲覧履歴を確認、削除する","url":"https://support.google.com/chrome/answer/95589?hl=ja","note":"ブラウザ履歴とアカウントの記録、同期。","checked":"2026-11-17"},{"title":"Google Chrome：Cookieを削除、許可、管理する","url":"https://support.google.com/chrome/answer/95647?hl=ja","note":"Cookieの用途と、削除・許可に伴う変化。","checked":"2026-11-17"}],"number":4},{"title":"アカウントと本人確認","description":"アカウントの持ち主と認証の意味を知り、秘密の情報と人の利用場所を守ろう。","lessons":[{"label":"アカウントとは","title":"サービスの中の、自分の利用場所","body":"アカウントは、そのサービスで「誰の利用か」を区別し、設定やデータなどを結びつけるためのもの。ユーザー名やメールアドレスなどで見分けることが多いよ。スマホ本体とアカウントは別なので、一つの端末で複数のアカウントを使ったり、同じアカウントを複数端末で使ったりする場合もあるんだ。","explanationTitle":"端末の持ち主と、利用中の名義は同じとは限らない","body2":"家族のスマホを借りても、自動で自分のアカウントになるわけではない。保護者の名義で投稿や購入をしてしまうこともあるよ。操作する前に、今のアカウント表示と、何をしてよいかを確認しよう。端末に触る許可があることと、どのサービスも自由に使う許可は別だよ。","example":{"title":"借りたタブレットで、ゲームを始めたい","paragraphs":["保護者のタブレットにゲームが入っていても、保護者のアカウントで動いているかもしれない。自分の名前で始めるつもりが、家族の記録や購入履歴を変えてしまうこともある。まず、使ってよいかを確認しよう。","別のサービスでも同じ名前が表示される場合があるけれど、アカウントが同一とは限らないよ。どのサービスの、誰の利用場所なのかを分けて考えると、うっかりした操作を防ぎやすくなるね。"]},"actionTitle":"自分の使い方で確かめよう","actions":["端末本体と、サービスのアカウントを区別する。","今、誰のアカウントで使っているか確かめる。","借りた端末では、操作の範囲を先に聞く。"],"reflect":"保護者のスマホを借りたら、その中のアカウントも自由に使ってよいかな？","key":"操作する前に、どのサービスの、誰のアカウントかを確かめよう。","imageAlt":"子どもが、スマホ本体とサービスの会員証を別々のものとして親子で見比べている。","caption":"操作する前に、どのサービスの、誰のアカウントかを確かめよう。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":0},{"label":"登録と公開プロフィール","title":"登録する情報と、人に見える情報を分ける","body":"アカウント登録では、年齢などを確認するため、サービスが情報の入力を求めることがある。一方、プロフィールの表示名や自己紹介など、ほかの利用者に見える情報もあるよ。登録情報と公開情報の範囲はサービスによって違う。何のための項目で、誰に見えるかを確かめよう。","explanationTitle":"利用条件を守り、公開する内容は少なく","body2":"利用できる年齢や保護者の同意などの条件は、サービスや使う機能によって異なる。年齢をごまかして始めず、保護者と公式の条件を確認してね。公開する欄には、必要のない本名や学校名、連絡先などを入れない。必須項目も、分からなければ勝手に情報を足さず相談しよう。","example":{"title":"プロフィールを「友達が見つけやすい」形にしたい","paragraphs":["学校名、学年、部活、顔写真を全部載せると、知らない人にも生活の手がかりを渡すかもしれない。友達が見つけやすい便利さだけでなく、誰から見えるのかを先に確認しよう。","運営への登録に必要な情報と、みんなに見せる自己紹介は分けて考える。見える範囲の設定があっても、相手がコピーする可能性はあるよ。公開情報を少なくする方法を、家族と選ぼう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["年齢などの利用条件を、保護者と公式の案内で見る。","登録項目が何のためで、誰に見えるか確認する。","公開プロフィールに、不要な学校名や連絡先を載せない。"],"reflect":"運営へ登録が必要な情報は、みんなにも公開しなければいけないのかな？","key":"利用条件を守り、登録情報と公開プロフィールを分けて考えよう。","imageAlt":"親子がプロフィールの項目を選び、学校名や連絡先を公開しない設定を考えている。","caption":"利用条件を守り、登録情報と公開プロフィールを分けて考えよう。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":1,"check":{"prompt":"登録と公開プロフィールについて、正しい考え方は？","options":["登録に必要な情報は、必ず全部公開する","年齢条件は好きな数字で避けてよい","利用条件と、誰に見える情報かを保護者と確認する"],"answer":2,"explain":"サービスごとの利用条件を守り、登録情報と公開する情報を区別しよう。"}},{"label":"ログインと本人確認","title":"「このアカウントを使う人」を確かめる","body":"ログインは、パスワードやパスキーなどを使い、そのアカウントを利用するために入る操作だよ。サービスは、登録された方法で確認ができたかを確かめる。ログインできたことと、その画面に書かれたプロフィールが現実の本人のものだと分かることは、同じではないんだ。","explanationTitle":"確認する目的によって、方法が違う","body2":"サービスによっては、年齢の確認や契約のため、ログインとは別の本人確認を求める場合もある。だからといって、DMで「本人確認するから身分証を送って」と言われたら応じないでね。本当に必要な手続きか、公式の案内と保護者に確認し、送る情報と送信先を慎重に確かめよう。","example":{"title":"ゲームの相手が、本人確認の係だと名乗った","paragraphs":["相手が公式らしい名前やアイコンを使っていても、それだけで運営者とは分からない。「アカウントを止める」と言われ、顔写真や身分証の写真を求められても、その場で送らないでね。","本物の手続きが必要なら、いつも使う公式アプリや確認済みの公式サイトから案内を探す。画面を大人に見せ、必要性と方法を一緒に調べよう。判断に困ったら、先へ進まなくていいんだ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["ログインと、現実の本人かの確認を分けて考える。","DMで送られてきた本人確認の要求にすぐ応じない。","身分証や顔写真が必要な手続きは、保護者と確認する。"],"reflect":"「本人確認係」という表示名なら、身分証の写真を送ってよいかな？","key":"本人確認を求められても、その場で送らず、公式の入口と保護者に確認。","imageAlt":"子どもがアカウントの鍵を確かめ、保護者とログインの仕組みを話している。","caption":"本人確認を求められても、その場で送らず、公式の入口と保護者に確認。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":2},{"label":"名前とアイコン","title":"見た目が友達でも、本人とは限らない","body":"ネットでは、表示名やアイコンを似せて、ほかの人のふりをする「なりすまし」が起きる。また、本物の友達のアカウントでも、乗っ取った別の人が操作している場合があるよ。名前や写真、前の会話があることだけで、今送ってきた人が本人だとは決められないんだ。","explanationTitle":"急なお願いは、別の方法でも確かめよう","body2":"お金を貸して、認証コードを送って、秘密の写真を見せて、といった急な要求には一度止まろう。いつもの会話の続きに見えても、その場で応じなくていい。直接会ったときや、前から知っている別の連絡手段で確かめ、困ったら信頼できる大人に相談しよう。","example":{"title":"友達から「急ぎでお金を送って」と来た","paragraphs":["普段はそんな頼み方をしない友達が、理由をあまり説明せず、すぐ送金してほしいと言っている。心配でも、まず一度止まろう。アカウントの表示だけでは、相手が今も本人か分からない。","メッセージ内に新しく書かれた電話番号ではなく、以前から知っている方法で本人に確認する。それでも分からなければ大人へ。助けたい気持ちを利用して急がせる手口があると覚えておこう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["名前やアイコンだけを、本人の証拠にしない。","急なお金や秘密の要求には、いったん止まる。","前から知っている別の方法や、大人を通して確かめる。"],"reflect":"友達の本物のアカウントから来たら、どんな要求も本人のお願いだと言えるかな？","key":"見た目だけで本人と決めず、急な要求は別の方法でも確認しよう。","imageAlt":"友達に似た二つのアイコンを前に、親子が電話など別の連絡方法で確認している。","caption":"見た目だけで本人と決めず、急な要求は別の方法でも確認しよう。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":3,"check":{"prompt":"友達のアカウントから急に送金を頼まれた。どうする？","options":["別の既知の連絡方法や大人を通して確認する","本物のアイコンならすぐ送る","前の会話が残っていれば本人だと決める"],"answer":0,"explain":"本物のアカウントでも、別の人に操作されている可能性があるよ。"}},{"label":"アカウントの境界","title":"人の利用場所へ、勝手に入らない","body":"友達のパスワードを見てしまったり、共有端末にログイン状態が残っていたりしても、その人のアカウントを自由に使ってよいわけではない。メッセージを読む、投稿する、ゲームの持ち物を動かすなどは、相手の大切な情報や信用に関わる操作だよ。触れることと、許可されていることを分けよう。","explanationTitle":"「ちょっとだけ」「冗談」でも傷つくことがある","body2":"友達の名前で投稿すれば、周りの人はその友達の発言だと思うかもしれない。頼まれても、アカウントの貸し借りがサービスのルールに合うとは限らないよ。操作を代わる必要があるときも、パスワードを教え合う方法を選ばず、保護者や先生と適切な方法を確かめよう。","example":{"title":"友達のゲームが、ログインしたままだった","paragraphs":["勝手にアイテムを使ったり、メッセージを読んだりすると、遊びのつもりでも相手を困らせる。「元に戻せばいい」ではなく、最初から中をのぞいたり変更したりしないことが大切だよ。","偶然パスワードを見てしまった場合は、友達や先生などに静かに伝え、周りへ広めないでね。相手をからかったり、証拠だと言って写真を残したりせず、見えない状態にする手助けをしよう。"],"note":"他人のID・パスワードを使った無断ログインは、不正アクセス禁止法で禁止される行為に当たる場合がある。偶然画面が見えたことと同じ扱いとは限らないけれど、勝手に中を見たり操作したりしない約束は同じだよ。"},"actionTitle":"自分の使い方で確かめよう","actions":["他人のアカウントで、勝手に読んだり操作したりしない。","パスワードやログイン状態を、貸し借りの道具にしない。","偶然見えた情報は、広めず本人や大人へ伝える。"],"reflect":"友達のロッカーが開いていても、中の持ち物を自由に使ってよいかな？","key":"人のアカウントは、その人の大切な場所。勝手に入らず、使わず、広めない。","imageAlt":"子どもと友達がそれぞれのロッカーを持ち、相手の場所を尊重して立っている。","caption":"人のアカウントは、その人の大切な場所。勝手に入らず、使わず、広めない。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":4},{"label":"回復の準備","title":"入れなくなる前に、戻す方法を確認する","body":"パスワードを忘れたり、端末をなくしたりしてログインできなくなることがある。サービスによっては、再設定用のメールアドレスや電話番号など、アカウントへ戻るための方法を登録できるよ。困る前に、どの方法を使うかを保護者と公式の設定で確認しておこう。","explanationTitle":"回復先も、大切な情報として扱おう","body2":"使えなくなった連絡先のままだと、必要な案内やコードを受け取れないことがある。機種変更などの際には、登録先が今も使えるかを家族と確かめよう。他人にすすめられた知らない連絡先へ変えたり、届いた回復用の情報を友達に預けたりしない。回復方法の悪用も防ぐ必要があるんだ。","example":{"title":"スマホを買い替えたら、確認の連絡が受け取れない","paragraphs":["古いメールアドレスにしか案内が届かず、ログインできなくなることがある。前の端末や連絡先を使わなくする前に、保護者と必要な回復方法を確認しておくと、困ったときの備えになるね。","もし入れなくなったら、公式ヘルプの手順を使う。「必ず取り戻す」と宣伝する知らない相手へ、料金やパスワードを渡さないでね。回復できる条件はサービスによって違い、絶対に戻るとは限らないよ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["公式の設定で、回復用の方法を保護者と確認する。","機種変更の前に、登録した連絡先が使えるか見る。","回復を名乗る知らない相手へ、秘密の情報を渡さない。"],"reflect":"使えないメールアドレスを回復先にしたままだと、どんなときに困りそうかな？","key":"回復方法は、困る前に公式の設定で確認。連絡先の変更時にも見直そう。","imageAlt":"親子がアカウントへ戻るための連絡先を確認し、大切な回復用カードを保管している。","caption":"回復方法は、困る前に公式の設定で確認。連絡先の変更時にも見直そう。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":5},{"label":"異変に気づく","title":"見覚えのないログインは、放っておかない","body":"身に覚えのないログインの通知、勝手な投稿、知らない購入、急にログインできないといった変化は、不正利用の手がかりになることがある。ただし、通知自体が偽物の場合もあるよ。慌ててメッセージのリンクを押さず、大人と公式の設定や案内から確認しよう。","explanationTitle":"まず安全を守り、公式の方法で対処する","body2":"本当に不審な利用があれば、パスワードの変更、知らない端末のログアウト、公式窓口への相談などが必要になる場合がある。何をどの順に行うかは、サービスや状況で違うので、一人で決めなくていい。相談のための画面や時刻は残し、秘密のコードまで人に送らないよう気を付けよう。","example":{"title":"自分が送っていないメッセージがある","paragraphs":["友達から「このお願い、本当にきみが送ったの？」と聞かれた。送った覚えがなければ、乗っ取りなどの可能性を考え、大人に見せよう。恥ずかしくても、相手を待たせず相談することが被害を減らす助けになる。","必要なら、友達に不審なメッセージへ応じないよう知らせる方法も大人と考える。慌ててアカウントを削除すると、確認が難しくなる場合もあるので、公式の案内を確かめながら進めよう。"]},"actionTitle":"自分の使い方で確かめよう","actions":["いつもと違う投稿・購入・通知に気付いたら相談する。","通知内のリンクではなく、公式の入口から確かめる。","対処は保護者と公式ヘルプを頼り、ひとりで抱えない。"],"reflect":"知らないログイン通知が来たら、何を押す前に、誰と確認する？","key":"異変を放置せず、公式の入口から大人と確認しよう。","imageAlt":"子どもが見覚えのないログイン通知を保護者に見せ、落ち着いて相談している。","caption":"異変を放置せず、公式の入口から大人と確認しよう。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":6},{"label":"認証コードの意味","title":"届いたコードは、人に渡すためのものではない","body":"認証コードは、ログインやアカウントの引き継ぎなどを確認するために届く数字などの情報だよ。友達への投票や手伝いを理由にしても、人に教えたり転送したりしない。相手がそのコードを使って、自分のアカウントに入ったり、引き継いだりする可能性があるんだ。","explanationTitle":"頼まれて届いたコードも、内容を読もう","body2":"「今から届く数字を送って」と言われて本物のサービスからコードが来ても、相手が手続きを始めただけかもしれない。自分が始めた正しい手続きの、確認済みの公式画面で使うものだと考えよう。知らないログインの承認も押さず、要求が来たら保護者に相談してね。","example":{"title":"友達から「投票に必要な数字を教えて」と来た","paragraphs":["そのあとサービスからコードが届いても、友達への投票用とは限らない。乗っ取られた友達のアカウントから、次の人をだます要求が来ることもあるよ。コードや届いたURLを、その相手へ転送しないでね。","もし渡してしまったら、「もうだめだ」と隠さず、すぐ大人に話そう。公式ヘルプでアカウントの状態や対処を確認する。失敗を責めるより、被害が広がらないよう早く助けを求めることが大切なんだ。"]},"actionTitle":"自分の使い方で確かめよう","actions":["認証コードや、回復用の秘密の情報を人に渡さない。","自分が始めていないログインや引き継ぎを承認しない。","渡してしまった場合も、すぐ保護者に相談する。"],"reflect":"本物のサービスからコードが届けば、それを求めた友達も必ず信用できるかな？","key":"認証コードは教えない・転送しない。渡してしまっても、すぐ相談。","imageAlt":"コードを求める相手へ送らず、子どもが保護者に画面を見せて相談している。","caption":"認証コードは教えない・転送しない。渡してしまっても、すぐ相談。","image":"assets/lessons/chapter05-atlas.jpg","imagePanel":7,"check":{"prompt":"友達が「投票に必要だから、届いた認証コードを教えて」と言う。どうする？","options":["友達の頼みなら教える","本物のサービスから届けば転送する","教えず、必要なら別の方法で本人や大人に確認する"],"answer":2,"explain":"認証コードがアカウントの引き継ぎなどに使われることがある。人に渡さないでね。"}}],"questions":[{"slide":0,"q":"スマホ本体とアカウントについて、正しい説明は？","options":["端末とアカウントは別で、複数端末で使う場合もある","一台の端末には一生一つしか使えない","端末を借りると自動で自分のアカウントになる"],"answer":0,"why":"端末と、サービスで誰の利用かを区別する仕組みは別だよ。","id":"chapter5-1","tag":"アカウントとは"},{"slide":0,"q":"家族のタブレットを借りて投稿したい。先にすることは？","options":["自由にどのアカウントでも使う","誰のアカウントか、操作してよい範囲を確認する","画面が開けば許可されていると考える"],"answer":1,"why":"端末を借りる許可と、各サービスで操作する許可は別だよ。","id":"chapter5-2","tag":"アカウントとは"},{"slide":1,"q":"登録と公開プロフィールについて、正しい考え方は？","options":["登録に必要な情報は、必ず全部公開する","年齢条件は好きな数字で避けてよい","利用条件と、誰に見える情報かを保護者と確認する"],"answer":2,"why":"サービスごとの利用条件を守り、登録情報と公開する情報を区別しよう。","id":"chapter5-3","tag":"登録と公開プロフィール"},{"slide":1,"q":"自己紹介に学校名や連絡先を入れる前に、どうする？","options":["公開する必要や、見える範囲を家族と確認する","友達が見つけやすければ全部入れる","表示名を変えれば何を書いてもよい"],"answer":0,"why":"便利さだけでなく、知らない人にも手がかりを渡す可能性を考えよう。","id":"chapter5-4","tag":"登録と公開プロフィール"},{"slide":2,"q":"ログインできたことから、必ず分かることは？","options":["プロフィールが現実の本人のものだと保証される","登録された認証方法で、そのアカウントを使う確認が通った","運営者も利用者も全員正直である"],"answer":1,"why":"アカウントへの認証と、表示された人物が現実の本人かは別だよ。","id":"chapter5-5","tag":"ログインと本人確認"},{"slide":2,"q":"DMで本人確認係を名乗り、身分証の写真を求められた。どうする？","options":["名前が公式らしければ送る","急がれたら一枚だけ送る","送らず、保護者と公式の手続きかを確認する"],"answer":2,"why":"身分証や顔写真を送る前に、必要性と送信先を慎重に確かめよう。","id":"chapter5-6","tag":"ログインと本人確認"},{"slide":3,"q":"友達のアカウントから急に送金を頼まれた。どうする？","options":["別の既知の連絡方法や大人を通して確認する","本物のアイコンならすぐ送る","前の会話が残っていれば本人だと決める"],"answer":0,"why":"本物のアカウントでも、別の人に操作されている可能性があるよ。","id":"chapter5-7","tag":"名前とアイコン"},{"slide":3,"q":"名前やアイコンが友達と同じなら？","options":["どんな要求にも必ず応じる","それだけで本人と決めず、急な要求は立ち止まる","認証コードだけなら教えてよい"],"answer":1,"why":"見た目のなりすましと、アカウントの乗っ取りの両方に注意しよう。","id":"chapter5-8","tag":"名前とアイコン"},{"slide":4,"q":"友達のゲームがログインしたまま。どうする？","options":["見られるので自由にアイテムを使う","戻せる範囲なら勝手に操作する","勝手に見たり操作したりせず、本人や大人に伝える"],"answer":2,"why":"操作できる状態と、許可があることは別だよ。","id":"chapter5-9","tag":"アカウントの境界"},{"slide":4,"q":"友達のパスワードが偶然見えた。どうする？","options":["広めず、本人や先生などに静かに伝える","覚えておき、あとで一度だけ使う","写真に撮ってグループへ送る"],"answer":0,"why":"秘密の情報を広めず、相手が安全に管理できるよう知らせよう。","id":"chapter5-10","tag":"アカウントの境界"},{"slide":5,"q":"回復用の連絡先を登録したら、そのあと確認はいらない？","options":["一度登録すれば、使えなくなっても大丈夫","連絡先が変わるときなどに、使える状態か保護者と確認する","友達の知らない連絡先へ変えると安全"],"answer":1,"why":"困ったときに案内やコードを受け取れるよう、事前に備えよう。","id":"chapter5-11","tag":"回復の準備"},{"slide":5,"q":"ログインできなくなったら、どうする？","options":["必ず戻せるという知らない人にパスワードを渡す","回復用コードをSNSに公開する","保護者と公式ヘルプの回復方法を確認する"],"answer":2,"why":"サービスごとの公式手順を使い、秘密の情報を知らない相手へ渡さないでね。","id":"chapter5-12","tag":"回復の準備"},{"slide":6,"q":"見覚えのないログイン通知が届いた。どうする？","options":["大人と、公式の入口から本当の通知かも含めて確認する","通知内のリンクで急いで全部入力する","通知を無視すれば必ず解決する"],"answer":0,"why":"通知自体が偽物の場合もあるので、慌てず公式の設定や案内を使おう。","id":"chapter5-13","tag":"異変に気づく"},{"slide":6,"q":"自分が送っていないメッセージに気付いた。どうする？","options":["恥ずかしいので隠す","保護者に見せ、公式の案内で対処を確認する","知らない修復係に認証コードを渡す"],"answer":1,"why":"不正利用の可能性を考え、早めに相談して被害が広がるのを防ごう。","id":"chapter5-14","tag":"異変に気づく"},{"slide":7,"q":"友達が「投票に必要だから、届いた認証コードを教えて」と言う。どうする？","options":["友達の頼みなら教える","本物のサービスから届けば転送する","教えず、必要なら別の方法で本人や大人に確認する"],"answer":2,"why":"認証コードがアカウントの引き継ぎなどに使われることがある。人に渡さないでね。","id":"chapter5-15","tag":"認証コードの意味"},{"slide":7,"q":"認証コードを相手へ渡してしまった。どうする？","options":["すぐ保護者に相談し、公式の方法で状態と対処を確認する","隠して、次の要求にも応じる","さらに別のコードを送り続ける"],"answer":0,"why":"渡してしまったあとも、早く助けを求めていい。ひとりで対応しないでね。","critical":true,"id":"chapter5-16","tag":"認証コードの意味"}],"sources":[{"title":"Google アカウント：復元オプションを設定する","url":"https://support.google.com/accounts/answer/183723?hl=ja","note":"再設定用の情報と、ログインできない場合への備え。","checked":"2026-11-17"},{"title":"Apple：Apple Accountの不正利用が疑われる場合","url":"https://support.apple.com/ja-jp/102560","note":"身に覚えのない通知や操作などの兆候と公式の対処。","checked":"2026-11-17"},{"title":"IPA：情報セキュリティ安心相談窓口の相談状況・2026年第2四半期","url":"https://www.ipa.go.jp/security/anshin/reports/2026q2outline.html","note":"知り合いの投票依頼を装い、認証情報を盗む事例。","checked":"2026-11-17"},{"title":"大阪府警：ネット投票を依頼するSNSのアカウント乗っ取りが多発中","url":"https://www.police.pref.osaka.lg.jp/seikatsu/saiba/cyber_shiryou/cybersecurity_tsushin/8/24199.html","note":"知人のアカウントでも認証コードやURLを転送せず、別の手段で確認する。","checked":"2026-11-17"},{"title":"警察庁：不正アクセス対策","url":"https://www.npa.go.jp/bureau/cyber/countermeasures/unauthorized-access.html","note":"他人のID・パスワードを用いる不正利用と、被害時の対応。","checked":"2026-11-17"},{"title":"e-Gov法令検索：不正アクセス行為の禁止等に関する法律","url":"https://laws.e-gov.go.jp/law/411AC0000000128","note":"第2条第4項の定義と第3条の禁止。偶然の閲覧と無断ログインを一律に同じ法律違反とは扱わない。","checked":"2026-11-17"}],"number":5},{"title":"パスワードと認証","description":"秘密の鍵を守り、ログインの安全を重ねよう。","lessons":[{"label":"本人を確かめる鍵","title":"パスワードは、アカウントを守る秘密","body":"パスワードは、サービスに「このアカウントを使ってよい人か」を確かめてもらうための秘密の情報だよ。名前やメールアドレスが分かっても、それだけではログインできないようにする役割がある。知られると、メッセージを読まれたり、自分のふりをして投稿されたりするおそれがある。","explanationTitle":"友達だからこそ、秘密を預けない","body2":"仲のよい友達から頼まれても、パスワードを貸す必要はない。借りた相手の端末に情報が残ったり、別の人に伝わったりすると、自分では管理しきれなくなる。家族が確認する範囲は先に話し合い、友達同士では共有しない約束にしよう。この教材にも本物のパスワードは入力しないよ。","example":{"title":"ゲームを代わりに進めてと言われたら","paragraphs":["友達から「ログインしてレベルを上げるから、パスワードを教えて」と言われた。助けてもらいたくても、アカウントごと貸すと、連絡先や購入機能まで使われる可能性がある。","「一緒に遊ぶときに教えて」と頼むなど、秘密を渡さない方法を考えよう。断りにくければ、大人と決めた約束を伝えてもいいんだ。アカウントを守ることは、そこにつながる友達の情報を守ることにもなるよ。"]},"actionTitle":"秘密を渡さない伝え方","actions":["友達とパスワードを共有しないと決める。","家族が確認する範囲と方法を話し合う。","教材やチャットの練習欄に本物の秘密を入れない。"],"reflect":"友達の手伝いを頼むとき、秘密を教える以外に何ができるかな？","key":"パスワードを知っていることは、大きな力を預かること。","imageAlt":"親子がスマホの鍵と家の鍵を見比べ、秘密を守る大切さを話している。","caption":"パスワードを知っていることは、大きな力を預かること。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":0},{"label":"長さと推測されにくさ","title":"短い合言葉より、長くて読まれにくい秘密","body":"誕生日、名前、同じ数字の並びなどは、他の人に推測されやすい。パスワードは、サービスで使える範囲で長くし、英字の大文字・小文字、数字、記号なども使って、簡単な並びを避けよう。記号を一つ足すだけで必ず強くなるわけではなく、長さと予想しにくさの両方が大切だよ。","explanationTitle":"公開した情報を、秘密に使わない","body2":"好きなチームやペットの名前をSNSに書いていれば、それを手がかりにされる可能性がある。キーボードの並びや、有名なせりふだけを使うのも避けよう。家族と信頼できる管理機能を選べば、長くランダムなものを作る助けにもなる。ここでは本物の文字列を作ったり発表したりしないよ。","example":{"title":"名前に記号を付ければ安心？","paragraphs":["名前と誕生日の最後に記号を一つ付けた。見た目は複雑でも、元の情報が知られていて、よくある付け方なら予想されることがある。「記号があるから絶対に安全」とは言えないね。","大人と一緒に、長さや使える文字の条件を確認しよう。強さを試すために、知らないサイトへ本物のパスワードを入力する必要はないよ。安全性を確かめるために、秘密そのものを外へ渡すのは避けよう。"]},"actionTitle":"強さは考え方で学ぼう","actions":["誕生日や名前をそのまま使わない。","長さを十分に取り、よくある並びを避ける。","本物の秘密を発表せず、管理方法を家族と相談する。"],"reflect":"長いパスワードでも、誰でも知る決まり文句ならどうかな？","key":"長く、推測されにくく。本物の秘密を練習に使わない。","imageAlt":"子どもとロボットが、短い鍵と長い色付き積み木の鍵を見比べている。","caption":"長く、推測されにくく。本物の秘密を練習に使わない。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":1,"check":{"prompt":"パスワードを考えるとき、大切なのは？","options":["十分に長くし、名前などの推測されやすい並びを避ける","誕生日に記号を一つ付ければ絶対に安心","短くても好きな言葉なら安全"],"answer":0,"explain":"長さと予想しにくさの両方が大切。記号が一つあるだけで安全とは言えないよ。"}},{"label":"サービスごとに分ける","title":"一つ知られても、ほかまで開かせない","body":"動画、ゲーム、メールなどで、同じパスワードを使い回さないようにしよう。一つのサービスから漏れたIDとパスワードを、別のサービスでも試されることがあるからだよ。長いパスワードでも、全サービスで同じものなら、一か所の問題が広がりやすくなる。","explanationTitle":"末尾だけ変える方法にも注意","body2":"共通の言葉にサービス名や数字を足すなど、分かりやすい規則で変えると、規則を知られたときに他の秘密も推測されるおそれがある。特にメールは、ほかのアカウントの再設定に使うこともあるので大切に守ろう。覚えきれないときは、全部同じに戻す前に家族へ相談してね。","example":{"title":"一つのゲームで情報が漏れたと聞いたら","paragraphs":["ゲームのパスワードが漏れたかもしれない。同じものをメールにも使っていたら、ゲームだけ変えて終わりにはできない。メールなども守り直す必要があるよ。","公式の案内を大人と確認して、同じものを使ったサービスを洗い出そう。漏れたか調べると称する知らないページへ、秘密を入力しないでね。ひとつ直したら終わりとせず、つながるアカウントも確認するのが大切だね。"]},"actionTitle":"鍵を分ける準備","actions":["使っているサービスの種類を、秘密を書かずに整理する。","サービスごとに違うパスワードを用意する。","漏えいが疑われたら、使い回した先も家族と確認する。"],"reflect":"全部の箱に同じ鍵を使うと、一つ失くしたときに何が起きるかな？","key":"長くても、使い回しはしない。","imageAlt":"ロボットと子どもが、三つの箱にそれぞれ形の違う鍵を用意している。","caption":"長くても、使い回しはしない。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":2},{"label":"安全な保管","title":"覚えきれないときは、保管方法を決める","body":"たくさんの秘密を、頭の中だけで覚えるのは難しいね。家族と相談して、端末の管理機能や信頼できるパスワード管理アプリを使う方法があるよ。紙に記録するなら、自宅で人目に触れない場所に置くなど、誰が見られるかも考える。スマホの背面や机に貼るのは避けよう。","explanationTitle":"保管場所を守る鍵も、大切","body2":"管理機能を開くためのパスワードや、端末のロックが弱いと、まとめて見られるおそれがある。管理アプリなら何でもよいわけではないので、提供元や復元方法も大人と確認して選ぼう。漏えいや不正利用が疑われなければ、定期変更だけを目的に変える必要はない。疑いがあれば速やかに変えよう。","example":{"title":"友達にも見えるメモに書いたら","paragraphs":["忘れないように、スマホケースの中にパスワードのメモを入れた。便利でも、スマホとメモを一緒に失くしたら、秘密まで同時に渡ってしまうかもしれない。","家族と保管場所を変えよう。管理方法の相談では、秘密そのものを友達に見せず、「どこに置くか」「失くしたらどうするか」を話すだけでも準備できるよ。スマホをなくした場合も想像して、保管方法を家族で選び直してみよう。"]},"actionTitle":"保管場所の点検","actions":["家族と、安全な管理機能や保管場所を選ぶ。","管理機能とスマホのロックも守る。","流出が疑われたときは、公式の手順で秘密を変更する。"],"reflect":"スマホと同じ場所に、解除の秘密まで置くとどうなるかな？","key":"秘密は、保管する場所と開く鍵の両方を守ろう。","imageAlt":"親子が鍵を入れる金庫と管理用ノートを前に、保管方法を相談している。","caption":"秘密は、保管する場所と開く鍵の両方を守ろう。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":3,"check":{"prompt":"パスワードを覚えきれない。どうする？","options":["スマホの背面に貼っておく","家族と信頼できる管理機能や安全な保管場所を決める","友達全員に覚えてもらう"],"answer":1,"explain":"秘密を人目にさらさず、管理機能や保管場所を家族と選ぼう。"}},{"label":"確認を重ねる","title":"二段階認証・多要素認証を知ろう","body":"パスワードに加えて、手元の端末への確認や認証アプリなどでも確かめる仕組みがある。二段階認証は確認を二つの手順に分けること、多要素認証は「知っている秘密」「持っている物」など種類の違う方法を組み合わせることだよ。名前は似ていても、厳密には同じ意味ではないんだ。","explanationTitle":"増やした確認も、だまされないように","body2":"追加の確認を使うと、パスワードだけが盗まれた場合の防御を強められる。ただし、届いたコードを渡したり、身に覚えのない確認通知を許可したりすると、突破されることがある。設定は家族と公式の案内で進め、スマホを失くしたときの予備の確認方法も準備しておこう。","example":{"title":"何もしていないのに許可の通知が来た","paragraphs":["自分はログインしていないのに、「ログインを許可しますか」と通知された。面倒だから許可するのではなく、身に覚えがないことを大人に伝えよう。","繰り返し届くときも、止めるために承認しない。公式アプリから利用状況や守り方を確かめるなど、家族と一緒に対処してね。ログインを許可する通知も、アカウントを開ける鍵の一部だと考えてね。"]},"actionTitle":"確認通知を読む習慣","actions":["追加の認証を使えるか、家族と確認する。","自分の操作で届いた確認かを確かめる。","身に覚えのない許可要求には応じず相談する。"],"reflect":"確認の数を増やしても、知らない操作を許可するとどうなるかな？","key":"確認を増やし、その確認も自分で守る。","imageAlt":"スマホの鍵と別の確認カードを使い、親子が二つの確認をしている。","caption":"確認を増やし、その確認も自分で守る。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":4},{"label":"認証コードを守る","title":"一回だけのコードも、教えない","body":"SMSやメールに届く認証コード、バックアップコードも、アカウントを使うための大切な秘密だよ。「一回限り」「短時間で無効」と言われても、その時間内に他の人が使える場合がある。友達や運営会社を名乗る相手から聞かれても、メッセージや電話で伝えないようにしよう。","explanationTitle":"入力先と目的を確かめる","body2":"自分で始めた操作のために、正規の画面へコードを入力する場面はある。一方、相手から来たリンクへ誘導されて入力すると、盗まれるおそれがあるよ。「コードを送ってくれたら助ける」と言われても、ひとりで応じない。何も操作していないのに届いたコードも、誰かに転送しないでね。","example":{"title":"友達のアカウントから頼まれても","paragraphs":["友達から「間違えて君の番号にコードを送った。教えて」と来た。本人のように見えても、そのアカウントが乗っ取られている可能性がある。コードを教える前に止まろう。","友達を疑って責める必要はない。いつもの別の連絡方法や直接の会話で確認し、届いた通知は大人に見せて相談してね。相手を信用したい気持ちと、秘密を守る行動は両立できるよ。"]},"actionTitle":"秘密を聞かれたら止まる","actions":["認証コードやバックアップコードを転送しない。","自分で始めた操作と、正規の入力画面かを確認する。","身に覚えがないときや迷ったときは、画面を大人に見せる。"],"reflect":"期限が短い秘密でも、今すぐ渡してよいとは限らないのはなぜ？","key":"認証コードもパスワードと同じように守る。","imageAlt":"子どもが知らない相手の手に確認カードを渡さず、保護者へ相談している。","caption":"認証コードもパスワードと同じように守る。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":5},{"label":"パスキーという方法","title":"文字の秘密を渡さずにログインする方法もある","body":"対応するサービスでは、パスキーという方法を使えるよ。端末の顔・指紋の認証やPINなどで操作する本人を確かめ、端末などに保管された鍵を使ってサービスへログインする。サイトへ毎回パスワードを打つ方法とは違い、作ったサービスに結びつくため、偽サイトへ秘密を渡す攻撃に強いんだ。","explanationTitle":"顔や指紋を、相手に送る操作ではない","body2":"パスキーを使うとき、顔や指紋の照合は端末側で行い、その生体情報そのものをログイン先へ送るわけではない。顔認証なら何でもパスキー、という意味でもないよ。端末を他の人に渡してロックを解除させないことや、紛失時の復元方法も大切。対応状況と設定は家族と確認しよう。","example":{"title":"指紋で入れるようになったから安心？","paragraphs":["パスキーを設定できても、スマホのロック番号を友達に教えてよいわけではない。端末を開けられる人に、アカウントの操作もできる場合があるからだよ。","また、パスキーを使っても、投稿や送金などの内容を何でも安全にしてくれるわけではない。ログインを守ることと、その後の行動を考えることは両方必要なんだ。便利な認証方法を使いながら、端末を貸す範囲も家族と話しておこう。"]},"actionTitle":"方法を選ぶときの確認","actions":["家族と公式の案内で、パスキーに対応しているか確かめる。","端末のロックを解除する秘密も守る。","スマホを失くした場合の復元方法を確認する。"],"reflect":"ログインを安全にしたら、どんな投稿をしても安全になるかな？","key":"パスキーはログインを守る助け。端末と行動も守ろう。","imageAlt":"親子がスマホと指紋を表す柔らかな鍵のモチーフを見ている。","caption":"パスキーはログインを守る助け。端末と行動も守ろう。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":6},{"label":"困ったときの回復","title":"忘れた・知られたときは、公式の方法で守り直す","body":"パスワードを忘れたら、他人のアカウントを借りず、公式の再設定や復元の案内を大人と確認しよう。登録した連絡先が使えるか、予備の確認方法があるかを普段から確かめることも大切。秘密を思い出すためといって、知らない「復旧代行」に情報を渡さないでね。","explanationTitle":"知られたかもしれないときは、早めに相談","body2":"パスワードを入力した先が怪しい、勝手な投稿があるなど、不正利用が疑われたら、気づいた時点で大人へ。正規の画面から変更し、登録された連絡先やログイン状況も確認する。使い回した別サービスも見直そう。被害の種類によっては運営会社や警察への相談も必要になるよ。","example":{"title":"間違えてパスワードを送ったら","paragraphs":["友達だと思った相手に秘密を送ったあとで、おかしいと気づいた。「怒られるから」と待つほど、相手が操作できる時間を長くしてしまうことがある。","追加の秘密やお金を送らず、すぐ大人に伝えよう。相談したこと自体を罰するのではなく、安全を守る作業を先に行うのが、この教材の約束だよ。何を送ったかと、いつ気づいたかも伝えると、確認の手がかりになるよ。"]},"actionTitle":"困ったときの順番","actions":["怪しい操作を止めて、信頼できる大人に相談する。","正規の再設定・復元方法で、アカウントを守り直す。","使い回しや登録情報、予備の確認方法も見直す。"],"reflect":"秘密を渡してしまったあとでも、すぐ相談する意味は何だろう？","key":"失敗したあとでも相談していい。公式の方法で守り直そう。","imageAlt":"なくした鍵を前に、親子がロボットの相談窓口で再発行の方法を聞いている。","caption":"失敗したあとでも相談していい。公式の方法で守り直そう。","image":"assets/lessons/chapter06-atlas.jpg","imagePanel":7,"check":{"prompt":"怪しい相手にパスワードを送ってしまった。どうする？","options":["追加の秘密やお金を送らず、すぐ大人に相談して正規の方法で守り直す","怒られるのが嫌なので隠す","返してもらうために認証コードも送る"],"answer":0,"explain":"失敗したあとでも相談していい。被害を広げる前に、大人と正規の手順で対処しよう。"}}],"questions":[{"slide":0,"tag":"秘密を守る","q":"友達が「代わりにゲームを進めるからパスワードを教えて」と言う。どうする？","options":["親友なら必ず教える","共有せず、一緒に遊ぶなど別の方法を考える","使い終えたら忘れる約束だけで教える"],"answer":1,"why":"パスワードを貸すと、アカウントの操作まで任せることになるよ。秘密を渡さない方法を考えよう。","id":"chapter6-01"},{"slide":0,"tag":"教材での練習","q":"この教材でパスワードの守り方を学ぶとき、必要なのは？","options":["本物のパスワードを発表する","友達のパスワードを見せてもらう","秘密そのものを入力せず、管理方法を考える"],"answer":2,"why":"本物の秘密を教材やチャットに入力する必要はないよ。","id":"chapter6-02"},{"slide":1,"tag":"推測されにくさ","q":"パスワードを考えるとき、大切なのは？","options":["十分に長くし、名前などの推測されやすい並びを避ける","誕生日に記号を一つ付ければ絶対に安心","短くても好きな言葉なら安全"],"answer":0,"why":"長さと予想しにくさの両方が大切。記号が一つあるだけで安全とは言えないよ。","id":"chapter6-03"},{"slide":1,"tag":"公開情報との関係","q":"SNSで公開したペットの名前を、パスワードの中心に使うのは？","options":["公開していても秘密なので必ず安全","他の人に予想される手がかりになるので避ける","同じ写真を添えれば安全になる"],"answer":1,"why":"自分について公開した情報は、他人も知ることができるよ。","id":"chapter6-04"},{"slide":2,"tag":"使い回し","q":"とても長いパスワードなら、全部のサービスで同じにしてよい？","options":["長いなら何に使っても安全","毎日ログインすれば大丈夫","一か所から漏れたときに広がるので使い回さない"],"answer":2,"why":"強いパスワードでも、漏れたものを別のサービスで試されるおそれがあるよ。","id":"chapter6-05"},{"slide":2,"tag":"漏えいの広がり","q":"ゲームで使っていた秘密が漏れたかもしれない。同じものをメールにも使っている。どうする？","options":["ゲームだけでなく、メールなども大人と守り直す","ゲームだけ変えれば他は絶対に安心","メールの表示名だけ変える"],"answer":0,"why":"同じパスワードを使った先も確認しよう。メールは他のアカウントの復元にも関係することがあるよ。","id":"chapter6-06"},{"slide":3,"tag":"秘密の保管","q":"パスワードを覚えきれない。どうする？","options":["スマホの背面に貼っておく","家族と信頼できる管理機能や安全な保管場所を決める","友達全員に覚えてもらう"],"answer":1,"why":"秘密を人目にさらさず、管理機能や保管場所を家族と選ぼう。","id":"chapter6-07"},{"slide":3,"tag":"変更する場面","q":"パスワードが知られたかもしれない。正しい対応は？","options":["次の定期変更の日まで必ず待つ","誰にも相談せず同じものを使う","すぐ大人に相談し、正規の方法で変更する"],"answer":2,"why":"漏えいや不正利用が疑われたら速やかに対処しよう。単に日数がたったかより、状況が大切だよ。","id":"chapter6-08"},{"slide":4,"tag":"追加の確認","q":"自分はログインしていないのに許可を求める通知が来た。どうする？","options":["承認せず、信頼できる大人と確認する","通知を消すために許可する","何回も来るなら必ず許可する"],"answer":0,"why":"身に覚えのない操作を承認しないでね。繰り返されても相談して確認しよう。","id":"chapter6-09"},{"slide":4,"tag":"認証の仕組み","q":"多要素認証の説明として正しいのは？","options":["同じパスワードを二回入力することだけ","秘密や持っている端末など、種類の違う確認を組み合わせること","友達二人に秘密を教えること"],"answer":1,"why":"違う種類の確認を重ねることで、守りを強められるよ。","id":"chapter6-10"},{"slide":5,"tag":"認証コード","q":"友達風のメッセージで「届いた認証コードを教えて」と言われた。どうする？","options":["期限が短いので教える","友達のアイコンなら必ず本人なので送る","送らず、別の方法で本人確認し、大人に相談する"],"answer":2,"why":"コードも大切な秘密。友達のアカウントが乗っ取られている可能性もあるよ。","id":"chapter6-11"},{"slide":5,"tag":"コードの入力先","q":"認証コードを入力する前に確認することは？","options":["自分で始めた操作か、正規の画面か","コードの数字が好きな数字か","相手が急いでいるかだけ"],"answer":0,"why":"正規の操作のための入力と、相手へ秘密を渡すことは別だよ。","id":"chapter6-12"},{"slide":6,"tag":"パスキー","q":"パスキーの説明として正しいのは？","options":["指紋の写真を毎回相手に送る方法","端末の確認と鍵を使い、対応サービスへログインする方法","どんな投稿でも自動で安全にする方法"],"answer":1,"why":"パスキーでは顔や指紋の照合などで端末上の本人を確かめ、サービスに結びつく鍵を使うよ。","id":"chapter6-13"},{"slide":6,"tag":"端末も守る","q":"パスキーを使い始めたら、スマホのロック番号は友達に教えてよい？","options":["パスキーなら誰に教えてもよい","顔認証があるので番号は公開してよい","端末を開けられると操作される場合があるので教えない"],"answer":2,"why":"アカウントの鍵を使う端末も大切に守ろう。","id":"chapter6-14"},{"slide":7,"tag":"重要：守り直す","q":"怪しい相手にパスワードを送ってしまった。どうする？","options":["追加の秘密やお金を送らず、すぐ大人に相談して正規の方法で守り直す","怒られるのが嫌なので隠す","返してもらうために認証コードも送る"],"answer":0,"why":"失敗したあとでも相談していい。被害を広げる前に、大人と正規の手順で対処しよう。","critical":true,"id":"chapter6-15"},{"slide":7,"tag":"復元の準備","q":"スマホを失くしたときに備えて、普段からすることは？","options":["知らない復旧代行へ秘密を預ける","登録した連絡先と予備の確認方法を家族と確かめる","全部のサービスを友達のアカウントで使う"],"answer":1,"why":"公式の復元に使える連絡先や予備の方法を準備しておこう。","id":"chapter6-16"}],"sources":[{"title":"IPA：不正ログイン対策特集","url":"https://www.ipa.go.jp/security/anshin/measures/account_security.html","note":"長く推測されにくいパスワード、使い回し防止、多要素認証。","checked":"2026-11-17"},{"title":"Google：パスキーでログインする","url":"https://support.google.com/accounts/answer/13548313?hl=ja","note":"パスキーの役割、端末ロック、生体情報の扱い。","checked":"2026-11-17"},{"title":"Google：2段階認証プロセスを有効にする","url":"https://support.google.com/accounts/answer/185839?hl=ja","note":"追加の確認手段、身に覚えのないログイン要求の拒否。","checked":"2026-11-17"},{"title":"Google：アカウントにアクセスできなくなるのを防ぐ","url":"https://support.google.com/accounts/answer/7684753?hl=ja","note":"再設定用情報と予備の確認方法。","checked":"2026-11-17"},{"title":"NCO：インターネットの安全・安心ハンドブック 第5章","url":"https://security-portal.cyber.go.jp/guidance/pdf/handbook/handbook-05.pdf","note":"認証の違い、パスワードの保管、流出時の速やかな変更。","checked":"2026-11-17"}],"number":6},{"title":"端末とアプリの安全","description":"ロック・更新・権限を知り、スマホを手入れしよう。","lessons":[{"label":"端末を開く鍵","title":"画面ロックで、手元の情報を守る","body":"スマホの中には、家族や友達との連絡、写真、ログインしたアプリなどが入っている。置き忘れたり、誰かに拾われたりしても、すぐ中を見られないように画面ロックを使おう。PINやパスワードなどの方式を家族と選び、名前や誕生日、単純な並びなど、予想されやすいものを避けよう。","explanationTitle":"閉じる習慣と、表示する内容もセット","body2":"使い終えたらロックし、自動でロックされるまでの時間も家族と確認しよう。ロック画面に通知の本文が見える設定だと、開かなくても連絡内容を読まれる場合がある。画面ロックはすべての危険を防ぐ魔法ではないけれど、手元の機器を守る大切な入口になるよ。秘密を横から見られないようにも気をつけてね。","example":{"title":"机にスマホを置いて席を離れるとき","paragraphs":["学校の外で友達と集まっていて、飲み物を取りに席を立つ。ほんの少しでも、ロックせず置いたままなら、ほかの人が画面を開けるかもしれないね。","しまう前にロックし、持ち物として自分で管理しよう。通知に友達の相談が表示されないかも、家族と確認すると、自分以外の人の情報も守れるよ。自分の相談の内容が表示されたらどう感じるかも、考えてみよう。"]},"actionTitle":"手元の守りを確認","actions":["画面ロックと自動ロックを家族と設定する。","ロック画面に表示する通知の範囲を見直す。","番号を入力するときは、のぞき見にも注意する。"],"reflect":"ロックしていても、通知の本文が見えたら何が伝わるかな？","key":"使い終えたらロック。通知の見え方も確かめよう。","imageAlt":"親子がスマホの画面ロックを確認し、子どもが端末をしまっている。","caption":"使い終えたらロック。通知の見え方も確かめよう。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":0},{"label":"更新は安全の手入れ","title":"OSとアプリを、新しい状態に保つ","body":"スマホの基本の仕組みを動かすソフトがOS。アプリと同じように、見つかった不具合や安全上の弱点を直す更新が届くことがある。見た目が変わるだけの作業ではないよ。設定や公式ストアから更新を確かめ、家族と決めた方法で適用しよう。知らない広告の「更新」ボタンを押す必要はないんだ。","explanationTitle":"更新が届く期間にも、終わりがある","body2":"端末やOSには、修正の提供が続く期間がある。動いているからといって、安全の手入れがずっと続くとは限らない。更新に必要な空き容量や充電、通信環境も確認し、提供が終わる時期は家族と把握しておこう。更新の通知が分からないときは、勝手に消して終わりにせず相談してね。","example":{"title":"広告が「今すぐ更新」と言ったら","paragraphs":["動画の途中で、見慣れないページが「スマホの更新が必要」と表示した。言われるままにアプリを入れず、いったんそのページの操作を止めよう。","本当に更新があるかは、端末の設定や公式ストアを家族と開いて確かめる。急がせる広告に判断を任せず、いつもの入口から確認することが大切だよ。見慣れた入口から確かめれば、広告の相手に秘密を渡さずにすむね。"]},"actionTitle":"安全な更新の習慣","actions":["OSとアプリの更新方法を家族と確認する。","充電や空き容量など、公式の条件を確かめる。","端末の更新提供期間を家族と調べておく。"],"reflect":"動くスマホと、安全の修正が届くスマホは、同じ意味かな？","key":"更新は安全の手入れ。設定や公式ストアから確認する。","imageAlt":"ロボットの整備士と親子が、スマホを手入れして新しくしている。","caption":"更新は安全の手入れ。設定や公式ストアから確認する。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":1,"check":{"prompt":"更新の確認に使う入口は？","options":["知らない広告の更新ボタン","端末の設定や公式ストア","急に届いたDMのファイル"],"answer":1,"explain":"更新は、端末の設定や公式ストアなどの正規の方法で確認しよう。"}},{"label":"入れる前に確認","title":"アプリは、入手先と中身を確かめる","body":"アプリは、家族が認めた公式ストアなどの信頼できる入口から選ぼう。似た名前やアイコンの別アプリもあるので、提供元、説明、対象年齢、料金やアプリ内購入の有無などを見る。レビューの星が多いだけで、必ず自分に合い安全だと決めることはできないよ。","explanationTitle":"審査があっても、確認は必要","body2":"公式ストアにも審査などの仕組みがあるけれど、すべてのアプリや使い方の安全が保証されるわけではない。必要とする情報や広告の有無、利用条件にも目を向けよう。友達が入れていることも、家族の許可や確認の代わりにはならない。入れる前に相談できると、あとから困る場面を減らせるよ。","example":{"title":"人気ゲームにそっくりなものを見つけた","paragraphs":["好きなゲームに似たアイコンがあり、無料と書かれている。名前だけで選ばず、提供元や説明を家族と確認しよう。本物に見せかけた別のアプリかもしれない。","無料でも、広告やアプリ内購入があったり、情報を扱ったりすることがある。使いたい理由を説明して、料金と必要な権限も一緒に確かめてから決めよう。家族に使いたい理由を伝えると、必要な機能を一緒に探しやすくなるよ。"]},"actionTitle":"入れる前の三つの確認","actions":["提供元と、家族が認めた入手先かを確かめる。","年齢条件・料金・アプリ内購入の有無を確認する。","説明と必要な権限を家族に見せて相談する。"],"reflect":"無料で星が多いアプリなら、何も確認せず入れてよいかな？","key":"人気や無料の表示だけで決めず、入れる前に確認する。","imageAlt":"公式のアプリストアを開いた親子が、提供元と説明を落ち着いて見ている。","caption":"人気や無料の表示だけで決めず、入れる前に確認する。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":2},{"label":"アプリへの許可","title":"カメラや位置情報を、何に使うの？","body":"アプリがカメラ、マイク、写真、連絡先、位置情報などを使うには、許可を求めることがある。この許可を権限というよ。地図で現在地を調べるなど理由が分かる場合もあるけれど、何でも許可してよいわけではない。今使いたい機能に本当に必要かを考えよう。","explanationTitle":"使う範囲は、小さくできる場合がある","body2":"端末やアプリによって、「使っている間だけ」「選んだ写真だけ」などを選べることがある。必要な範囲に絞り、理由が分からなければ止まって家族に聞こう。許可しないと一部の機能が使えない場合もあるけれど、困るからと全部許可する前に相談してね。あとから設定で見直せるものもあるよ。","example":{"title":"ライトのアプリが連絡先を求めたら","paragraphs":["部屋を照らすために使うアプリなのに、友達の連絡先への許可を求められた。何のために必要なのか、説明を見ても分からないなら、そのまま許可しないでね。","自分の連絡先一覧には、友達や家族の情報もある。自分の都合だけで渡してよいものではないと考え、大人と確認して別の方法を選んでもいいんだ。分からない許可で立ち止まるのは、アプリを安全に選ぶための行動だよ。"]},"actionTitle":"許可する前の一呼吸","actions":["何の機能に必要な権限か、説明を読む。","必要なときだけ・必要な範囲だけの許可を選ぶ。","理由が分からなければ許可せず、大人に相談する。"],"reflect":"写真を一枚送りたいとき、全写真を見せる許可が必要かな？","key":"許可は「全部」でなく、目的に合う範囲を考える。","imageAlt":"親子がライトのそばで、カメラ・マイク・位置のカードを選び、許可の意味を考えている。","caption":"許可は「全部」でなく、目的に合う範囲を考える。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":3,"check":{"prompt":"ライトのアプリが連絡先への許可を求めた。理由が分からない。どうする？","options":["先に全部許可する","友達の連絡先なら自分は関係ない","許可を止め、必要な理由を大人と確認する"],"answer":2,"explain":"自分だけでなく、友達や家族の情報にも関係する許可だよ。"}},{"label":"別の入口へ誘われたら","title":"知らないファイルや設定を、入れない","body":"DMやWebページから「ここだけのアプリを入れて」と、ファイルや設定の追加を求められることがある。家族が認めたストア以外からの導入や、安全機能を切る操作は、自分だけで進めないでね。ゲームの特典や、普通は有料のものを無料にする話でも、先に安全を確かめよう。","explanationTitle":"便利そうでも、できることが変わる","body2":"見慣れない設定やアプリによって、端末の情報に触れたり、通信の設定が変わったりする場合がある。すべてのファイルが危険とは限らないけれど、内容が分からないものを試して確かめる必要はない。「先生や会社から」と言われても、いつもの連絡先へ別に確認し、保護者と一緒に判断しよう。","example":{"title":"無料の特典をもらえると言われたら","paragraphs":["知らない人が「このファイルを入れれば、ゲームで特別なアイテムを使える」と送ってきた。公式ストアの外へ誘い、安全機能を切るよう求めるなら、操作を止めよう。","友達からの転送でも、友達が内容を確認したとは限らない。ファイルを開かず、何を求められたかを大人に見せて相談してね。入れてしまった場合も、追加の操作を続けず、早く大人へ相談しよう。"]},"actionTitle":"試す前に止まる","actions":["知らない配布ファイルや設定を入れない。","安全機能や家族の制限を、指示されても切らない。","必要と言われた場合も、別の公式連絡先で大人と確認する。"],"reflect":"便利になると言われても、安全機能を切る前にできることは？","key":"内容の分からない導入や、安全機能を切る操作は止めて相談。","imageAlt":"子どもが見知らぬ配布用の箱を開けず、保護者に見せている。","caption":"内容の分からない導入や、安全機能を切る操作は止めて相談。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":4},{"label":"紛失したとき","title":"なくしたら、ひとりで取り戻そうとしない","body":"スマホをなくしたら、最後に使った場所と時刻を思い出し、すぐ家族へ伝えよう。遠隔で探したりロックしたりする機能が使える場合もあるけれど、前もっての設定や端末の状態など条件がある。場所が表示されても、必ず正確な場所や持っている人が分かるわけではないんだ。","explanationTitle":"端末より先に、自分の安全を守る","body2":"知らない場所へひとりで取りに行ったり、拾ったという相手に住所やお金を送ったりしない。家族と公式の方法で端末や回線を守り、必要に応じて施設や警察へ届け出よう。データ消去など戻せない操作は、なくなった情報や復元の可否も考え、大人と決める。普段の準備も大切だよ。","example":{"title":"公園から帰ったらスマホがない","paragraphs":["なくしたのが恥ずかしくても、黙って探し続けるより早く伝えよう。「何時ごろ、どこで使った」と分かれば、大人も問い合わせや安全対策を始めやすくなる。","探す機能で遠くの場所が表示されても、ひとりでは向かわない。端末を守ることと、自分が危ない目に遭わないことを一緒に考えてね。画面の鍵や予備の準備も、なくす前に家族と確かめておこう。"]},"actionTitle":"紛失に備えて決める","actions":["探す・ロックする機能の条件を家族と確認する。","なくしたら連絡する相手と方法を決める。","表示場所へひとりで行かず、大人と対応する。"],"reflect":"探す画面に場所が出たら、ひとりで取りに行ってもよいかな？","key":"なくしたら早く相談。端末を探す前にも、自分の安全を守る。","imageAlt":"机に置き忘れたスマホを思い出した子どもが、家族に相談している。","caption":"なくしたら早く相談。端末を探す前にも、自分の安全を守る。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":5},{"label":"大切なデータの予備","title":"バックアップは、戻せる準備まで考える","body":"故障、紛失、操作の間違いなどで、写真や設定が使えなくなることがある。大切なデータの予備を別の場所にも用意することを、バックアップというよ。保存先や対象を家族と選び、どのデータが保存され、いつの時点に戻せるのかを確認しよう。画面にマークがあるだけで全部保存されたとは限らない。","explanationTitle":"同期と予備は、いつも同じではない","body2":"同じデータを複数の端末でそろえる同期では、一か所で消すと別の場所でも消える場合がある。サービスによっては復元できる期間や対象が決まっている。バックアップ先に写真や個人情報が増えることも考え、そこのアカウントも守ろう。容量、料金、通信量と、実際に戻す方法を大人と確認してね。","example":{"title":"写真が消えてから慌てないために","paragraphs":["旅行の写真をたくさん撮った。端末にしか残っていないまま壊れたら、取り出せなくなることがある。家族と、必要な写真の予備が作られているか確認しよう。","ただし、知らない無料の保存アプリへ全部送るのは別の危険につながる。保存先を選び、不要な情報を増やさず、戻す手順まで確かめておくと安心だね。写真に写っている人の情報も含めて、保存する範囲を考えよう。"]},"actionTitle":"予備の点検","actions":["大切なデータの保存先と対象を家族と確認する。","同期で消え方がどう変わるか、公式の説明を読む。","復元できる範囲と方法、容量や料金を確かめる。"],"reflect":"別の画面に同じ写真が見えたら、消しても必ず残るかな？","key":"予備は、保存された内容と戻す方法まで確かめる。","imageAlt":"親子が大切な写真の予備を、別の安全な箱へ整理して保存している。","caption":"予備は、保存された内容と戻す方法まで確かめる。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":6},{"label":"おかしいと感じたら","title":"設定をいじり続ける前に、状況を伝える","body":"勝手に知らない広告が出る、見覚えのないアプリがあるなど、気になる変化があれば大人に伝えよう。ただし、動作が遅い、電池が減るというだけで、ウイルス感染と決めつけることもできない。いつから、何をしたあと、どんな表示になったかが、確認の手がかりになるよ。","explanationTitle":"焦って直す操作が、危険を増やすこともある","body2":"「修理のため」と表示された番号へ電話したり、知らないアプリを追加したり、認証コードを渡したりしない。怪しい画面の指示は止め、家族と公式の設定や相談窓口で確認しよう。記録を残すための撮影は、秘密や個人情報を外へ広めないよう注意する。自分だけで初期化などを急がなくていいんだ。","example":{"title":"よく分からないアプリを入れたあとで","paragraphs":["友達から来たファイルを入れたあと、見慣れない画面が出た。約束を破ったとしても、隠さず大人へ伝えよう。どの操作をしたか分かるほうが、対処を考えやすいよ。","追加の操作や支払いをせず、端末と状況を見せよう。安全を守ってから、次にどうすれば避けられるかを家族で振り返ればいいんだ。直すためと称する相手に、認証コードやパスワードは送らないでね。"]},"actionTitle":"困ったときの伝え方","actions":["怪しい画面の指示や、追加の導入を止める。","時刻・操作・表示を、信頼できる大人に伝える。","公式の確認や相談で、大人と安全を取り戻す。"],"reflect":"原因が分からないとき、何を伝えると大人が確かめやすいかな？","key":"おかしいと感じたら止まり、状況を見せて相談する。","imageAlt":"子どもが危険そうなスマホ画面を操作せず、親子で落ち着いて確認している。","caption":"おかしいと感じたら止まり、状況を見せて相談する。","image":"assets/lessons/chapter07-atlas.jpg","imagePanel":7,"check":{"prompt":"知らないアプリを入れたあと、おかしな画面が出た。どうする？","options":["怒られるのが嫌なので隠す","追加の操作や支払いを止め、すぐ大人に状況を見せる","画面に出た番号へ電話して認証コードを伝える"],"answer":1,"explain":"約束を破ったあとでも相談していい。ひとりで直そうとせず、安全を優先しよう。"}}],"questions":[{"slide":0,"tag":"画面ロック","q":"席を離れるとき、スマホをどうする？","options":["開いたまま置けばすぐ使えてよい","短時間なら誰も触らないと信じる","ロックして、持ち物として管理する"],"answer":2,"why":"短い間でも、使い終えたらロックする習慣をつけよう。","id":"chapter7-01"},{"slide":0,"tag":"通知の見え方","q":"ロック画面に友達の相談の本文が表示される。どうするとよい？","options":["家族と、通知内容を表示する範囲を確認する","ロックしているので誰にも読めないと決める","友達に相談を送るなと怒る"],"answer":0,"why":"ロックを開かなくても読める通知があるよ。表示の範囲を見直そう。","id":"chapter7-02"},{"slide":1,"tag":"更新","q":"更新の確認に使う入口は？","options":["知らない広告の更新ボタン","端末の設定や公式ストア","急に届いたDMのファイル"],"answer":1,"why":"更新は、端末の設定や公式ストアなどの正規の方法で確認しよう。","id":"chapter7-03"},{"slide":1,"tag":"修正が届く期間","q":"スマホが動いていれば、安全の更新もずっと届く？","options":["動いている限り必ず届く","充電すれば提供期間が延びる","提供期間に終わりがあるので家族と確かめる"],"answer":2,"why":"動作することと、安全の修正が届くことは別だよ。","id":"chapter7-04"},{"slide":2,"tag":"アプリ選び","q":"人気で無料のアプリ。入れる前にどうする？","options":["提供元・年齢条件・料金・権限を家族と確認する","星の数だけで決める","友達が使っていれば何も見なくてよい"],"answer":0,"why":"無料や人気だけで安全は決まらないよ。内容と条件を確かめよう。","id":"chapter7-05"},{"slide":2,"tag":"公式ストア","q":"公式ストアにあるアプリについて正しい考え方は？","options":["どんな使い方でも絶対に安全","審査などはあるが、自分でも説明や権限を確認する","無料のものはすべて情報を扱わない"],"answer":1,"why":"公式の入口を使うことに加え、アプリ自体の説明や条件も確かめよう。","id":"chapter7-06"},{"slide":3,"tag":"権限の意味","q":"ライトのアプリが連絡先への許可を求めた。理由が分からない。どうする？","options":["先に全部許可する","友達の連絡先なら自分は関係ない","許可を止め、必要な理由を大人と確認する"],"answer":2,"why":"自分だけでなく、友達や家族の情報にも関係する許可だよ。","id":"chapter7-07"},{"slide":3,"tag":"許可する範囲","q":"選んだ写真だけの許可で目的を果たせるなら？","options":["必要な範囲に絞る方法を家族と選ぶ","必ず全写真への許可を選ぶ","許可の範囲は何も変わらない"],"answer":0,"why":"端末やアプリに応じて、目的に合う小さな範囲を選ぼう。","id":"chapter7-08"},{"slide":4,"tag":"知らない導入","q":"DMで「安全機能を切って、このファイルを入れて」と言われた。どうする？","options":["特典があるならすぐ従う","操作を止め、家族と別の公式連絡先で確認する","友達へ転送して先に試してもらう"],"answer":1,"why":"分からない導入や、安全機能を切る指示は自分だけで進めないでね。","id":"chapter7-09"},{"slide":4,"tag":"転送された情報","q":"友達が転送したアプリのファイルなら？","options":["転送した人が友達なので必ず安全","一回開けば安全かすぐ分かる","友達も内容を確認していないかもしれないので大人と確認する"],"answer":2,"why":"知り合いから来たことだけでは、安全だと判断できないよ。","id":"chapter7-10"},{"slide":5,"tag":"紛失","q":"探す機能で、知らない場所が表示された。どうする？","options":["ひとりで行かず、家族と対応する","急いで一人で取りに行く","拾った相手へ住所とお金を送る"],"answer":0,"why":"場所の表示は正確とは限らないし、取り戻すときの危険もある。自分の安全を優先しよう。","id":"chapter7-11"},{"slide":5,"tag":"早めの相談","q":"スマホをなくしたとき、役に立つ伝え方は？","options":["怒られないように数日隠す","最後に使った場所や時刻を、すぐ家族に伝える","友達全員にロック番号を伝えて探してもらう"],"answer":1,"why":"早く状況を伝えると、大人も問い合わせや安全対策を始めやすくなるよ。","id":"chapter7-12"},{"slide":6,"tag":"バックアップ","q":"バックアップを用意するときに確かめることは？","options":["保存マークがあれば内容は見なくてよい","何でも知らない無料アプリへ送る","保存対象・保存先・戻す方法などを家族と確認する"],"answer":2,"why":"予備があるだけでなく、何をどこまで戻せるかを確かめよう。","id":"chapter7-13"},{"slide":6,"tag":"同期と削除","q":"同じ写真が別の端末にも見える。片方で消しても必ず残る？","options":["同期の仕組みで一緒に消えることもあるので、先に確認する","別の画面に見えれば絶対に残る","写真の色を変えれば必ず復元できる"],"answer":0,"why":"同期と、削除から戻せる予備は同じとは限らないよ。","id":"chapter7-14"},{"slide":7,"tag":"重要：端末の異変","q":"知らないアプリを入れたあと、おかしな画面が出た。どうする？","options":["怒られるのが嫌なので隠す","追加の操作や支払いを止め、すぐ大人に状況を見せる","画面に出た番号へ電話して認証コードを伝える"],"answer":1,"why":"約束を破ったあとでも相談していい。ひとりで直そうとせず、安全を優先しよう。","critical":true,"id":"chapter7-15"},{"slide":7,"tag":"原因を決めつけない","q":"電池が急に減った。それだけでウイルス感染と断定してよい？","options":["必ず感染しているので捨てる","広告の修理アプリを必ず入れる","断定せず、いつから何が変わったか大人と確認する"],"answer":2,"why":"同じ症状でも原因はいろいろ。変化や操作を伝えて確認しよう。","id":"chapter7-16"}],"sources":[{"title":"IPA：日常における情報セキュリティ対策","url":"https://www.ipa.go.jp/security/anshin/measures/everyday.html","note":"更新、信頼できる入手先、バックアップなどの基本対策。","checked":"2026-11-17"},{"title":"IPA：アプリのアクセス権限を確認しましょう","url":"https://www.ipa.go.jp/security/anshin/attention/2021/mgdayori20210914.html","note":"権限の意味と、安易な許可をしないこと。","checked":"2026-11-17"},{"title":"Google：紛失したAndroidデバイスの位置の特定、保護、データ消去","url":"https://support.google.com/android/answer/6160491?hl=ja","note":"遠隔の保護機能と利用条件。","checked":"2026-11-17"},{"title":"Google：Androidデバイスのデータをバックアップ、復元する","url":"https://support.google.com/android/answer/2819582?hl=ja","note":"保存対象と復元の条件。","checked":"2026-11-17"},{"title":"Google：アカウントのセキュリティを強化する","url":"https://support.google.com/accounts/answer/46526?hl=ja","note":"画面ロックとアカウントの基本対策。","checked":"2026-11-17"}],"number":7},{"title":"詐欺とフィッシング","description":"急がせる連絡に立ち止まり、正規の入口で確かめよう。","lessons":[{"label":"だます仕組みを知る","title":"急がせる通知には、ひと呼吸おく","body":"本物の会社やサービスのふりをして、偽サイトへ誘い、パスワードやお金に関する情報などを盗む手口をフィッシングというよ。メール、SMS、SNSのDM、広告など、いろいろな入口がある。「今すぐ」「今日中に停止」などと急がせて、落ち着いて確認する時間を奪おうとすることがあるんだ。","explanationTitle":"見た目だけで、すべて見抜かなくていい","body2":"ロゴや名前、日本語の文章が自然でも、本物とは限らない。送信元の表示が本物に見えることもあるよ。すべての偽物を自分だけで見抜くより、届いたリンクから手続きせず、いつもの公式アプリや確認済みの入口へ戻る習慣をつけよう。不安なときは、その通知を大人と一緒に確認してね。","example":{"title":"アカウントが今日で消えると言われたら","paragraphs":["ゲーム会社らしい名前で「すぐログインしないとアカウント停止」と来た。大切なアカウントだからこそ焦るけれど、そのリンクを押す前に一度止まろう。","いつものアプリを自分で開き、同じ案内があるかを家族と確認する。通知の中にある電話番号や返信先だけを、確認先にしないことも大切だよ。自分だけで解決する約束をせず、相談できる時間を取ろう。"]},"actionTitle":"急がされても自分の順番で","actions":["「急いで」「秘密で」と言われたら一度止まる。","届いたリンクからではなく、確認済みの入口を開く。","名前やロゴだけで本物と決めず、大人に相談する。"],"reflect":"なくなったら困るものほど、なぜ焦って操作しやすいのかな？","key":"見抜く力だけに頼らず、いつもの入口へ戻って確認する。","imageAlt":"急な通知が出たスマホを前に、親子が落ち着いてひと呼吸おいている。","caption":"見抜く力だけに頼らず、いつもの入口へ戻って確認する。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":0},{"label":"宅配・未払いの通知","title":"心当たりがあっても、リンクから急がない","body":"荷物の不在通知や、通信料金の未払いを装うメッセージはよくある手口だよ。実際に荷物を待っている日に届くと、本物だと思いやすいね。心当たりがあるかだけで決めず、配送会社や契約サービスの公式アプリなど、家族が確認した入口から状況を確かめよう。","explanationTitle":"確認のために、余計な情報を渡さない","body2":"荷物の確認のはずなのに、パスワード、カード情報、認証コードやアプリの導入を求められたら、進めず大人へ。サイトの見た目が本物そっくりでも、入力した情報を盗む画面かもしれない。子ども自身の契約でない支払いの話は、自分で解決しようとせず、契約している保護者に見せよう。","example":{"title":"注文した覚えのある日にSMSが来た","paragraphs":["家族が注文した物が届く予定の日に、不在通知のSMSが届いた。たまたま予定と重なった可能性もあるので、そのままリンクから住所などを入力しないでね。","家族に荷物の状況を聞き、注文履歴や公式の追跡方法で確認しよう。「荷物を受け取るため」と言われても、知らないアプリを入れる必要はないよ。本物かどうか分かるまで、追加の情報は渡さずに待っていいんだ。"]},"actionTitle":"正規の確認先へ戻る","actions":["宅配や料金の通知は、家族に心当たりを確認する。","公式アプリや確認済みの注文履歴などを使う。","秘密や支払い、アプリの導入を急に求められたら止める。"],"reflect":"荷物を待っている日なら、届いた通知は必ず本物かな？","key":"心当たりがあることと、本物であることは別。","imageAlt":"親子が宅配を装うスマホ通知を止め、正規の配送確認と見比べている。","caption":"心当たりがあることと、本物であることは別。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":1,"check":{"prompt":"荷物を待っている日に不在通知のSMSが来た。どうする？","options":["予定と合うので、そのリンクでカード情報を入れる","家族と注文履歴や公式の配送確認を使う","荷物確認用と書かれたアプリをすぐ入れる"],"answer":1,"explain":"心当たりがあっても、それだけで本物とは言えないよ。"}},{"label":"うまい話の裏側","title":"無料・当選・返金でも、先に相談","body":"「最新スマホが当たった」「無料のアイテムを配る」など、うれしい話で誘い、登録料や送料を払わせたり、住所やカード情報を集めたりする場合がある。お金を受け取るはずなのに、先に支払いを求められる話にも注意しよう。魅力を感じても、その場で決めなくていいんだ。","explanationTitle":"残り時間の表示に、判断を任せない","body2":"画面のカウントダウンや「残り一人」の文字は、本当に締め切りがある証拠ではない。アンケートに答えるだけと言われても、最後に個人情報や課金の申し込みを求められることがあるよ。応募した覚えがある場合も、公式の案内と条件を大人と確かめよう。「家族に聞かずに進めて」は止まる合図だよ。","example":{"title":"アイテムをもらうためにコードを買ってと言われたら","paragraphs":["「当選した。受け取るためにギフトカードを買い、番号を送って」と来た。番号を渡すと、その価値を相手に使われるおそれがある。受け取りの手続きだと決めつけないでね。","大人に相談する前に、支払いも転送もしない。友達にも広める条件なら、ほかの人を巻き込む可能性もある。家族と公式の条件を確かめよう。相手が急いでいても、家族に聞く時間を取っていいんだよ。"]},"actionTitle":"うれしい話でも確認する","actions":["応募の心当たりと、公式の案内を家族と確かめる。","受け取りのための支払いやコード送付をしない。","友達に広める前にも、内容を大人と確認する。"],"reflect":"当たったものを受け取るだけなのに、なぜ先にお金が必要なのかな？","key":"「もらえる」話でも、支払いや情報提供は先に相談。","imageAlt":"プレゼントの箱を前にした子どもが、すぐ開けず保護者と条件を確認している。","caption":"「もらえる」話でも、支払いや情報提供は先に相談。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":2},{"label":"偽の警告・サポート","title":"大きな音と警告も、本物とは限らない","body":"Webページを見ていると、「ウイルス感染」「今すぐ電話」などと表示し、不安にさせる偽の警告がある。大きな音や有名企業のロゴがあっても、スマホが本当に調べられて感染が分かった証拠ではないよ。画面に出た番号へ電話したり、修理用とされるアプリを入れたりしないでね。","explanationTitle":"直す前に、操作を止める","body2":"相手の指示で遠隔操作を許可すると、画面や機能を他の人が操作できる場合がある。料金の支払いや、ギフトカードの番号を送るよう求められることもあるよ。まず表示の指示に従わず、家族へ。ブラウザを閉じるなど正規の方法で対応し、閉じ方が分からなければそのまま大人に見せよう。","example":{"title":"警告音が鳴り続けたら","paragraphs":["突然の音に驚いて「止めるには電話するしかない」と思ってしまった。でも、相手へ連絡する前に、その画面の操作をやめて家族を呼ぼう。音の強さで本物かは判断できないよ。","アプリを入れたり、お金を払ったりしてしまった場合も、大人に事実を伝えよう。必要な記録を残し、正規の相談先や支払った会社と確認して対処してね。"]},"actionTitle":"警告画面での約束","actions":["表示された番号に電話せず、アプリも追加しない。","自分で閉じられないときは、操作せず大人を呼ぶ。","すでにした操作や支払いは、隠さず相談する。"],"reflect":"大きな音がしたことは、本物の検査が行われた証拠になるかな？","key":"偽の警告の指示に従わず、いつもの大人へ相談する。","imageAlt":"強い警告の出たスマホを子どもが置き、保護者を呼んでいる。","caption":"偽
