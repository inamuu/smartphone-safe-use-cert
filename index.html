の警告の指示に従わず、いつもの大人へ相談する。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":3,"check":{"prompt":"突然「感染した。ここに電話」と大きな音が鳴った。どうする？","options":["音が大きいので本物だと決める","表示番号へ電話し、遠隔操作を許可する","指示に従わず、画面を閉じるなど大人と対応する"],"answer":2,"explain":"音やロゴは感染の証拠ではないよ。画面の相手ではなく、いつもの大人へ相談しよう。"}},{"label":"知っている相手に見えるとき","title":"友達のアカウントも、乗っ取られることがある","body":"友達や家族の名前・アイコンから来たメッセージでも、必ず本人が送ったとは限らない。アカウントを乗っ取られたり、似た別アカウントを作られたりすることがあるよ。「今すぐお金を送って」「認証コードを教えて」など、いつもと違う頼みには、そのまま応じず一度止まろう。","explanationTitle":"同じやり取りの中だけで確かめない","body2":"「本当に本人？」と返信して「そうだよ」と返ってきても、同じ相手が答えているだけかもしれない。直接話す、普段から知っている電話番号に連絡するなど、別の方法で確かめよう。急がせたり、ほかの人に相談しないよう言ったりする場合は特に大人へ。疑って責めるより、本人と自分を守るための確認だよ。","example":{"title":"友達から投票を頼まれたら","paragraphs":["「コンテストに出ているから、このサイトへログインして投票して」と来た。応援したくても、普段のSNSのパスワードを別のページに入れるのは立ち止まる場面だよ。","直接会ったときなど、別の連絡方法で本人に聞いてみよう。本人の頼みでも、必要な情報や入力先が安全かは別に確認する。友達だから全部任せてよいわけではないんだ。"]},"actionTitle":"いつもと違う頼みを確認","actions":["お金・コード・別サイトへのログイン要求では止まる。","直接の会話など、いつも知る別の連絡方法で確かめる。","友達を責めず、不安な内容は大人に見せる。"],"reflect":"同じチャットで「本人？」と聞くだけでは、なぜ十分でないかな？","key":"名前やアイコンだけで決めず、別の方法で確認する。","imageAlt":"友達のような仮面をつけたロボットからの連絡を、子どもが別の連絡方法で確かめている。","caption":"名前やアイコンだけで決めず、別の方法で確認する。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":4},{"label":"QRコードと短いリンク","title":"見えにくい行き先にも、確認が必要","body":"QRコードは、Webページの場所などの情報を読み取れる便利な仕組みだよ。ただし、模様を見るだけで安全な行き先かは分からない。短くされたリンクも、どこへ移動するか見えにくい。メールのQRコードや、出どころの分からない張り紙から、急いでログインや支払いをしないでね。","explanationTitle":"読み取ったあとにも、止まれる","body2":"読み取っただけで、必ず支払いや登録が終わるわけではない。表示された行き先や操作内容を確認し、予想と違う情報入力や送金を求められたら止めよう。お店などのコードも、別のシールで張り替えられる場合がある。少しでもおかしければ、家族や店員に確かめてから使うのが大切だよ。","example":{"title":"返金のはずが、送金画面になったら","paragraphs":["「返金するので、このQRコードを読んで」と言われ、金額を入れて送る画面が出た。返してもらう話と、こちらが送る操作は違う。名前より、実際に何をする画面かを見よう。","お金の操作は進めず、保護者に見せよう。見知らぬ相手に画面を共有して説明してもらうのではなく、いつもの相談先と正規の窓口で確かめてね。予想していた画面と違うことに気づいたら、途中で止めて大丈夫だよ。"]},"actionTitle":"模様の先も確認","actions":["出どころの分からないコードは、すぐ使わない。","読み取り後の行き先と、求められる操作を確認する。","支払い・ログインや不審な張り紙は、大人や店員に聞く。"],"reflect":"返金と言われても、画面が送金なら何を確かめたいかな？","key":"QRコードでも、行き先と操作内容を確かめる。","imageAlt":"親子がQRコードのカードを読み取る前に、出どころを確認している。","caption":"QRコードでも、行き先と操作内容を確かめる。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":5},{"label":"入力する前の確認","title":"公式の入口から、必要な手続きを確かめる","body":"通知が気になったら、その通知のリンクを使わず、普段使う公式アプリや、あらかじめ正しいと確認したブックマークから入り直そう。検索結果にも広告や偽サイトが混ざることがあるので、一番上だから正しいとは限らない。公式の入口を家族と準備しておくと、迷ったときに戻りやすいよ。","explanationTitle":"鍵のマークだけでは、相手の信用は分からない","body2":"URLや通信の表示を確かめることは役立つけれど、HTTPSだから偽サイトではないとは言えない。パスワードやカード情報などを求められたら、どこで何をするのかを大人と確認しよう。自動入力がいつもと違う、案内が見つからないなど小さな違和感でも、入力せず相談していいんだ。","example":{"title":"通知の案内が、公式アプリに見当たらない","paragraphs":["メールに書かれた支払いの案内が、公式アプリでは確認できない。だから絶対に偽物と断定するのではなく、メールのリンクへ戻らず、大人と正規の問い合わせ先で確かめよう。","内容を確認できないまま期限に焦って入力する必要はない。どの会社や手続きの話なのか、家族と整理するだけでも、落ち着いて判断しやすくなるよ。家族と用意した入口があると、困ったときの行動を選びやすくなるね。"]},"actionTitle":"迷ったときに戻れる準備","actions":["公式アプリや確認済みブックマークを家族と用意する。","リンクから入力せず、正規の入口で案内を確かめる。","鍵の表示や検索順位だけで信用せず、大人と確認する。"],"reflect":"検索の一番上にあることは、公式サイトの証明になるかな？","key":"入力前に止まり、確認済みの入口から確かめる。","imageAlt":"入力しかけた手を止めた子どもが、親といつもの正規アプリを開いている。","caption":"入力前に止まり、確認済みの入口から確かめる。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":6},{"label":"失敗したあとでも","title":"押した・入力したを、隠さず相談する","body":"怪しいリンクを開いたら、何かを入力したか、アプリを入れたか、お金の操作をしたかで対応が変わるよ。開いた瞬間に必ず感染するとは限らないけれど、何も確認せず安心とも決めない。追加の操作を止め、どこまで進めたかを信頼できる大人に伝えよう。","explanationTitle":"早く伝えることが、被害を減らす助けになる","body2":"パスワードを入れたなら正規の入口から変更し、使い回しや登録情報も確認する。アプリ導入や支払いをした場合は、端末の確認やサービス会社への連絡などが必要になることもある。画面・時刻・相手・支払いの記録などは、大人と安全に残そう。証拠を集めるために相手と会話を続ける必要はないよ。","example":{"title":"入力してしまい、怒られそうで言えないとき","paragraphs":["「もっと早く気づけば」と思っても、今から相談する意味はある。家族に話しにくいなら、先生など別の信頼できる大人にも伝えよう。知らない復旧業者へ秘密を渡さないでね。","追加の支払いや秘密の送付を止め、正規の方法で守り直す。相談したこと自体を罰するのではなく、まず安全を守り、落ち着いてから使い方を振り返ろう。"]},"actionTitle":"相談で伝えたいこと","actions":["追加の入力・支払い・アプリ導入を止める。","開いた、入力した、入れた、払ったのどこまでか伝える。","大人と記録を残し、正規の窓口や方法で対処する。"],"reflect":"リンクを開いた場合と、お金を送った場合で、必要な相談は同じかな？","key":"どこまで操作したかを伝えよう。失敗したあとでも助けを求めていい。","imageAlt":"困った表情の子どもに保護者が寄り添い、入力してしまったスマホを一緒に確認している。","caption":"どこまで操作したかを伝えよう。失敗したあとでも助けを求めていい。","image":"assets/lessons/chapter08-atlas.jpg","imagePanel":7,"check":{"prompt":"偽サイトに秘密を入力し、お金まで送ってしまった。どうする？","options":["取り戻すために追加の情報を送る","追加の操作を止め、すぐ大人にどこまでしたか伝えて正規の窓口へ相談する","怒られそうなので黙って待つ"],"answer":1,"explain":"失敗したあとでも相談していい。早く状況を伝えることが、被害を減らす助けになるよ。"}}],"questions":[{"slide":0,"tag":"急がせる通知","q":"「今日中にログインしないと停止」と来た。まずどうする？","options":["そのリンクから急いで秘密を入力する","返信でパスワードを送る","一度止まり、いつもの公式アプリなどで大人と確認する"],"answer":2,"why":"急がせる言葉に判断を任せず、確認済みの入口へ戻ろう。","id":"chapter8-01"},{"slide":0,"tag":"見た目の信用","q":"有名なロゴがあり、日本語も自然なメールなら？","options":["それだけでは本物と決められない","ロゴがあれば必ず本物","誤字がなければすべて安全"],"answer":0,"why":"見た目や表示名を似せる手口があるよ。正規の入口で確かめよう。","id":"chapter8-02"},{"slide":1,"tag":"宅配の通知","q":"荷物を待っている日に不在通知のSMSが来た。どうする？","options":["予定と合うので、そのリンクでカード情報を入れる","家族と注文履歴や公式の配送確認を使う","荷物確認用と書かれたアプリをすぐ入れる"],"answer":1,"why":"心当たりがあっても、それだけで本物とは言えないよ。","id":"chapter8-03"},{"slide":1,"tag":"家族の支払い","q":"保護者の通信料金が未払いだという通知が、自分のスマホに来た。どうする？","options":["自分だけで支払う","認証コードを送って解除する","保護者に見せ、正規の方法で確認してもらう"],"answer":2,"why":"自分だけで支払いの問題を解決しようとせず、契約している大人に確認しよう。","id":"chapter8-04"},{"slide":2,"tag":"当選と支払い","q":"「当選したので、先にギフトカードの番号を送って」と言われた。どうする？","options":["番号やお金を送らず、家族と確認する","受け取りのためなら送る","安いカードから一度試す"],"answer":0,"why":"番号を渡すと使われるおそれがあるよ。うれしい話でも支払いは先に相談してね。","id":"chapter8-05"},{"slide":2,"tag":"締め切り表示","q":"画面に「残り30秒」とある。どう考える？","options":["本当の締め切りなので必ず急ぐ","表示だけで本当の期限とは分からない。相談してよい","時間が減るほど安全になる"],"answer":1,"why":"カウントダウンは、急がせるための表示かもしれないよ。","id":"chapter8-06"},{"slide":3,"tag":"偽警告","q":"突然「感染した。ここに電話」と大きな音が鳴った。どうする？","options":["音が大きいので本物だと決める","表示番号へ電話し、遠隔操作を許可する","指示に従わず、画面を閉じるなど大人と対応する"],"answer":2,"why":"音やロゴは感染の証拠ではないよ。画面の相手ではなく、いつもの大人へ相談しよう。","id":"chapter8-07"},{"slide":3,"tag":"警告画面の意味","q":"警告が出たことだけで、何が分かる？","options":["本当に感染したと断定はできない","必ず全写真が盗まれた","電話すれば無料で必ず直る"],"answer":0,"why":"偽の警告は、感染していなくても表示されることがあるよ。","id":"chapter8-08"},{"slide":4,"tag":"なりすまし","q":"友達のアカウントから、急にお金や認証コードを頼まれた。どうする？","options":["いつものアイコンなら必ず応じる","応じず、直接話すなど別の方法で確認する","同じチャットで本人と言えば必ず信用する"],"answer":1,"why":"乗っ取りや似たアカウントの可能性があるよ。別の方法で確認しよう。","id":"chapter8-09"},{"slide":4,"tag":"友達への投票","q":"友達を応援するため、別のページでSNSの秘密を求められた。どうする？","options":["友達の頼みなら入力する","何回も頼まれたら秘密を送る","入力を止め、本人と入力先の安全を別に確認する"],"answer":2,"why":"本人の頼みかどうかと、その操作が安全かどうかは両方確かめよう。","id":"chapter8-10"},{"slide":5,"tag":"QRコード","q":"出どころの分からないQRコードを読む前後に大切なのは？","options":["出どころ・行き先・求められる操作を確認する","模様がきれいなら信用する","文字リンクではないので何でも許可する"],"answer":0,"why":"QRコードも別の場所へ誘導する入口。読み取り後の内容も確認しよう。","id":"chapter8-11"},{"slide":5,"tag":"返金と送金","q":"返金と言われたのに、QRコードの先で金額を入れて送る画面が出た。どうする？","options":["言われた額を送れば返金になる","操作を止め、保護者と確認する","相手に画面を共有して全部操作してもらう"],"answer":1,"why":"受け取る話と送る操作は違うよ。実際に何をする画面か見て、止まろう。","id":"chapter8-12"},{"slide":6,"tag":"公式の入口","q":"通知を確認するための、よい準備は？","options":["検索で一番上の広告だけ使う","届いた通知の番号だけを保存する","公式アプリや正しいと確認したブックマークを家族と用意する"],"answer":2,"why":"いつもの正規の入口を用意すると、怪しいリンクへ戻らず確かめやすいね。","id":"chapter8-13"},{"slide":6,"tag":"HTTPSの意味","q":"HTTPSや鍵の表示があるサイトなら、必ず運営者を信用できる？","options":["通信の保護と、運営者の信用は別なので断定できない","鍵があるサイトに偽物はない","検索順位も高ければ絶対に安全"],"answer":0,"why":"偽サイトでもHTTPSを使えるよ。入力先や必要な手続きも確かめよう。","id":"chapter8-14"},{"slide":7,"tag":"重要：被害後の相談","q":"偽サイトに秘密を入力し、お金まで送ってしまった。どうする？","options":["取り戻すために追加の情報を送る","追加の操作を止め、すぐ大人にどこまでしたか伝えて正規の窓口へ相談する","怒られそうなので黙って待つ"],"answer":1,"why":"失敗したあとでも相談していい。早く状況を伝えることが、被害を減らす助けになるよ。","critical":true,"id":"chapter8-15"},{"slide":7,"tag":"操作ごとの対処","q":"怪しいリンクを開いた。どう考える？","options":["開いただけで必ず感染した","何をしたかに関係なく、何も確認しなくてよい","入力・導入・支払いなど、どこまでしたかを大人と確認する"],"answer":2,"why":"開いた瞬間に必ず感染とは限らないよ。追加操作を止め、状況に合った対処を大人と考えよう。","id":"chapter8-16"}],"sources":[{"title":"警察庁：フィッシング対策","url":"https://www.npa.go.jp/bureau/cyber/countermeasures/phishing.html","note":"実在の組織を装う手口と、被害後の相談・変更。","checked":"2026-11-17"},{"title":"警察庁：サポート詐欺対策","url":"https://www.npa.go.jp/bureau/cyber/countermeasures/support-fraud.html","note":"偽の警告、遠隔操作、支払いと相談。","checked":"2026-11-17"},{"title":"警視庁：QRコードを利用する時の注意点","url":"https://www.keishicho.metro.tokyo.lg.jp/kurashi/cyber/notes/qrcord.html","note":"QRコードからの送金誘導や張り替えへの注意。","checked":"2026-11-17"},{"title":"フィッシング対策協議会：今すぐできるフィッシング対策","url":"https://www.antiphishing.jp/consumer/antiphishing-for-users.html","note":"正規の入口、情報入力前の確認、被害のサインと対処。","checked":"2026-11-17"},{"title":"IPA：インターネットサービスへの不正ログインによる被害が増加中","url":"https://www.ipa.go.jp/security/anshin/attention/2025/mgdayori20250828.html","note":"怪しいサイトでの入力・導入の有無に応じた確認と対処。","checked":"2026-11-17"}],"number":8},{"title":"個人情報と情報漏えい","description":"渡す情報と共有先を選び、漏えいや誤送信に気づいたときの行動を学ぼう。","lessons":[{"label":"個人情報のかたち","title":"名前を書かなければ、分からない？","body":"氏名や顔写真、住所など、その人が誰か分かる情報を個人情報というよ。名前がなくても、「通っている学校」「部活」「誕生日」「よく行く店」などの手がかりが組み合わさると、自分のことだと分かる場合がある。プロフィールの一つ一つだけでなく、これまでの投稿と合わせて考えることが大切なんだ。","explanationTitle":"小さな手がかりが、つながることもある","body2":"ネット上の名前を本名と違うものにしても、すべての情報が匿名になるわけではない。学校の行事の日付や制服の写真などから、身近な人が気づくこともあるよ。何でも危険だと怖がるより、「これを見た相手は何を知るだろう」と、受け取る側の立場で確認してみよう。","example":{"title":"プロフィールに、部活の予定も書きたい","paragraphs":["「○○中のバスケ部。毎週金曜は駅前で練習」と書くと、名前がなくても学校やよくいる場所、時間が伝わる。好きなスポーツを紹介するだけなら、そこまで詳しい予定は必要ないかもしれないね。","友達だけに伝えたい予定を、不特定多数が見られる自己紹介へ書く必要はない。何を誰に知らせたいのかを分けて考え、公開する情報は家族と確認しよう。"]},"actionTitle":"組合せで見直そう","actions":["プロフィールと最近の投稿を、合わせて見たつもりで考える。","学校名や行動の予定まで、公開する必要があるか考える。","判断に迷う項目は、載せる前に家族へ見せる。"],"reflect":"本名を隠しても、いつもいる場所が分かる自己紹介になっていないかな？","key":"一つの情報だけでなく、手がかりの組合せにも注意しよう。","imageAlt":"学校や誕生日を表すカードを組み合わせ、親子が誰の情報か分かることに気づいている。","caption":"一つの情報だけでなく、手がかりの組合せにも注意しよう。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":0},{"label":"登録する前に","title":"入力する情報は、必要な分だけ","body":"サービスに登録するとき、名前や連絡先などを入力することがある。便利に使うための情報でも、むやみに渡してよいわけではないよ。誰が運営し、何のために使うのか、その項目は必須なのかを家族と確かめよう。使う予定のないサービスへ、景品が欲しいという理由だけで詳しい情報を登録しないことも大切なんだ。","explanationTitle":"空欄にできる項目まで、埋めなくていい","body2":"「任意」は入力しなくてもよい項目という意味。登録に必要な内容と、公開プロフィールとして見える内容は別の場合もあるよ。分からない欄を適当な情報で埋めるのではなく、説明を確認しよう。年齢などの利用条件を偽って制限を回避せず、利用できるかも保護者と相談してね。","example":{"title":"ゲームの特典に、住所まで必要？","paragraphs":["ゲームで使うアイテムをもらうだけなのに、見知らぬフォームが住所や家族の勤務先を求めている。何のために必要なのか分からなければ、特典を急いで受け取ろうとせず、そこで止まろう。","公式の案内や利用目的を家族と確認し、納得できなければ利用を見送っていい。入力が少ないほど、もし情報が漏れたときに外へ出る情報も減らしやすいよ。"]},"actionTitle":"入力前の三つの確認","actions":["運営者と、その情報を使う目的を確認する。","必須と任意、登録情報と公開情報の違いを見る。","不要なサービスや分からないフォームには、入力せず相談する。"],"reflect":"その特典のために、本当に家の住所を渡す必要があるかな？","key":"必要なサービスに、必要な情報だけを登録する。","imageAlt":"登録フォームの項目を親子で見て、必要な欄だけ選んでいる。","caption":"必要なサービスに、必要な情報だけを登録する。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":1,"check":{"prompt":"特典の申込みで、必要な理由が分からない個人情報を求められた。どうする？","options":["入力を止め、運営者や利用目的を家族と確かめる","期限が短いので全部入力する","家族の情報を代わりに入れる"],"answer":0,"explain":"何のために誰へ渡すのかを確認しよう。不要なサービスに詳しい情報を登録する必要はないよ。"}},{"label":"アプリへの許可","title":"許可ボタンは、何を渡す合図？","body":"アプリから「連絡先へのアクセス」「位置情報の利用」「写真の閲覧」などを求められることがある。この許可を権限というよ。たとえば地図で現在地を使う目的は分かりやすいけれど、単純な道具にすべての連絡先が必要とは限らない。通知を早く消したいからと、内容を読まずに毎回許可しないでね。","explanationTitle":"友達の情報も、端末には入っている","body2":"連絡先には、自分だけでなく家族や友達の電話番号などが含まれる。写真にも他の人の顔や生活が写ることがあるよ。「自分のスマホだから、全部自分だけの情報」とは考えないでね。必要な写真だけを選ぶ、使用中だけ位置情報を許可するなど、選べる範囲は機種やアプリによって異なるよ。","example":{"title":"加工アプリが、連絡先も求めてきた","paragraphs":["写真を明るくするアプリなのに、連絡先を使う許可が表示された。どんな機能のために必要か分からなければ、いったん許可せず説明を読み、保護者と一緒に確かめよう。","許可しないと使えない機能もあるけれど、全部を許可してから考える必要はない。設定から許可を見直せる場合もある。目的と範囲を確かめて決めるのが大切だよ。"]},"actionTitle":"許可の範囲を確かめよう","actions":["何の機能に必要な許可なのか、説明を読む。","選べる場合は、必要な写真や必要な時間だけにする。","家族と定期的に権限を点検し、不要な許可を見直す。"],"reflect":"連絡先を見せると、自分以外の誰の情報も伝わりうるかな？","key":"「許可」は、何を使わせるか考えてから選ぼう。","imageAlt":"スマホの連絡先や位置情報の許可を、子どもと保護者が点検している。","caption":"「許可」は、何を使わせるか考えてから選ぼう。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":2},{"label":"共有する範囲","title":"「友達だけ」の中にも、相手がいる","body":"情報を投稿するときは、全体公開、フォロワー限定、グループ、一対一など、誰が見られる設定なのか確かめよう。「友達だけ」と思っていても、知らない人がフォロワーにいたり、グループへ新しい人が加わったりすることがある。画面にある設定の名前だけでなく、実際の相手を確認することが大切だよ。","explanationTitle":"限定公開も、秘密の金庫ではない","body2":"公開範囲を狭めるのは役立つ工夫だけれど、受け取った人が保存したり、別の相手に見せたりする可能性は残るよ。見られて困る内容を、設定だけに頼って送らないでね。投稿の途中で前回の設定が引き継がれる場合もあるので、重要な内容ほど送信前の確認を省かないようにしよう。","example":{"title":"クラスの連絡先一覧を送りたい","paragraphs":["クラスのグループへ家族の連絡先一覧を送れば便利そう。でも、参加者全員にその情報が必要とは限らないし、一覧には本人以外の人の情報も含まれる。まず先生や保護者に、適切な連絡方法を相談しよう。","誰かが前に送っていたからといって、自分も転送してよいとは限らない。必要な相手へ必要な部分だけ届ける方法があるかを、大人と一緒に考えてみよう。"]},"actionTitle":"送信先をもう一度見る","actions":["公開範囲と、実際に参加している相手を確認する。","情報を受け取る必要がない人まで含まれていないか考える。","限定グループでも、広まると困る内容は送らず相談する。"],"reflect":"その情報は、グループにいる全員へ伝える必要があるかな？","key":"公開範囲を狭めても、受け取った人による共有の可能性は残る。","imageAlt":"子どもが共有先の人の輪を見比べ、必要な相手に範囲を絞っている。","caption":"公開範囲を狭めても、受け取った人による共有の可能性は残る。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":3,"check":{"prompt":"「友達だけ」のグループなら、何を送っても絶対に外へ出ない？","options":["人数が少なければ必ず秘密になる","参加者が保存や転送をする可能性は残る","顔を隠せば何でも送ってよい"],"answer":1,"explain":"限定公開は役立つけれど、受け取った人のコピーや共有まで防げるとは限らないよ。"}},{"label":"他の人の情報","title":"友達の情報は、自分で公開を決めない","body":"友達の電話番号、家族の名前、学校の名簿、相談された話なども大切な情報だよ。自分が知っていることと、他の人に広めてよいことは別なんだ。面白い話でも、本人が知らせたくないかもしれない。「みんなもう知っているはず」と決めつけず、共有する必要と相手の気持ちを考えよう。","explanationTitle":"スクリーンショットにも、情報が残る","body2":"友達とのやり取りを画像にすると、名前やアイコン、会話の内容が一緒に写ることがある。名前を隠しただけでは、内容から誰の話か分かる場合もあるよ。困ったことを相談するために信頼できる大人へ見せることと、面白がってグループへ広めることは目的が違う。相談をためらう必要はないよ。","example":{"title":"相談された会話を、別の友達へ？","paragraphs":["友達から「最近、部活がつらい」と相談された。別のグループで話題にしようとして、会話の画像を送りたくなった。でも、相談した本人は、そのグループに知られたくないかもしれないね。","相手の秘密を一人で抱えきれないときや、安全が心配なときは、保護者や先生に相談していい。その場合も、助けるために必要な相手へ必要な範囲で伝えよう。"]},"actionTitle":"相手の立場で考えよう","actions":["友達や家族の情報を、本人に無断で広めない。","画像では、名前以外の会話内容やアイコンも確認する。","安全のための相談は、信頼できる大人へ必要な範囲で行う。"],"reflect":"友達が自分の相談内容を知らないグループへ送ったら、どう感じるかな？","key":"知っていることと、広めてよいことは別。困ったときの相談はしていい。","imageAlt":"友達の名札や連絡先が写らないよう、親子が共有前の画面を確認している。","caption":"知っていることと、広めてよいことは別。困ったときの相談はしていい。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":4},{"label":"サービス側からの漏えい","title":"自分が投稿しなくても、漏れることがある","body":"情報漏えいは、本来見せる予定のない相手へ情報が伝わってしまうこと。誤送信だけでなく、サービス側の設定ミスや不正な侵入などで、登録した情報が外へ出ることもあるよ。気をつけて使っていた人にも起こりうるので、被害を受けた人のせいだと決めつけないことが大切なんだ。","explanationTitle":"お知らせは、内容を確かめて対処する","body2":"漏えいのお知らせが来たら、何の情報が対象なのかを確認する必要がある。パスワードと連絡先では、必要な対応が同じとは限らないよ。ただし、お知らせ自体が偽物の可能性もある。メッセージのリンクへ急いで入力せず、普段使う公式アプリや確認済みのサイトから家族と調べよう。","example":{"title":"利用していたサービスから連絡が来た","paragraphs":["「登録情報が漏れた可能性がある」と届いた。すぐに全部のアカウントを消すのではなく、公式のお知らせで対象の情報や利用者、案内されている対応を保護者と確かめよう。","パスワードが対象なら変更などを進める。電話番号やメールアドレスが対象なら、その情報を知っている相手でも本物とは限らないと意識し、不審な連絡に気をつけてね。"]},"actionTitle":"漏れた内容に合わせて動こう","actions":["公式の案内を、確認できる入口から家族と読む。","対象になった情報と、必要な対応を整理する。","使わないサービスや、登録情報が多すぎないかも見直す。"],"reflect":"相手が自分の名前を知っていれば、必ず本物の担当者だと言えるかな？","key":"漏えいは自分の操作以外でも起こる。対象の情報を確認して対処しよう。","imageAlt":"企業からのお知らせを親子で読み、どの情報が対象なのか確認している。","caption":"漏えいは自分の操作以外でも起こる。対象の情報を確認して対処しよう。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":5},{"label":"気づいたときの初動","title":"間違えて送ったら、隠すより相談","body":"知らない相手へ情報を送った、違うグループに画像を投稿した、公開設定を間違えた。気づいたら、新たな送信をいったん止めよう。自分だけで直そうと焦らず、何を誰に送ったか、いつ気づいたかを信頼できる大人へ伝えてね。早めに相談すると、一緒に取れる対応を考えやすくなるよ。","explanationTitle":"取り消しと、相談を組み合わせよう","body2":"取り消しや公開範囲の変更ができる場合は、大人と確認しながら行う。必要なら相手へ削除をお願いし、サービスの窓口にも相談するよ。ただし、自分の画面から消えたことだけで、相手の保存分まで全部消えたとは判断できない。状況を伝えるための記録も、大人と必要な範囲で残そう。","example":{"title":"住所の写った画面を、別の相手へ送った","paragraphs":["家族へ送るつもりの画面を、別のグループへ送ってしまった。恥ずかしくても、保護者に「このグループへ、この画像を送った」と見せよう。何を送ったか分からないまま隠すより、対処を考えやすくなるよ。","確認のために、さらに別の友達へ同じ画像を送る必要はない。広げずに相談し、取り消しなどができるかを一緒に確認する。失敗したあとでも、助けを求めていいんだ。"]},"actionTitle":"まず止まって、状況を伝えよう","actions":["追加の送信や、情報を広げる転送を止める。","いつ、どこへ、何を送ったかを大人に見せる。","取り消し、設定変更、窓口への相談を一緒に考える。"],"reflect":"間違いに気づいたら、一人で隠すより誰へどう話せそうかな？","key":"失敗したあとでも相談していい。情報を広げず、一緒に対処しよう。","imageAlt":"誤送信に気づいた子どもが、スマホを保護者に見せて説明している。","caption":"失敗したあとでも相談していい。情報を広げず、一緒に対処しよう。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":6},{"label":"二次被害を防ぐ","title":"「消してほしければ払って」に応じない","body":"情報を送ってしまったあとで、「消してほしければお金を払って」「もっと写真を送って」と要求されることがある。従えば必ず消える、これで終わる、という保証はないよ。怖くても一人で交渉せず、追加のお金や情報を渡さないで、すぐ信頼できる大人に相談してね。約束を破ってしまったあとでも同じだよ。","explanationTitle":"相談したこと自体を、責めないために","body2":"困っているときは「怒られるかも」と言い出しにくいこともある。保護者にすぐ話せなければ、先生など別の信頼できる大人でもいい。「今、安全のことで困っている」と伝えよう。要求の内容や相手の表示を見せられると手がかりになるけれど、記録を集めるためにやり取りを続ける必要はないよ。","example":{"title":"相手が、家族には秘密にと言ってきた","paragraphs":["「親に言ったら広める」と言われた。相手が秘密を求めても、その約束を守る必要はない。今の画面を閉じて近くの大人を呼ぶなど、安全な相手につながる行動を先にしよう。","保護者や先生と、サービスへの通報や警察への相談も考えられる。自分で相手を追いかけたり、友達へ広く画像を回したりせず、大人と一緒に被害を増やさない方法を選ぼう。"]},"actionTitle":"助けを求める言葉を準備しよう","actions":["追加の写真、個人情報、お金を送らない。","「脅されていて困っている」と、信頼できる大人に伝える。","相手への対応や通報は、大人と一緒に考える。"],"reflect":"「親には言うな」と言われたとき、相談してはいけないのかな？","key":"要求に一人で応じない。秘密にせず、すぐ大人へ相談しよう。","imageAlt":"情報を消す代わりにお金を求める通知を前に、送らず保護者へ相談している。","caption":"要求に一人で応じない。秘密にせず、すぐ大人へ相談しよう。","image":"assets/lessons/chapter09-atlas.jpg","imagePanel":7,"check":{"prompt":"個人情報を消す代わりに、お金を払えと脅された。どうする？","options":["一度だけ払う","秘密にする約束を守る","払わず、追加の情報も送らず、すぐ大人へ相談する"],"answer":2,"explain":"要求に応じれば終わる保証はないよ。約束を破ってしまったあとでも、一人で抱えず相談していい。"}}],"questions":[{"id":"privacy-01","tag":"個人情報","q":"本名を書かなければ、学校や行動範囲は絶対に分からない？","options":["ほかの情報の組合せから分かる場合もある","本名がなければ必ず分からない","顔を隠せばどんな予定を書いてもよい"],"answer":0,"why":"学校名や写真、予定などの手がかりがつながる場合があるよ。","slide":0},{"id":"privacy-02","tag":"組合せ","q":"自己紹介に、学校名と毎週の練習場所・時間を書きたい。どうする？","options":["便利なので全体公開する","詳しい予定まで公開する必要があるか、家族と考える","名前の横に記号を付ければ必ず安全"],"answer":1,"why":"一つ一つは小さな情報でも、組合せで生活の場所や時間が伝わるよ。","slide":0},{"id":"privacy-03","tag":"必要最小限","q":"登録フォームの「任意」の項目は？","options":["必ず全部埋める項目","うその情報を入れる項目","入力しなくてもよい項目"],"answer":2,"why":"必要な情報に絞り、分からない項目は説明を確認しよう。","slide":1},{"id":"privacy-04","tag":"入力前の確認","q":"特典のために住所を求められたが、使う目的が分からない。どうする？","options":["入力せず、運営者や利用目的を家族と確認する","期限が短ければ急いで入力する","友達の住所を代わりに入れる"],"answer":0,"why":"特典を急ぐより、何のために誰へ渡す情報か確認しよう。","slide":1},{"id":"privacy-05","tag":"許可","q":"写真加工アプリが連絡先の許可を求めてきた。どうする？","options":["早く使うため全部許可する","機能に必要か説明を読み、迷ったら大人と確認する","自分のスマホなので友達の情報は関係ない"],"answer":1,"why":"連絡先には他の人の情報もある。目的に合う許可か確かめよう。","slide":2},{"id":"privacy-06","tag":"他人の情報","q":"アプリに連絡先を使わせるとき、考えたいことは？","options":["自分以外の情報は含まれない","許可は後から一切見直せない","家族や友達の情報も含まれる可能性"],"answer":2,"why":"端末の中には、自分以外の人の情報も入っているよ。","slide":2},{"id":"privacy-07","tag":"共有範囲","q":"限定グループに送った情報について正しい考え方は？","options":["参加者による保存や転送の可能性は残る","絶対にグループの外へ出ない","一日たつと必ず全部消える"],"answer":0,"why":"公開範囲を狭めるのは役立つけれど、コピーまで防げるとは限らないよ。","slide":3},{"id":"privacy-08","tag":"必要な相手","q":"家族の連絡先一覧をクラスのグループへ送りたい。どうする？","options":["前に誰かが送っていれば確認不要","全員に必要か、適切な方法かを先生や保護者に相談する","名前だけ残して番号は別の投稿にすれば自由"],"answer":1,"why":"必要な情報を必要な相手へ届ける方法を、大人と考えよう。","slide":3},{"id":"privacy-09","tag":"相談と拡散","q":"友達に相談された会話を、面白いので別グループへ送りたい。どうする？","options":["名前を消せば必ず自由に送れる","自分が受け取った会話なので自由","本人の気持ちや共有の必要を考え、勝手に広めない"],"answer":2,"why":"名前以外の内容から相手が分かることもある。相談を勝手に広めないでね。","slide":4},{"id":"privacy-10","tag":"安全のための相談","q":"友達からの相談を一人では抱えきれず、安全も心配。どうする？","options":["信頼できる大人へ、助けるために必要な範囲で相談する","秘密なら危険でも誰にも言えない","全体公開して意見を集める"],"answer":0,"why":"安全のために大人へ相談していい。広く拡散することとは違うよ。","slide":4},{"id":"privacy-11","tag":"漏えいのお知らせ","q":"漏えいのお知らせが届いた。まずどうする？","options":["そのリンク先へすべての情報を急いで入力する","確認済みの公式の入口から、対象情報と対応を家族と確かめる","お知らせの内容に関係なく必ず全部の端末を捨てる"],"answer":1,"why":"お知らせ自体の真偽と、どの情報が対象かを確認しよう。","slide":5},{"id":"privacy-12","tag":"二次被害","q":"相手が自分の名前を知っているとき、どう考える？","options":["名前を知る人は全員信用できる","必ず家族が紹介した人だと分かる","漏えいした情報などを知っているだけの可能性もある"],"answer":2,"why":"知っている情報だけで、本物の担当者だと決めないでね。","slide":5},{"id":"privacy-13","tag":"誤送信","q":"住所の写った画像を違うグループに送った。どうする？","options":["追加の送信を止め、何をどこへ送ったか大人に相談する","確認のため別の友達全員にも画像を送る","怒られないよう何日も隠す"],"answer":0,"why":"情報をさらに広げず、早めに状況を伝えて一緒に対処しよう。","slide":6},{"id":"privacy-14","tag":"取り消し","q":"自分の画面から投稿が消えたら？","options":["誰も見ていないことが必ず証明できる","相手の保存分まで消えたとは限らない","もう大人へ相談してはいけない"],"answer":1,"why":"取り消しだけで全部消えたと決めず、必要な対応を相談しよう。","slide":6},{"id":"privacy-15","tag":"相談先","q":"保護者へすぐ話せないときは？","options":["困らせている相手だけを頼る","誰にも相談できない","先生など、別の信頼できる大人へ相談する"],"answer":2,"why":"相談先は一人だけではないよ。安全な相手につながることを優先しよう。","slide":7},{"id":"privacy-16","tag":"重要：要求に応じない","q":"送った情報を消す代わりに、お金や追加の写真を要求された。どうする？","options":["追加で送らず、すぐ信頼できる大人に相談する","一度だけ払えば必ず終わると信じる","家族には秘密という要求を守る"],"answer":0,"why":"要求に一人で応じず、安全を優先して相談しよう。失敗したあとでも相談していい。","slide":7,"critical":true}],"sources":[{"title":"個人情報保護委員会：キッズページ","url":"https://www.ppc.go.jp/news/kids/","note":"個人情報の基本と、子ども向けの保護・取扱い教材。","checked":"2026-11-17"},{"title":"個人情報保護委員会：よくある質問集","url":"https://www.ppc.go.jp/personalinfo/life/faq/","note":"他の情報との組合せで個人が分かる場合もあること。","checked":"2026-11-17"},{"title":"個人情報保護委員会：取扱注意！みんなの大切な個人情報","url":"https://www.ppc.go.jp/news/kids/movie/kodomomuke_accessible/","note":"他人の情報、写真への写り込み、情報を組み合わせた特定への注意。","checked":"2026-11-17"},{"title":"IPA：自分の個人情報等が漏えいした際の「対処」と「日頃の対策」","url":"https://www.ipa.go.jp/security/anshin/attention/2026/mgdayori20261026.html","note":"必要最小限の登録、公式案内の確認、漏えい情報の種類に応じた対処。","checked":"2026-11-17"},{"title":"Google：Android スマートフォンでアプリの権限を変更する","url":"https://support.google.com/android/answer/9431959?hl=ja","note":"連絡先・位置情報・写真などへの権限と、設定の見直し。","checked":"2026-11-17"},{"title":"警察庁：サイバー事案に関する相談窓口","url":"https://www.npa.go.jp/bureau/cyber/soudan.html","note":"情報の悪用などで困ったとき、大人と一緒に相談できる窓口。","checked":"2026-11-17"}],"number":9},{"title":"写真・動画・位置情報","description":"写り込み・撮影場所・公開範囲を確かめ、相手の意思と作品の権利を守って共有しよう。","lessons":[{"label":"背景も情報","title":"主役の後ろに、何が写っている？","body":"写真を送る前は、顔や作品などの主役だけでなく、背景の看板、表札、学校名、郵便物なども見てみよう。住所を書いたつもりがなくても、場所を知る手がかりが写り込むことがある。自宅の窓から見える景色や、通学路の特徴が、ほかの投稿と結びつく場合もあるよ。","explanationTitle":"顔を隠しても、全部が隠れるわけではない","body2":"顔にスタンプを付けるのは一つの工夫だけれど、制服、名札、持ち物、背景などから本人や場所が分かる場合がある。細かな情報を後から全部隠そうとするより、背景を変えて撮り直す、写真を送らず文章で伝える方法もあるよ。どの工夫なら十分か迷ったら、公開せずに家族と確認しよう。","example":{"title":"新しいボールの写真を見せたい","paragraphs":["買ったボールを玄関で撮ったら、後ろに表札と荷物の宛名が写っていた。ボールを見せるために、家の情報まで相手へ伝える必要はないね。背景がすっきりした場所で撮り直せるよ。","写真を大きく見て、端まで確認してから共有しよう。写り込んだ情報を一部隠しただけで安心せず、他にも手がかりがないかを確かめる習慣をつけてね。"]},"actionTitle":"写真の端まで見てみよう","actions":["表札、学校名、宛名などが写っていないか確認する。","顔以外の制服や持ち物、背景も見る。","情報が多いときは、撮り直すか共有を見送る。"],"reflect":"見せたいものと一緒に、家や学校の情報まで送ろうとしていないかな？","key":"主役だけでなく、背景と写真の端まで確認しよう。","imageAlt":"写真の背景にある学校の看板や家の表札を、親子が見つけている。","caption":"主役だけでなく、背景と写真の端まで確認しよう。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":0},{"label":"動画と反射","title":"一瞬の写り込みや、音にも気づこう","body":"動画では、撮り始めや最後の一瞬に部屋の様子や書類が写ることがある。窓や鏡、画面の反射に、撮影者や周りの情報が映る場合もあるよ。写真の一場面だけを見て確認を終えず、動画は最初から最後まで見直し、音にも意識を向けよう。自分が映っていない場面にも情報は含まれるんだ。","explanationTitle":"話し声も、人や場所の手がかりになる","body2":"学校名を呼ぶ声、家族の名前、駅の案内など、音から伝わる情報もある。見せたい場面を切り取る、音を消すなどの工夫が使える場合もあるけれど、それだけで必ず安全になるわけではないよ。編集に自信がなければ、送らない選択もできる。安全に配慮できる形を、大人と一緒に考えよう。","example":{"title":"ギターの練習動画を送る前に","paragraphs":["演奏は上手に撮れたけれど、後ろの鏡に家族と郵便物が映り、途中で家族の名前を呼ぶ声も入っていた。演奏を見せたい目的には、その情報はなくてもいいね。撮る場所や時間を変える方法もあるよ。","短い動画でも、確認せずそのまま送らないでね。誰かの姿や会話が入っていたら、その人にも確かめよう。編集で十分に隠せるか分からないときは、撮り直す方がよい場合もあるよ。"]},"actionTitle":"動く映像と音を点検しよう","actions":["動画を、始めから終わりまで確認する。","鏡や窓などの反射と、周囲の話し声にも気をつける。","隠し切れるか迷うときは、撮り直すか公開を見送る。"],"reflect":"動画の主役が自分だけなら、周りの人の確認はいらないのかな？","key":"動画は一瞬の写り込み、反射、音まで見直そう。","imageAlt":"窓の反射に写り込んだ情報を、子どもと保護者が写真で点検している。","caption":"動画は一瞬の写り込み、反射、音まで見直そう。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":1,"check":{"prompt":"動画を送る前に、どこを確かめる？","options":["主役の顔だけ","最初の一場面だけ","全体の映像、反射、周りの音も"],"answer":2,"explain":"一瞬の写り込みや音にも、自分や周りの人の情報が入ることがあるよ。"}},{"label":"写真の中の位置情報","title":"地図を付けたつもりがなくても","body":"写真や動画には、撮影日時や機器の情報など、見える画像以外のデータが付くことがある。これをメタデータといい、設定によっては撮影場所の位置情報が記録されることもあるよ。写真に地図が見えなくても、共有したデータから場所が分かる場合があると覚えておこう。","explanationTitle":"設定やサービスによって、扱いが違う","body2":"位置情報が記録されるか、共有時に残るかは、端末の設定や使うアプリ、送信方法によって違う。サービスが自動で取り除く場合もあるけれど、すべて同じとは限らないよ。家族とカメラの位置情報の許可や、写真共有の設定、公式ヘルプを確認しよう。メタデータを消しても、背景の手がかりは別に残るよ。","example":{"title":"撮影場所を知らせたくない写真","paragraphs":["家の中で作った作品を友達に見せたい。写真の位置情報を記録する設定や、送信時に位置情報を含めるかを保護者と確かめよう。画面の名前や手順は、機種によって違うことがあるよ。","「このSNSは消してくれるらしい」と聞いただけで決めないでね。今回使う方法の説明を確認し、写真の背景や投稿文に、別の場所の手がかりがないかも見直そう。"]},"actionTitle":"位置情報の扱いを確かめよう","actions":["家族と、カメラの位置情報の許可を確認する。","共有するサービスや送信方法の公式説明を見る。","位置情報の設定と、背景の確認を両方行う。"],"reflect":"写真に地図が見えなければ、位置情報は絶対に含まれていないかな？","key":"位置情報の有無は、設定と共有方法で変わる。背景の確認も必要。","imageAlt":"親子がスマホの写真と地図の印を見比べ、位置情報の設定を確認している。","caption":"位置情報の有無は、設定と共有方法で変わる。背景の確認も必要。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":2},{"label":"いつ、どこにいるか","title":"「今ここ」は、知らせる相手を考える","body":"楽しい場所に来ると、すぐ写真を見せたくなるね。でも「今この店にいる」「家族みんなで旅行中」と公開すると、現在地や家を空けていることが伝わる場合がある。写真だけでなく、本文の言葉や位置タグにも注意しよう。今いる場所を、本当にその相手へ知らせる必要があるかな。","explanationTitle":"時間をずらしても、確認は必要","body2":"外出先から離れてから投稿する工夫は、現在地をそのまま知らせにくくする方法の一つ。でも、いつも通う店や毎週の練習場所を何度も出せば、行動のパターンが分かることもあるよ。時間をずらせば何でも安全、とは考えず、投稿する内容や相手を家族と決めておこう。","example":{"title":"家族旅行を、その場で全体公開したい","paragraphs":["「今日から三日間、家族全員で旅行」と写真に添えると、旅行先だけでなく、家を空けている予定まで伝わる。楽しかった思い出を伝えるのに、今の居場所や詳しい日程まで公開する必要はないね。","帰ってから、家族に確認した写真だけを共有する方法もある。保護者への待ち合わせ連絡など、必要な相手へ位置を伝えることとは分け、公開投稿の相手と目的を考えよう。"]},"actionTitle":"今知らせる必要を考えよう","actions":["現在地、外出予定、位置タグを公開していないか見る。","必要な連絡は、必要な相手だけへ送る。","思い出の公開は、時期と内容を家族と相談する。"],"reflect":"楽しかった思い出と、今の居場所は、同じ範囲の人へ知らせる必要があるかな？","key":"現在地や外出予定は、伝える相手とタイミングを考えよう。","imageAlt":"子どもが外出先での即時投稿を控え、保護者と帰宅後の共有を考えている。","caption":"現在地や外出予定は、伝える相手とタイミングを考えよう。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":3,"check":{"prompt":"今いる場所を公開したい。何を考える？","options":["今の居場所や外出予定まで、その相手に知らせる必要があるか","写真が楽しければ必ず安全か","名前を書かなければ場所は一切分からないか"],"answer":0,"explain":"現在地や留守の予定を伝える必要があるか、公開範囲とタイミングも家族と考えよう。"}},{"label":"撮る許可と見せる許可","title":"一緒に撮っても、自由に投稿はしない","body":"友達が笑顔で写真に入ってくれても、ネットへ載せてよいとは限らないよ。写真を撮ること、グループへ送ること、全体公開することでは、見られる相手も残り方も違う。「写真を撮ってもいい？」と「この場所へ送ってもいい？」は分けて確認しよう。後ろに写る人にも気を配ってね。","explanationTitle":"相手の「いや」を、尊重しよう","body2":"「顔を隠せばいいでしょ」と、相手が嫌がるまま公開しないでね。姿や持ち物、投稿文から分かる場合もあるし、公開そのものを望まない人もいる。友達だけでなく、親が子どもの写真を載せるときも本人へ確認する。みんなで相手の意思を大切にすると、安心して思い出を残しやすくなるよ。","example":{"title":"部活の集合写真を、SNSへ？","paragraphs":["部活で撮った写真を、クラスのグループと自分のSNSへ送りたい。撮影には賛成した友達でも、知らない人が見られるSNSは嫌かもしれない。どの場所へ誰に見せるかを説明し、先に確認しよう。","確認できない人がいる場合は、勝手に公開しない。送る範囲を見直す、別の写真を選ぶ、公開を見送る方法がある。相手が断りやすい聞き方も、思いやりの一つだよ。"]},"actionTitle":"相手が選べる聞き方をしよう","actions":["撮影と共有は別だと考える。","どこへ、誰に見せるかを伝えて確認する。","断られたら送らず、別の方法を考える。"],"reflect":"「撮っていいよ」は、「誰にでも公開していいよ」と同じかな？","key":"撮影の許可と共有の許可は別。見せる相手まで伝えて確認しよう。","imageAlt":"子どもが友達へ、撮影してよいかと、写真をどこへ送るかを別々に確かめている。","caption":"撮影の許可と共有の許可は別。見せる相手まで伝えて確認しよう。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":4},{"label":"コピーと限定共有","title":"少人数でも、写真は動いていく","body":"写真を受け取った人は、保存やスクリーンショット、別の端末での撮影などで記録できる場合がある。「保存できない設定」や「一定時間で消える表示」があっても、別の方法で残される可能性までなくなるわけではないよ。送る前に、残ったり別の人へ渡ったりした場合の影響も考えよう。","explanationTitle":"受け取る側にも、守ることがある","body2":"友達から写真が届いても、その友達が別の相手への転送を認めたとは限らない。限定グループにある写真を、面白いからと勝手に外へ出さないでね。自分が送る側の注意だけでなく、受け取った写真を大切に扱うことも必要なんだ。困った画像の相談は、大人へ必要な範囲で行おう。","example":{"title":"友達の面白い顔を、別のグループへ？","paragraphs":["少人数のグループに、友達が変な顔の写真を送ってきた。楽しかったとしても、別のクラスへ送ってよいとは限らない。本人は、今いる友達だけに見せたかったのかもしれないね。","いったん送った写真は、自分だけでは行き先を管理しきれなくなることがある。受け取った側もそのことを考え、勝手に保存・転載して楽しむのではなく、相手の意思を尊重しよう。"]},"actionTitle":"受け取った写真も守ろう","actions":["消える表示でも、必ず記録が残らないとは考えない。","友達の写真を、勝手に別の相手へ転送しない。","送る側と受け取る側の両方で、相手の意思を尊重する。"],"reflect":"自分が見られる写真なら、ほかの人にも自由に見せてよいのかな？","key":"限定共有や消える表示だけで、コピーを完全には防げない。","imageAlt":"限定グループの写真が別の端末へ複製される可能性を、子どもが考えている。","caption":"限定共有や消える表示だけで、コピーを完全には防げない。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":5},{"label":"作品と他人の権利","title":"ネットで見つけた画像は、使っていい？","body":"ネットで見られる写真やイラストにも、作った人の権利がある。保存できるボタンがあることと、SNSのアイコンや投稿に自由に使えることは別だよ。著作権は、作品を作った人の権利を守る仕組み。利用条件や許可を確かめずに使うと、権利を侵害することがあるんだ。","explanationTitle":"作者名を書くだけでは、許可にならない","body2":"「作者はこの人」と書いたり、色を変えたりしただけで、どんな使い方も認められるわけではない。無料で使える素材でも、加工や公開先などに条件がある場合があるよ。例外の決まりもあるけれど、迷ったときに自己判断で広めず、利用条件を大人と確認しよう。詳しい権利の話は、後の法律の章でも学ぶよ。","example":{"title":"好きな絵を、SNSのアイコンにしたい","paragraphs":["画像検索で見つけた絵が気に入り、アイコンにしたくなった。検索結果に出ていることは、使用許可の意味ではない。元の作者や配布元が示す利用条件を確認する必要があるよ。","確認が難しいなら、自分で描く、利用が認められた素材を条件どおり使うなどの方法もある。自分が撮った写真でも、写る人や作品について別の配慮が必要な場合があると覚えておこう。"]},"actionTitle":"見つけた場所より、使う条件を見る","actions":["作者や正規の配布元を確認する。","用途に合う利用条件や許可があるか、大人と読む。","分からなければ使わず、自作や条件の分かる素材を選ぶ。"],"reflect":"画像を保存できることは、アイコンに使ってよい証明になるかな？","key":"見られる・保存できることと、公開して使えることは別。","imageAlt":"本と写真やイラストを見比べ、作品には作った人の権利があることを親子で話している。","caption":"見られる・保存できることと、公開して使えることは別。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":6},{"label":"共有後に困ったら","title":"間違えた写真も、一人で抱えない","body":"送ってはいけない写真や、場所が分かる動画を共有してしまったら、追加の投稿を止め、すぐ信頼できる大人へ相談しよう。取り消しや削除、公開範囲の変更が使える場合もある。早く気づいて動くことは大切だけれど、相手のコピーまで必ず消えるとは言い切れないよ。状況を整理して一緒に対応しよう。","explanationTitle":"「消すために、もっと送る」はしない","body2":"相手が「この写真を消してほしければ別の写真を送って」と言ってきても、応じないでね。相手を説得するために会いに行ったり、お金を払ったりしない。怒られるのが心配でも、まず安全のために相談していい。保護者にすぐ話せなければ先生などへ。被害を受けた人を責めず、助けることを先に考えよう。","example":{"title":"場所の分かる写真を送ってしまった","paragraphs":["家の近くが分かる写真を知らない相手へ送ったあと、不安になった。どの相手へ何を送ったかを保護者に伝え、写真ややり取りを見せよう。位置情報の有無や背景なども、一緒に確認できるよ。","「もう全部終わりだ」と決めつけず、使ったサービスの窓口への相談、通報など、取れる対応を大人と考えよう。確認のために同じ写真を多くの友達へ送ると、さらに広がるので控えてね。"]},"actionTitle":"困ったときの行動を決めておこう","actions":["追加の写真やお金を送らず、やり取りをいったん止める。","誰へ何を送ったか、信頼できる大人へ伝える。","取り消しや通報など、必要な対応を大人と進める。"],"reflect":"共有を間違えたとき、「安全のことで相談したい」と言えそうな相手は誰かな？","key":"共有したあとでも、追加で応じず、すぐ相談していい。","imageAlt":"間違えた写真の共有に気づき、子どもが保護者と一緒に対処を考えている。","caption":"共有したあとでも、追加で応じず、すぐ相談していい。","image":"assets/lessons/chapter10-atlas.jpg","imagePanel":7,"check":{"prompt":"送った写真を消す代わりに、別の写真を求められた。どうする？","options":["一度だけ送れば必ず消してもらえる","追加で送らず、信頼できる大人に相談する","相手に会いに行って確かめる"],"answer":1,"explain":"一人で要求に応じず、安全を優先して相談しよう。間違えて送ったあとでも助けを求めていいよ。"}}],"questions":[{"id":"photo-01","tag":"背景","q":"新しい持ち物を玄関で撮った。送る前に見るところは？","options":["持ち物の色だけ","表札や宛名など、背景や写真の端まで","顔にだけスタンプを付けて終わり"],"answer":1,"why":"主役以外にも、家や学校が分かる情報が写ることがあるよ。","slide":0},{"id":"photo-02","tag":"匿名性","q":"顔をスタンプで隠した写真なら？","options":["必ず誰にも分からない","どんな背景でも公開してよい","制服や背景などから分かる場合もある"],"answer":2,"why":"顔以外の手がかりも組み合わせて見られることがあるよ。","slide":0},{"id":"photo-03","tag":"動画の点検","q":"動画を送る前に、どう確認する？","options":["最初から最後まで見て、音や反射も確認する","最初の一秒だけ見る","自分が映る場面だけ見ればよい"],"answer":0,"why":"一瞬の写り込みや、周りの会話にも情報が含まれるよ。","slide":1},{"id":"photo-04","tag":"反射と音","q":"演奏動画に家族の名前を呼ぶ声と郵便物の反射が入った。どうする？","options":["演奏がよければそのまま送る","撮り直しなど、情報が伝わらない方法を大人と考える","画面の明るさを変えれば必ず十分"],"answer":1,"why":"映像だけでなく、音や反射も見直そう。迷ったら共有を見送っていいよ。","slide":1},{"id":"photo-05","tag":"メタデータ","q":"写真の位置情報について、正しい説明は？","options":["写真には絶対に位置情報は入らない","どのサービスも必ず位置情報を残す","記録や共有のされ方は設定や送信方法によって異なる"],"answer":2,"why":"端末とサービスの説明を確認し、一律に判断しないでね。","slide":2},{"id":"photo-06","tag":"設定と背景","q":"写真の位置情報を取り除けば、背景の確認は不要？","options":["背景や投稿文から場所が分かることもあるので必要","位置情報を消せば必ず何も分からない","学校名が写っていても影響しない"],"answer":0,"why":"メタデータと、見える画像や文章の手がかりは別だよ。","slide":2},{"id":"photo-07","tag":"現在地","q":"「家族全員で旅行中。三日間留守」と全体公開したい。どうする？","options":["楽しい写真なら確認不要","外出予定まで公開する必要があるか、家族と相談する","家の写真がなければ留守の情報は伝わらない"],"answer":1,"why":"旅行先だけでなく、家を空けている予定も伝わる場合があるよ。","slide":3},{"id":"photo-08","tag":"投稿の時期","q":"外出後に投稿すれば、何でも安全？","options":["時間をずらせば内容の確認はいらない","毎週の行き先を全部書いても影響はない","行動のパターンなどが分かる場合があるので、内容も確かめる"],"answer":2,"why":"時期をずらすのは一つの工夫。相手や内容も合わせて見直そう。","slide":3},{"id":"photo-09","tag":"撮影と共有","q":"友達が「一緒に撮っていい」と言った。SNSへの投稿は？","options":["どこへ誰に見せるかも伝え、別に確認する","撮影した人が自由に決める","笑顔で写っていれば全体公開してよい"],"answer":0,"why":"撮影の許可と、共有・公開の許可は別だよ。","slide":4},{"id":"photo-10","tag":"相手の意思","q":"友達が写真の公開を嫌がっている。どうする？","options":["顔を隠せば反対でも載せてよい","公開せず、別の写真や方法を考える","先に載せてあとで確認する"],"answer":1,"why":"相手の意思を尊重しよう。顔を隠すだけで自由に使えるわけではないよ。","slide":4},{"id":"photo-11","tag":"限定共有","q":"一定時間で消える写真なら、必ず記録は残らない？","options":["必ずどこからも消える","保存ボタンがなければ絶対に残らない","別の端末で撮るなど、記録される可能性はある"],"answer":2,"why":"消える表示だけで、あらゆるコピーを防げるとは限らないよ。","slide":5},{"id":"photo-12","tag":"受け取る側","q":"少人数のグループで届いた友達の写真を、別のクラスへ送りたい。どうする？","options":["本人の意思を確認せず、勝手に転送しない","受け取ったので自由に送る","面白ければ確認不要"],"answer":0,"why":"受け取れることと、別の相手に見せてよいことは別だよ。","slide":5},{"id":"photo-13","tag":"作品の権利","q":"検索で見つけた絵をSNSアイコンに使いたい。どうする？","options":["検索に出たので自由に使う","作者や配布元の利用条件・許可を確認する","保存できれば必ず利用許可がある"],"answer":1,"why":"見られる画像にも、作者の権利や利用条件があるよ。","slide":6},{"id":"photo-14","tag":"許可と表示","q":"作者名を書けば、どんな画像でも自由に公開利用できる？","options":["名前さえ書けば必ずよい","色を変えれば許可は一切いらない","作者名を書くことと、利用の許可は別"],"answer":2,"why":"利用条件や認められる使い方を確認し、迷ったら大人へ相談しよう。","slide":6},{"id":"photo-15","tag":"共有ミス","q":"場所の分かる写真を間違えて送った。どうする？","options":["追加の共有を止め、誰へ何を送ったか大人へ相談する","確認のため全員へ同じ写真を送る","自分の画面だけ消して絶対に大丈夫だと決める"],"answer":0,"why":"情報を広げず、取り消しや相談などの対応を一緒に考えよう。","slide":7},{"id":"photo-16","tag":"重要：追加で送らない","q":"「写真を消す代わりに、別の写真やお金を送れ」と言われた。どうする？","options":["一度だけ要求に応じる","追加で送らず、すぐ信頼できる大人へ相談する","相手と会って自分だけで解決する"],"answer":1,"why":"要求に応じれば消える保証はない。失敗したあとでも相談していいよ。","slide":7,"critical":true}],"sources":[{"title":"個人情報保護委員会：取扱注意！みんなの大切な個人情報","url":"https://www.ppc.go.jp/news/kids/movie/kodomomuke_accessible/","note":"写真の写り込みと、位置情報などからの個人の特定。","checked":"2026-11-17"},{"title":"IPA：情報セキュリティ10大脅威2024 知っておきたい用語や仕組み","url":"https://www.ipa.go.jp/security/10threats/m42obm000000jlc5-att/yougoyashikumi_2024.pdf","note":"写真のExifと位置情報。サービスごとに扱いが異なるため説明の確認が必要。","checked":"2026-11-17"},{"title":"Apple：「写真」で位置情報メタデータを管理する","url":"https://support.apple.com/ja-jp/guide/personal-safety/ips0d7a5df82/web","note":"位置情報メタデータの記録・共有と設定の確認。","checked":"2026-11-17"},{"title":"文化庁：ここが知りたい著作権","url":"https://www.bunka.go.jp/seisaku/chosakuken/taisetsu/point/index.html","note":"ネット画像の無断利用、権利者の意思や利用条件の確認。","checked":"2026-11-17"},{"title":"e-Gov法令検索：著作権法","url":"https://laws.e-gov.go.jp/law/345AC0000000048","note":"作品の利用に関する法律。例外もあるため、教材では一律に違法と断定せず確認を促す。","checked":"2026-11-17"},{"title":"警察庁：サイバー事案に関する相談窓口","url":"https://www.npa.go.jp/bureau/cyber/soudan.html","note":"情報の悪用などで困ったとき、大人と一緒に相談できる窓口。","checked":"2026-11-17"}],"number":10}];

const lessons=activeChapter.lessons||[{"label":"はじめの一歩","title":"スマホで、何をしたい？","body":"家族に帰る時刻を伝える。分からない言葉を調べる。好きな曲の弾き方を練習する。スマホがあると、今まで誰かに頼んでいたことを、自分でできる場面が増えるよ。まずは「自分は何に使いたいのか」を考えてみよう。","body2":"「ギターのコードを一つ調べる」なら、調べ終わったところが一区切り。「何となく見る」だけだと、次の動画や通知が気になって、やめるきっかけを見失うことがある。楽しみのために使うのもいいけれど、始める前に目的と終わりを決めておこう。","key":"「何のために使うか」を、家族と話してみよう。","explanationTitle":"目的があると、終わりも決めやすい","example":{"title":"帰りが遅くなりそうな日","paragraphs":["部活が長引いて、いつもの帰宅時刻に間に合わなさそう。家族に「練習が延びた。これから帰るよ」と連絡できれば、待つ人も安心しやすいね。","連絡が終わったあと、関係のない動画をずっと見る必要はない。「今の用事は終わった」と気づいて、しまうところまでが一つの使い方だよ。"]},"actionTitle":"きみなら、何に使う？","actions":["「家族への連絡」「調べ物」「楽しみ」から、使いたい目的をそれぞれ一つ考える。","その用事が終わるタイミングも、一緒に考える。","困ったときに誰に聞くか、家族と話しておく。"],"reflect":"スマホがあったら便利になる場面を、一つ家族に説明してみよう。","image":"assets/lessons/01-purpose.jpg","imageAlt":"ギターをそばに置いた子どもが、スマホで調べたいことと使う目的を保護者に説明している。","caption":"「何をしたいか」が決まると、使い方も考えやすい。"},{"label":"持つことと、使ってよいこと","title":"自分のスマホでも、何でも自由？","body":"スマホを受け取ると、自分で押せるボタンがたくさん見つかる。でも、ボタンが押せることと、押してよいことは同じではないんだ。端末は自分のものでも、友達の写真、家族のお金、学校の決まりまで自分だけで決められるわけではないよ。","body2":"友達の写真を送れば、相手の顔や行動が他の人に伝わる。購入ボタンを押せば、お金の支払いにつながることがある。「自分の操作が、誰にどんな影響を与えるか」を一度考えることが、責任を持って使う第一歩だよ。","key":"自分の端末でも、他の人の権利と家族の約束を守ろう。","explanationTitle":"画面の向こうにも、相手がいる","example":{"title":"ゲームに「購入」のボタンが出たら","paragraphs":["欲しかったアイテムが見つかって、購入画面まで進めた。「買える状態だから、買ってもいい」と考えてよいかな？","家族が登録した支払い方法で、代金が請求されるかもしれない。金額が小さくても、先に決めた購入の約束を確認しよう。「これを買いたい。いくらかかるよ」と相談してから判断するんだ。"]},"actionTitle":"押す前に、3つを確認","actions":["自分以外の人の情報や、お金に関係していないか。","家族・学校・サービスのルールで、確認が必要な操作ではないか。","分からないときに、そのまま進めず質問できるか。"],"reflect":"「操作はできるけれど、先に相談したいこと」を一つ考えてみよう。","image":"assets/lessons/02-permission.jpg","imageAlt":"購入前のスマホを保護者に見せて相談する子ども。テーブルには財布と硬貨が置かれている。","caption":"購入画面に進めても、購入の許可があるとは限らない。"},{"label":"生活の中のスマホ","title":"楽しいことは、画面の外にも。","body":"動画もゲームも、友達とのやり取りも楽しいね。ただ、一日の時間には限りがある。スマホの時間が増えると、その分だけ寝る、食べる、学ぶ、体を動かす、家族と話す時間が少なくなることがあるんだ。どの時間も自分の生活をつくっているよ。","body2":"利用時間の数字だけでなく、生活の中で困ることが増えていないかも振り返ろう。「宿題を始めるのが遅くなった」「好きだった外遊びをしなくなった」などに気づいたら、使い方を調整する合図。我慢が足りないと責める前に、環境を変える方法を考えよう。","key":"気合いだけに任せず、やめやすい環境をつくろう。","explanationTitle":"「何分使ったか」と「何ができたか」","example":{"title":"宿題の途中で通知が気になる","paragraphs":["メッセージが来るたびに画面を開き、気づくと動画も見ていた。こんなとき、「絶対に見ないぞ」と思うだけでは難しいこともあるね。","勉強中は不要な通知を切り、スマホを家族と決めた置き場所へ。終わったら確認する時間をつくる。「やめる力」だけに頼らず、気になりにくい仕組みを使っていいんだよ。"]},"actionTitle":"画面の外の予定も入れよう","actions":["使う前に、終える時刻と、そのあとにすることを決める。","集中したい時間は、不要な通知と置き場所を見直す。","睡眠や楽しみにしていた活動が減っていないか、家族と振り返る。"],"reflect":"スマホ以外で、これからも大切にしたい楽しみは何かな？","image":"assets/lessons/03-balance.jpg","imageAlt":"スマホを充電かごに置き、バスケットボールを持って外へ向かう子ども。近くに本と食事がある。","caption":"スマホも、画面の外の楽しみも、どちらも大切に。"},{"label":"考えてみよう ①","title":"「あと1本」見たい夜。","body":"家族と決めた利用の終了時間になった。でも、「次の動画も面白そう」「ゲームの続きも気になる」と思うことはあるよね。楽しんでいる途中に切り替えるのは、簡単ではないこともある。そんなときの行動を、使い始める前から用意しておこう。","body2":"動画のおすすめや自動再生は、次の内容を続けて見られる仕組み。「おすすめがなくなったら終わる」では、区切りがつかないことがあるよ。決めた時間になったら閉じる、途中でも続きは次回にするなど、自分と家族で終わり方を決めよう。","key":"終わりを決めておくのは、自分の時間を守るため。","check":{"prompt":"決めた終了時間。どれを選ぶ？","options":["今日はここで終わり、続きは次の利用時間に見る","おすすめが出なくなるまで見続ける","家族に分からないように音を消して見る"],"answer":0,"explain":"おすすめは次々に出てくることがあるよ。自分で区切ろう。時間の約束を変えたいときは、隠して延ばさず、家族と相談してね。"},"explanationTitle":"おすすめに、終わりを任せない","example":{"title":"続きは明日の自分にまかせる","paragraphs":["たとえば、終了時刻の少し前にタイマーを鳴らしておく。「あと少しで終わる」と分かれば、新しい動画や長い対戦を始める前に立ち止まれるね。","時間になったら、気になる動画は後で見る一覧に入れてアプリを閉じ、決めた充電場所へ。「もう1本だけ」を何度も繰り返すより、次に楽しむ予定を残して終えよう。"],"note":"ここでの終了時刻やタイマーは工夫の例。家庭の生活に合わせて決めよう。"},"actionTitle":"終わるときの手順を決めよう","actions":["終わる少し前に気づけるよう、タイマーなどを使う。","決めた終了時間でアプリを閉じ、続きは次の利用時間にする。","学校の連絡などで例外が必要なら、隠して延ばさず家族に相談する。"],"reflect":"終了時間になったら、スマホをどこに置くと切り替えやすそう？","image":"assets/lessons/04-bedtime.jpg","imageAlt":"夜、スマホをリビングの充電台に置き、本を持って寝室へ向かう子ども。窓の外に月が見える。","caption":"続きは次の時間に。置く場所まで決めておこう。"},{"label":"考えてみよう ②","title":"友達の写真、送ってもいい？","body":"友達と撮った写真が、とてもいい感じに写っていた。「みんなにも見せたい」と思うのは自然だね。でも、その写真が他の人に届くと、友達の顔、服装、一緒にいた場所なども伝わる。自分がうれしくても、友達も同じ気持ちとは限らないよ。","body2":"一緒に撮影することを了承していても、クラス全員に送ることや、SNSに載せることまで了承したとは限らない。「どの写真を、誰に、どこで見せるのか」を伝えて確認しよう。返事がないときや、断られたときは、勝手に送らないことが大切だよ。","key":"自分の「いいね」の前に、相手の「いいよ」を確認。","check":{"prompt":"クラスのグループへ送る前に、どうする？","options":["グループなら外に出ないので、そのまま送る","写っている友達に、送る相手も伝えて確認する","自分が撮った写真なので、自分だけで決める"],"answer":1,"explain":"相手にも、写真を送ってほしくない理由があるかもしれないよ。断られたら送らない。送信先で保存・転送される可能性も考えよう。"},"explanationTitle":"撮影の「いいよ」と、共有の「いいよ」","example":{"title":"「これ、送ってもいい？」を具体的に","paragraphs":["「この写真を、クラスのグループに送ってもいい？」と聞いてみよう。相手が「家族にはいいけれど、クラスには送らないで」と言ったら、その範囲を守るんだ。","グループの中でも、画像が保存・転送される可能性はある。「送ったあとで消せば大丈夫」とは考えず、写っている人に確認してから共有しよう。"],"dialogue":[{"speaker":"きみ","text":"この写真、クラスのグループに送ってもいい？"},{"speaker":"友達","text":"その写真は送らないでほしいな。"},{"speaker":"きみ","text":"分かった。送らずに、自分で見るだけにするね。"}]},"actionTitle":"送信ボタンの前に","actions":["写っている人と、写真に含まれる情報を確かめる。","送る相手や公開する場所も伝えて、本人に確認する。","断られたら尊重する。名前を消すだけで解決したと決めつけない。"],"reflect":"自分が「送らないで」と言えることも大事。どんなふうに伝える？","image":"assets/lessons/05-photo-consent.jpg","imageAlt":"公園で撮った写真をスマホで見せ、友達と共有してよいか話し合う二人の子ども。","caption":"写真を撮る前と、他の人に送る前。それぞれ確認しよう。"},{"label":"判断に迷ったとき","title":"すぐ決めなくて、だいじょうぶ。","body":"「今だけ」「早く返事をして」「友達ならやってよ」。こう言われると、断りにくかったり、急いで決めたくなったりするね。でも、相手が急いでいるからといって、自分もすぐに応じなければならないわけではないよ。迷ったときには、決めるのを待っていいんだ。","body2":"安全かどうかを一人で全部見抜こうとしなくて大丈夫。何を求められているか、家族の約束に合っているか、自分や誰かが困らないかを確かめよう。「誰にも相談するな」と言われても、その要求に従う必要はない。信頼できる大人に話していいよ。","key":"止まる → 確かめる → 相談する。この順番を覚えよう。","explanationTitle":"分からないときに止まるのも、判断する力","example":{"title":"夜の返信を友達に求められたら","paragraphs":["家族と決めた利用時間のあとに、友達から「今すぐ返事して。友達でしょ」と言われたとする。友達を大切にすることと、いつでも返信することは別だよ。","「夜は見られないから、次に使える時間に返すね」と、普段から伝えておく方法もある。断っても何度も責められて困るときは、一人で抱えず保護者や先生に相談しよう。"]},"actionTitle":"迷ったら、この順番で","actions":["止まる：リンクを押す、送る、買うなどの操作や返事を急がない。","確かめる：相手の要求と、家族の約束や自分の気持ちを整理する。","相談する：保護者や先生など、信頼できる大人と一緒に考える。"],"reflect":"「少し待って」「大人に確認するね」。自分が使えそうな言い方を選ぼう。","image":"assets/lessons/06-pause-check.jpg","imageAlt":"急な通知が来たスマホをいったん置き、手のひらで待つ合図をして保護者に相談する子ども。","caption":"急がされても、いったん止まっていい。"},{"label":"考えてみよう ③","title":"約束を破ったあとでも、相談しよう。","body":"「約束を破ったことが分かったら怒られるかも」。失敗したあとほど、言い出しにくくなることがあるよね。でも、困りごとを隠したままだと、一人では止めにくい状況になることもある。どんなきっかけで起きたことでも、助けを求めていいんだよ。","body2":"知らない相手に写真を送ってしまい、「お金を払え」「もっと送れ」と要求されたとする。応じれば必ず終わるとは限らない。追加の写真やお金を送らず、すぐ信頼できる大人に相談しよう。相手に連絡を続けたり、言い返したりする必要はないよ。","key":"失敗したあとでも、助けを求めていい。","check":{"prompt":"相手から脅された。最初にどうする？","options":["誰にも言わず、お金を払って終わらせる","もっと写真を送れば許してくれるか試す","追加で送らず、すぐ信頼できる大人に相談する"],"answer":2,"explain":"脅している相手の要求に一人で応じないで。相談したこと自体を責めない、というのも家族で決めたい約束だよ。相談相手は保護者だけでなく先生などでもいい。"},"explanationTitle":"脅されたときは、一人で解決しない","example":{"title":"最初のひと言は、短くてもいい","paragraphs":["全部を上手に説明できなくても大丈夫。「怖いメッセージが来た。今、一緒に見てほしい」と伝えるだけでも、助けにつながるよ。","保護者にすぐ話せないときは、先生など別の信頼できる大人へ。「秘密にしろ」と言われていても、相談してよい。画面の扱い、ブロックや通報などの次の行動は、大人と一緒に考えよう。"],"dialogue":[{"speaker":"きみ","text":"約束を破ったあとに、怖いことが起きた。助けてほしい。"},{"speaker":"大人","text":"話してくれてありがとう。まず、今の安全を一緒に守ろう。"}]},"actionTitle":"困ったときの優先順位","actions":["追加の写真やお金を送らず、相手の要求に一人で応じない。","その場で信頼できる大人に相談し、一緒に状況を確認する。","家族は、相談したこと自体を罰しない。約束の振り返りは、安全を守ってから。"],"reflect":"保護者以外も含めて、助けを求められる大人を二人考えておこう。","image":"assets/lessons/07-ask-help.jpg","imageAlt":"困ったメッセージを保護者に見せる子ども。保護者は同じ目線で落ち着いて話を聞いている。","caption":"失敗したあとでも、話してくれてよかった。"},{"label":"第1章のまとめ","title":"ルールは、一緒につくって育てよう。","body":"スマホのルールは、子どもを困らせるためではなく、便利さを楽しみながら生活と安全を守るためのもの。使う目的、時間、置く場所、アプリやお金の扱い、困ったときの相談方法を、理由と一緒に家族で話し合おう。分からない約束は、そのままにせず質問していいよ。","body2":"子どもが利用時間を守るのと同じように、大人も「子どもの写真を勝手に公開しない」「相談を落ち着いて聞く」といった約束を守ろう。利用状況を何のために、どこまで確認するのかも先に説明してもらうと、お互いに納得して始めやすいね。","key":"きみだけの我慢ではなく、家族みんなの約束にしよう。","explanationTitle":"子どもにも、大人にも、守る約束がある","example":{"title":"使ってみたら、ルールが合わなくなった","paragraphs":["学校の連絡を確認したい時刻が、家族と決めた利用時間のあとだった。「隠れて使う」か「全部あきらめる」しか方法がないわけではないよ。","「この連絡の確認に困っている。ここだけ見られるようにできる？」と理由を伝えて相談しよう。例外をどう扱うか、いつ見直すかも、一緒に決め直していいんだ。"],"note":"教材の時間や置き場所は例。家族の生活に合わせて考えよう。"},"actionTitle":"家族と話して、確かめよう","actions":["子どもは、使う目的と困ったときの行動を自分の言葉で伝える。","大人からも、確認する範囲や相談を受けたときの約束を伝える。","「いつ見直すか」を決めておく。保存ボタンだけで、話し合いが終わるわけではない。"],"reflect":"きみが守る約束と、大人に守ってほしい約束を、一つずつ話してみよう。","image":"assets/lessons/08-family-agreement.jpg","imageAlt":"スマホを横に置き、時計や充電場所の絵がある家族の約束を、親子で一緒に指さして話し合っている。","caption":"理由を聞き合って、家族みんなの約束にしよう。"}];

const questions=activeChapter.questions||chapterOneQuestions;
function freshState(){return {version:CONTENT_VERSION,slide:0,learned:false,attempts:[],rules:null};}
function sanitizeState(raw,lessonCount=lessons.length){const clean=freshState();if(!raw||raw.version!==CONTENT_VERSION)return clean;clean.slide=Number.isInteger(raw.slide)?Math.max(0,Math.min(lessonCount-1,raw.slide)):0;clean.learned=raw.learned===true;clean.attempts=Array.isArray(raw.attempts)?raw.attempts.filter(a=>a&&Number.isInteger(a.correct)&&a.correct>=0&&a.correct<=10&&typeof a.passed==='boolean'&&typeof a.at==='string').slice(-20):[];if(raw.rules&&typeof raw.rules==='object'){const r=raw.rules;if(['30','60','90','120'].includes(r.minutes)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end)&&['living','hall','family'].includes(r.place)&&['parent','adult'].includes(r.help))clean.rules={minutes:r.minutes,end:r.end,place:r.place,help:r.help};}return clean;}
let storageOK=true;
function readStored(key){try{return JSON.parse(localStorage.getItem(key));}catch{storageOK=false;return null;}}
function load(){const loaded=sanitizeState(readStored(STORAGE_KEY));const shared=readStored(RULES_KEY);const legacy=readStored(chapterStorageKey(1));loaded.rules=sanitizeState({version:1,rules:shared||legacy?.rules||loaded.rules}).rules;return loaded;}
let state=load(), slideChoice=null, slideFeedback=null, exam=null, result=null;
const main=document.getElementById('main');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageOK=false;}}
function shuffle(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createExam(rng=Math.random){const selected=[questions.find(q=>q.critical)];for(let slide=0;slide<lessons.length;slide++){if(selected.some(q=>q.slide===slide))continue;selected.push(shuffle(questions.filter(q=>q.slide===slide),rng)[0]);}const ids=new Set(selected.map(q=>q.id));selected.push(...shuffle(questions.filter(q=>!ids.has(q.id)),rng).slice(0,10-selected.length));return shuffle(selected,rng).map(q=>{const options=shuffle(q.options.map((text,i)=>({text,original:i})),rng);return {...q,options:options.map(o=>o.text),answer:options.findIndex(o=>o.original===q.answer)};});}
function grade(items,answers){const correct=items.reduce((n,q,i)=>n+Number(answers[i]===q.answer),0);const criticalOK=items.every((q,i)=>!q.critical||answers[i]===q.answer);return {correct,total:items.length,criticalOK,passed:correct/items.length>=.9&&criticalOK};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;}
function progress(){document.getElementById('published-label').textContent=`第1〜${availableChapters.at(-1)}章 公開中`;const pct=state.learned?100:Math.round(state.slide/lessons.length*100);document.getElementById('side-percent').textContent=pct+'%';document.getElementById('side-track').style.width=pct+'%';document.getElementById('side-caption').textContent=state.learned?'学習完了。テストに挑戦しよう。':'自分のペースで、少しずつ。';}
function route(){const hash=location.hash;const match=hash.match(/^#\/learn\/(\d+)$/);if(match){const n=Number(match[1]);state.slide=Math.max(0,Math.min(n,state.learned?lessons.length-1:state.slide));save();slideChoice=null;slideFeedback=null;}const path=hash.replace(/^#\/?/,'').split('/')[0]||'home';const page=['home','learn','test','family','about','finish'].includes(path)?path:'home';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===page);if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('breadcrumb').textContent={home:'はじめの一歩',learn:`第${chapterNumber}章を学ぶ`,test:`第${chapterNumber}章の確認テスト`,family:'家族の約束',about:'保護者の方へ',finish:'全課程の最終確認'}[page];document.title=({home:'ホーム',learn:`第${chapterNumber}章 学習`,test:`第${chapterNumber}章 テスト`,family:'家族の約束',about:'保護者の方へ',finish:'全課程の最終確認'}[page])+'｜スマホ安全活用検定';({home:renderHome,learn:renderLearn,test:renderTest,family:renderFamily,about:renderAbout,finish:renderFinish}[page])();progress();if(!storageOK)main.insertAdjacentHTML('afterbegin','<p class="notice">このブラウザでは進み具合を保存できません。ページを閉じると記録が失われる場合があります。</p>');main.focus({preventScroll:true});window.scrollTo(0,0);}
function readChapterState(n){try{return sanitizeState(JSON.parse(localStorage.getItem(chapterStorageKey(n))),chapters.find(c=>c.number===n)?.lessons?.length||8);}catch{return freshState();}}
function renderHome(){const passedCount=availableChapters.filter(n=>(n===chapterNumber?state:readChapterState(n)).attempts.some(a=>a.passed)).length;main.innerHTML=`<section class="hero"><div><p class="eyebrow">LEARN TODAY. USE SMART TOMORROW.</p><h1>スマホと、<br>いい関係を。</h1><p class="lead">はじめてのスマホ。その前に、知っておこう。<br>自分も、友達も守れる使い方を、<br>ひとつずつ身につけよう。</p><div class="actions"><a class="btn" href="#/learn">${state.learned?'もう一度、学習する':state.slide?'学習のつづきへ':`第${chapterNumber}章をはじめる`} <span aria-hidden="true">→</span></a><a class="btn quiet" href="#/about">保護者の方へ ↗</a></div><p class="footnote">1章の目安 約15〜25分 / 途中で休んで、何度でも学習できます</p></div><img class="hero-image" src="${HERO}" alt="スマホの使い方について笑顔で話し合う親子と、盾を持つロボット。周りには本、バスケットボール、月のモチーフ。" width="1200" height="800"></section><section aria-labelledby="steps-title"><div class="section-title"><h2 id="steps-title">できるようになるまでの、3ステップ</h2></div><div class="steps"><article class="step"><span class="step-number">01 / LEARN</span><h3>イラストで学ぶ</h3><p>挿し絵と具体例を読み、<br>「こんなとき」を考えよう。</p></article><article class="step"><span class="step-number">02 / TRY</span><h3>テストで確かめる</h3><p>間違えてもだいじょうぶ。<br>解説を読んで、また挑戦。</p></article><article class="step"><span class="step-number">03 / TALK</span><h3>家族で話し合う</h3><p>わが家に合う使い方を、<br>一緒に決めていこう。</p></article></div></section><section aria-labelledby="chapter-title"><div class="section-title"><h2 id="chapter-title">学ぶ章を選ぼう</h2><span>${chapters.length===24?'全24章を公開中':'全24章を順次公開'}</span></div><div class="course-overview"><strong>公開中 ${chapters.length}章</strong><span>学習画面 ${chapters.length*8}項目 · 確認テスト合格 ${passedCount} / ${chapters.length}章</span><p>一度に全部進めなくていいよ。1章ずつ学んで、家族と話し合おう。</p><a class="btn secondary small" href="#/finish">修了状況と親子の最終確認 →</a></div><div class="chapter-grid">${availableChapters.map(n=>{const record=n===chapterNumber?state:readChapterState(n);const course=chapters.find(c=>c.number===n);const title=course.title;const done=record.attempts.some(a=>a.passed);return `<article class="chapter"><div class="chapter-inner"><div class="chapter-num">${String(n).padStart(2,'0')}</div><div class="chapter-copy"><span class="badge">${done?'✓ 確認テスト合格':record.learned?'✓ 学習完了':'公開中'}</span><h3>${esc(title)}</h3><p>${esc(course.description)}</p></div><a class="btn secondary small" href="?chapter=${n}#/learn">学習する →</a></div><div class="chapter-bottom"><span>8つの学習画面 / 3つの考える問題 / 確認テスト10問</span><a href="?chapter=${n}#/test">確認テストへ →</a></div></article>`;}).join('')}</div>${chapters.length<roadmap.length?`<details><summary>これから学ぶテーマを見る（残り${roadmap.length-chapters.length}章・準備中）</summary><ol class="roadmap">${roadmap.slice(chapters.length).map((t,i)=>`<li><span class="num">${String(i+chapters.length+1).padStart(2,'0')}</span>${t} <span class="subtle">· 準備中</span></li>`).join('')}</ol></details>`:''}</section><p class="footnote">現在は第1〜${availableChapters.at(-1)}章を公開しています。全24章の合格後は、親子の最終確認へ進もう。スマホを渡す最終判断は保護者が行います。</p>`;}
function chapterMenu(){return `<details class="chapter-picker"><summary>第${chapterNumber}章を学習中 · 別の章を選ぶ</summary><div class="chapter-links">${chapters.map(c=>`<a href="?chapter=${c.number}#/learn" ${c.number===chapterNumber?'aria-current="page"':''}><span>${String(c.number).padStart(2,'0')}</span>${esc(c.title)}</a>`).join('')}</div><p class="subtle">進み具合は章ごとに保存されます。</p></details>`;}
function chapterSources(){return chapters.filter(c=>c.sources?.length).map(c=>`<details class="chapter-sources"><summary>第${c.number}章 ${esc(c.title)} の参考資料</summary><ul class="source-list">${c.sources.map(source=>`<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} ↗</a><br>${esc(source.note)}<br><span class="subtle">確認日：${esc(source.checked)}</span></li>`).join('')}</ul></details>`).join('');}
function visual(lesson){const panel=lesson.imagePanel;const atlas=Number.isInteger(panel);return `<figure class="lesson-figure"><div class="illustration-frame ${atlas?'atlas-frame':''}"><img src="${esc(lesson.image)}" alt="${esc(lesson.imageAlt)}" ${atlas?`style="left:${-(panel%2)*100}%;top:${-Math.floor(panel/2)*100}%"`:'width="1200" height="675"'} decoding="async"></div><figcaption>${esc(lesson.caption)}</figcaption></figure>`;}
function renderExample(example){return `<section class="lesson-example" aria-labelledby="example-title"><p class="section-kicker">たとえば、こんな場面</p><h3 id="example-title">${esc(example.title)}</h3>${example.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${example.dialogue?`<div class="dialogue" aria-label="伝え方の例">${example.dialogue.map(line=>`<p class="dialogue-line"><strong>${esc(line.speaker)}</strong><span>「${esc(line.text)}」</span></p>`).join('')}</div>`:''}${example.note?`<p class="example-note">${esc(example.note)}</p>`:''}</section>`;}
function renderLearn(){
  const s=lessons[state.slide],check=s.check;
  main.innerHTML=`${chapterMenu()}<div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode}</p><h1>${chapterTitle}</h1><p class="subtle">説明 → 具体例 → やってみること。ひとつずつ、読んでみよう。</p></div><span class="page-count">${state.slide+1} / ${lessons.length}</span></div>
  <div class="slide-dots" role="img" aria-label="${lessons.length}画面中${state.slide+1}画面目">${lessons.map((_,i)=>`<span class="${i===state.slide?'current':i<state.slide?'done':''}"></span>`).join('')}</div>

    <div class="takeaway"><strong>POINT</strong><span>${esc(s.key)}</span></div>
  </article>
  ${check?`<section class="choice-box" aria-labelledby="check-title"><p class="eyebrow">ここまでの内容を、確かめよう</p><h3 id="check-title">${check.prompt}</h3><div class="options">${check.options.map((o,i)=>`<button class="option ${slideChoice===i?'chosen':''}" data-choice="${i}" aria-pressed="${slideChoice===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div id="lesson-feedback" role="status">${slideFeedback?`<div class="feedback ${slideFeedback.good?'good':''}"><strong>${slideFeedback.good?'その考え方でOK！':'もう一度、考えてみよう。'}</strong><p>${slideFeedback.text}</p></div>`:''}</div></section>`:''}
  <div class="lesson-controls"><button class="btn secondary" data-action="prev-slide" ${state.slide===0?'disabled':''}>← 前へ</button><span class="subtle">${check?'答えを選ぶと進めるよ':'読み終わったら、次へ'}</span><button class="btn" data-action="next-slide" ${check&&(!slideFeedback||!slideFeedback.good)?'disabled':''}>${state.slide===lessons.length-1?'学習を終えて、テストへ':'次へ →'}</button></div><div class="bottom-links"><a href="#/">ホームへ戻る</a><a href="#/about">参考資料を見る</a></div>`;
}
function renderTest(){if(!state.learned){main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>まずは、お話を読んでみよう。</h1><div class="panel"><p>テストは、第${chapterNumber}章の${lessons.length}つの画面と、途中の考える問題を終えると受けられるよ。</p><p class="subtle">急がなくてだいじょうぶ。前の画面にも戻れるよ。</p><a class="btn" href="#/learn">学習${state.slide?'のつづき':'をはじめる'} →</a></div></div>`;return;}if(result){renderResult();return;}if(exam){renderQuestion();return;}const last=state.attempts.at(-1);main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>「わかった」を、確かめよう。</h1><p class="subtle">第${chapterNumber}章「${chapterTitle}」確認テスト</p><div class="panel"><span class="badge">✓ 学習完了</span><div class="exam-stats"><div class="stat"><strong>10問</strong>選択式の場面問題</div><div class="stat"><strong>90点以上</strong>合格の目安</div><div class="stat"><strong>何度でも</strong>時間制限なし</div></div><ul class="check-list"><li>合格には、10問中9問以上の正解が必要。</li><li>安全な行動を選ぶ重要問題は、必ず正解しよう。</li><li>答えを選んだあと、最後にまとめて採点するよ。</li><li>間違えた問題は、解説とお話を見て学び直せるよ。</li></ul><p class="subtle">8つの学習項目すべてから出題します。問題と選択肢の順番は、受けるたびに変わります。途中の回答はページを再読み込みすると失われます。</p>${button('テストをはじめる →','start-exam')}<div class="bottom-links"><a href="#/learn">学習を読み返す</a></div></div>${last?`<p class="subtle">前回の結果：${last.correct*10}点 · ${last.passed?`第${chapterNumber}章 合格`:'学び直して、もう一度挑戦しよう'}</p>`:''}</div>`;}
function renderQuestion(){const q=exam.items[exam.index];main.innerHTML=`<div class="narrow"><div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>第${chapterNumber}章 確認テスト</h1></div><span class="page-count">${exam.index+1} / 10 問</span></div><div class="track"><span style="width:${(exam.index+1)*10}%"></span></div><section class="panel" aria-labelledby="question-title"><p class="question-meta">Q${String(exam.index+1).padStart(2,'0')} / ${q.tag}</p><h2 class="question-title" id="question-title">${q.q}</h2><div class="options" role="group" aria-label="答えを1つ選んでください">${q.options.map((o,i)=>`<button class="option ${exam.answers[exam.index]===i?'chosen':''}" data-answer="${i}" aria-pressed="${exam.answers[exam.index]===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div class="exam-nav"><button class="btn secondary" data-action="prev-question" ${exam.index===0?'disabled':''}>← 前の問題</button><button class="btn" data-action="next-question" ${exam.answers[exam.index]===undefined?'disabled':''}>${exam.index===9?'採点する':'次の問題 →'}</button></div></section><p class="subtle">選んだ答えは、採点するまで変更できます。回答済み ${exam.answers.filter(x=>x!==undefined).length} / 10問</p><button class="btn quiet small" data-action="exit-exam">テストを中断する</button></div>`;}
function renderResult(){const r=result;main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / RESULT</p><section class="panel"><div class="results-score"><span class="result-icon" aria-hidden="true">${r.passed?'✦':'▤'}</span><h1>${r.passed?`第${chapterNumber}章、合格！`:'もう一度、確かめてみよう。'}</h1><div class="score">${r.correct*10}<small> / 100点</small></div><p class="subtle">${r.correct} / ${r.total}問正解 · 重要問題 ${r.criticalOK?'正解':'学び直そう'}</p></div><div class="callout">${r.passed?'安全に使うための、はじめの一歩ができたね。<br>次は家族と、わが家の約束を話し合おう。':'間違いは、気づくチャンス。下の解説を読んで、お話に戻ってみよう。<br>合格は90点以上、かつ重要問題の正解が条件だよ。'}</div><div class="actions">${r.passed?'<a class="btn" href="#/family">家族の約束を話し合う →</a>':''}${r.passed&&availableChapters.includes(chapterNumber+1)?`<a class="btn secondary" href="?chapter=${chapterNumber+1}#/learn">第${chapterNumber+1}章へ →</a>`:''}${r.passed?'<a class="btn secondary" href="#/finish">全課程の修了状況を見る →</a>':''}${button('もう一度テストする','start-exam',r.passed?'secondary':'')}<a class="btn secondary" href="#/learn">学習に戻る</a></div><p class="footnote">第${chapterNumber}章のみの合格です。全課程の修了状況は、親子の最終確認画面で確認できます。スマホを渡す判断は保護者と話し合ってね。</p></section><h2>答えと解説</h2><div class="panel">${r.items.map((q,i)=>{const ok=r.answers[i]===q.answer;return `<article class="review-item"><p class="${ok?'status-good':'status-miss'}">${ok?'✓ 正解':'↻ 学び直し'} · Q${i+1}${q.critical?' · 重要問題':''}</p><h3>${q.q}</h3><p>あなたの答え：${esc(q.options[r.answers[i]])}</p>${!ok?`<p class="status-good">正解：${q.options[q.answer]}</p>`:''}<p>${q.why}</p><a class="subtle" href="#/learn/${q.slide}">学習画面 ${q.slide+1} に戻る →</a></article>`;}).join('')}</div><a href="#/" class="subtle">ホームへ戻る</a></div>`;}
function renderFamily(){const shared=readStored(RULES_KEY);if(shared)state.rules=sanitizeState({version:1,rules:shared}).rules;const r=state.rules||{minutes:'60',end:'20:30',place:'living',help:'parent'};const places={living:'リビングで充電する',hall:'廊下など、寝室以外で充電する',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow">FAMILY TALK</p><h1>わが家の約束を、話そう。</h1><p>子どもだけでなく、大人にも守る約束がある。<br>理由を聞き合いながら、一緒に決めてみよう。</p><div class="callout">これは話し合うための下書きです。表示されている時間は例で、すべての家庭への推奨値ではありません。</div><form id="rules-form" class="panel"><h2>まずは、4つから。</h2><div class="form-grid"><label class="field">娯楽で使う1日の時間の目安<select name="minutes">${['30','60','90','120'].map(n=>`<option value="${n}" ${r.minutes===n?'selected':''}>${n}分</option>`).join('')}</select></label><label class="field">夜に利用を終える時刻<input type="time" name="end" value="${r.end}" required></label><label class="field">夜、スマホを置く場所<select name="place">${Object.entries(places).map(([v,t])=>`<option value="${v}" ${r.place===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">困ったときの相談先<select name="help"><option value="parent" ${r.help==='parent'?'selected':''}>保護者。話せないときは先生など</option><option value="adult" ${r.help==='adult'?'selected':''}>先生など、信頼できる大人</option></select></label></div><p class="subtle" style="margin-top:20px">緊急連絡や学校の連絡など、例外が必要な場合も話し合おう。課金・アプリ追加・写真の共有・外出時の約束も、各章で学んだことを使って話し合おう。</p><button class="btn" type="submit">この端末に下書きを保存</button><p id="rules-status" role="status" class="subtle" style="margin:12px 0 0">${state.rules?'下書きが保存されています。':''}</p></form><section class="panel"><h2>大人からの約束</h2><ul class="check-list"><li>困ったことを相談した、そのこと自体は罰しません。</li><li>まず安全を守り、ルールの振り返りは落ち着いてから。</li><li>子どもの写真を投稿するときも、本人に確認します。</li><li>使い方を確認する範囲は、先に説明します。</li><li>家族の生活や成長に合わせて、一緒に見直します。</li></ul><p class="subtle">この画面の保存だけで、保護者の承認やスマホの設定が完了するわけではありません。実際に親子で話し合って確認してください。</p></section><div class="bottom-links"><a href="#/finish">全課程の修了状況と、親子の最終確認へ →</a></div><p class="footnote">保存先は、このブラウザの中だけです。保護者への自動送信・端末間同期はありません。</p></div>`;document.getElementById('rules-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.rules={minutes:f.get('minutes'),end:f.get('end'),place:f.get('place'),help:f.get('help')};try{localStorage.setItem(RULES_KEY,JSON.stringify(state.rules));}catch{storageOK=false;}save();document.getElementById('rules-status').textContent=storageOK?'下書きを保存しました。家族と話し合って、必要なら変更しよう。':'保存できませんでした。このブラウザの保存設定を確認してください。';});}
function renderAbout(){main.innerHTML=`<div class="narrow"><p class="eyebrow">FOR PARENTS</p><h1>「使わない」より、<br>安全に使う力を。</h1><p>スマホを受け取る前に、親子で学ぶための教材です。現在は、第1〜${availableChapters.at(-1)}章を公開しています。各章の学習とテストは独立して進められます。</p><section class="panel"><h2>今回、確認できること</h2><ul class="check-list"><li>各項目に挿し絵・理由・具体例・行動例を付けた各章8画面と、途中の3つの判断練習。</li><li>各章16問の問題バンクから、重要問題を含む10問を出題。</li><li>問題・選択肢の並べ替え、採点、全問の解説、再受験。</li><li>家族の約束の下書きと、学習進度のブラウザ内保存。</li></ul><p class="subtle">合格条件は90点以上、かつ各章の重要問題への正答です。全24章に合格し、家族の約束を保存して親子の最終確認を終えると、このブラウザに学習の修了記録を残せます。</p></section><section class="panel"><h2>親子で使うときに</h2><p>点数だけで判断せず、「なぜその答えを選んだか」「実際に困ったとき、誰にどう話すか」も確かめてください。学習と家庭内ルールに加え、端末の安全設定も必要です。</p><p>ルール違反の振り返りと、被害相談への対応は分けます。まずは安全の確保を優先し、相談したこと自体を罰しない関係をつくることを、この教材では大切にしています。</p><p class="subtle">保護者向けの画面に認証はありません。子どもも閲覧できます。これは監視アプリや利用制限アプリではなく、学習用のサイトです。</p></section><section class="panel"><h2>参考にした一次情報</h2><p class="subtle">各章の教材設計で参照。家庭での約束例や合格基準は、本サイト独自の提案です。確認日：2026年11月17日。</p><ul class="source-list"><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/leaflet/" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発リーフレット集 ↗</a><br>家庭のルール、安全設定、ネットでのトラブルについて。</li><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/internet_use_keihatu" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発コンテンツ ↗</a><br>親子のルールづくりと、安全に利用するための教材。</li><li><a href="https://www.npa.go.jp/bureau/cyber/countermeasures/defamation.html" target="_blank" rel="noopener noreferrer">警察庁：インターネット上の誹謗中傷等への対応 ↗</a><br>写真や個人情報を安易に掲載しないなどの被害防止策。</li><li><a href="https://www.nic.ad.jp/ja/basics/beginners/dns.html" target="_blank" rel="noopener noreferrer">JPNIC：DNSとは ↗</a><br>第2章：ドメイン名とIPアドレスの関係。</li><li><a href="https://developer.mozilla.org/ja/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works" target="_blank" rel="noopener noreferrer">MDN：ウェブのしくみ ↗</a><br>第2章：クライアント・サーバー、通信とパケット。</li></ul>${chapterSources()}</section><section class="panel"><h2>記録とプライバシー</h2><p>本サイトには、名前・メールアドレス・本物のパスワードを入力する欄はありません。学習進度、章ごとの直近20回の点数、家族ルールの下書きと親子の最終確認・修了記録は、このブラウザのlocalStorageに保存します。</p><p>本サイトのコードから学習記録を外部へ送信する機能や、アクセス解析、広告は入れていません。配信基盤のGitHub Pagesでは、通信に伴う情報が処理されます。別の端末との同期はなく、ブラウザのデータを消すと記録も消えます。</p><p class="subtle">イラストは生成AIで制作した教材用の画像です。実在する親子の写真ではありません。</p><button class="btn secondary small" data-action="reset">この章の学習記録をリセット</button><p id="reset-status" role="status" class="subtle"></p></section><div class="bottom-links"><a href="https://github.com/inamuu/smartphone-safe-use-cert" target="_blank" rel="noopener noreferrer">ソースコード ↗</a><a href="https://inamuu.github.io/links/">inamuu links ↗</a><a href="#/">ホームへ</a></div></div>`;}

const COMPLETION_KEY='smartphone-safe-use-cert:completion:v1';
const finalChecks=[
 ['purpose','何のためにスマホを使うか、自分の言葉で説明した。'],
 ['time','使う時間・終える時刻・置き場所と、緊急連絡などの例外を家族と決めた。'],
 ['apps','アプリ追加・年齢条件・課金や定期購入は、先に保護者と確認すると話した。'],
 ['account','端末ロック・固有のパスワード・追加の認証・復元方法を、家族と確認した。'],
 ['privacy','写真や個人情報を送る前の確認を、具体例で説明した。'],
 ['people','嫌な要求は断ってよく、友達や知らない相手へ秘密や認証コードを渡さないと確認した。'],
 ['information','うわさ・広告・AIの答えを、そのまま信じたり広めたりしない方法を説明した。'],
 ['rights','他人のアカウント・写真・作品・気持ちを大切にする理由を話した。'],
 ['health','睡眠や運動を守り、歩行中・自転車の運転中など危ない場面では使わないと確認した。'],
 ['help','困ったら追加の操作や支払いを止め、相談する大人を複数決めた。'],
 ['parents','大人も、相談したこと自体を罰せず、確認する範囲を先に説明すると約束した。'],
 ['review','実際の端末の安全設定を親子で確認し、ルールを見直す時期を決めた。']
];
function sanitizeCompletion(raw){const clean={version:1,checked:[],completedAt:null};if(!raw||raw.version!==1)return clean;const ids=finalChecks.map(([id])=>id);clean.checked=Array.isArray(raw.checked)?[...new Set(raw.checked.filter(id=>ids.includes(id)))]:[];if(clean.checked.length===ids.length&&typeof raw.completedAt==='string'&&Number.isFinite(Date.parse(raw.completedAt)))clean.completedAt=raw.completedAt;return clean;}
let completion=sanitizeCompletion(readStored(COMPLETION_KEY));
function saveCompletion(){try{localStorage.setItem(COMPLETION_KEY,JSON.stringify(completion));return true;}catch{storageOK=false;return false;}}
function courseStatus(){const records=roadmap.map((title,index)=>{const number=index+1;const published=availableChapters.includes(number);const record=number===chapterNumber?state:readChapterState(number);return {number,title,published,learned:published&&record.learned,passed:published&&record.learned&&record.attempts.some(a=>a.passed&&a.correct>=9)};});const passed=records.filter(c=>c.passed).length;return {records,passed,complete:chapters.length===roadmap.length&&passed===roadmap.length};}
function currentRules(){const raw=readStored(RULES_KEY)||readStored(chapterStorageKey(1))?.rules||state.rules;return sanitizeState({version:1,rules:raw}).rules;}
function canComplete(){return courseStatus().complete&&!!currentRules()&&completion.checked.length===finalChecks.length;}
function completeCourse(){if(!canComplete())return false;completion.completedAt=new Date().toISOString();const saved=saveCompletion();renderFinish();if(!saved)document.getElementById('finish-status').textContent='この画面の修了記録は作れましたが、ブラウザに保存できませんでした。ページを閉じると失われます。';main.focus({preventScroll:true});window.scrollTo(0,0);return saved;}
function renderFinish(){const status=courseStatus(),rules=currentRules();const eligible=status.complete&&!!rules;const recorded=eligible&&completion.checked.length===finalChecks.length&&!!completion.completedAt;const places={living:'リビングで充電',hall:'廊下など寝室以外で充電',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow no-print">FINISH / FAMILY REVIEW</p><h1 class="no-print">学んだことを、わが家の力に。</h1><p class="no-print">24章を少しずつ学んで、全部の章別テストに合格したら、最後に親子で話し合おう。点数だけでなく、実際にどう行動するかを確かめる時間だよ。</p><div class="panel no-print"><h2>章別テストの合格 ${status.passed} / 24章</h2><div class="track"><span style="width:${Math.round(status.passed/24*100)}%"></span></div><p class="subtle">各章10問中9問以上、かつ重要問題への正答が合格条件。何度でも学び直せます。</p>${status.complete?'<p class="status-good">すべての章別テストに合格しました。</p>':'<p>まだ合格していない章は、下の一覧から学ぼう。</p>'}<div class="completion-grid">${status.records.map(c=>`<div class="completion-row"><span class="${c.passed?'status-good':'subtle'}">${c.passed?'✓':String(c.number).padStart(2,'0')}</span>${c.published?`<a href="?chapter=${c.number}#/${c.learned?'test':'learn'}">${esc(c.title)}</a>`:`<span>${esc(c.title)}</span>`}<small>${c.passed?'合格':!c.published?'準備中':c.learned?'テストへ':'学習へ'}</small></div>`).join('')}</div></div><section class="panel no-print"><h2>わが家の約束を確認</h2>${rules?`<p>娯楽の目安：1日${esc(rules.minutes)}分 / 夜の終了：${esc(rules.end)}<br>${esc(places[rules.place])}<br>相談先：${rules.help==='parent'?'保護者。話せないときは先生など':'先生など信頼できる大人'}</p>`:'<p>家族の約束の下書きは、まだ保存されていません。先に家族と話して保存しよう。</p>'}<a href="#/family">家族の約束を見直す →</a><p class="subtle">この4項目だけでなく、アプリ・課金・共有・端末の安全設定も、以下で確認しよう。</p></section><section class="panel completion-checklist no-print"><h2>親子で確認する12のこと</h2><p>子どもが理由や行動例を話し、大人も自分の約束を確認します。入力欄に秘密を打ったり、危険な操作を試したりする必要はありません。</p>${finalChecks.map(([id,label])=>`<label class="finish-check"><input type="checkbox" data-finish-check="${id}" ${completion.checked.includes(id)?'checked':''}><span>${esc(label)}</span></label>`).join('')}<p class="notice">このチェックは保護者認証ではありません。親子で同じ画面を見て話し合ってください。スマホを渡す判断と、実際の端末設定は保護者が行います。</p><button id="complete-course" class="btn" data-action="complete-course" ${canComplete()?'':'disabled'}>親子で確認して、修了の記録を残す</button><p id="finish-status" class="subtle" role="status">${!status.complete?'全24章の合格が必要です。':!rules?'家族の約束を先に保存しよう。':!canComplete()?'12項目を話し合って確認しよう。':'修了の記録を残せます。'}</p></section>${recorded?`<article id="completion-certificate" class="certificate"><span class="badge">全24章 章別確認テスト合格</span><h2>スマホ安全活用検定<br>学習の修了記録</h2><p>192項目を学び、全24章の確認テストに合格しました。<br>家族の約束と、親子の最終確認を記録しました。</p><p class="certificate-date">記録日：${esc(new Date(completion.completedAt).toLocaleDateString('ja-JP'))}</p><p>困ったら止まって相談する。<br>自分も、周りの人も大切にしながら使おう。</p><p class="footnote">このブラウザ内の学習・自己確認の記録です。公的資格、本人確認、保護者による利用許可を証明するものではありません。</p></article><div class="no-print actions"><button id="print-completion" class="btn secondary" data-action="print-completion">修了の記録を印刷する</button></div>`:''}<p class="footnote no-print">最終確認と修了記録も、このブラウザに保存します。名前の入力や保護者への自動送信はありません。別の端末では引き継がれません。章の記録をリセットすると、再合格するまで修了の記録は表示されません。</p><div class="bottom-links no-print"><a href="#/">章の一覧へ</a><a href="#/about">保護者の方へ・参考資料</a></div></div>`;}
main.addEventListener('change',e=>{const id=e.target.dataset?.finishCheck;if(!finalChecks.some(([key])=>key===id))return;completion.checked=e.target.checked?[...new Set([...completion.checked,id])]:completion.checked.filter(key=>key!==id);completion.completedAt=null;saveCompletion();const certificate=document.getElementById('completion-certificate');if(certificate)certificate.hidden=true;const printButton=document.getElementById('print-completion');if(printButton)printButton.disabled=true;document.getElementById('complete-course').disabled=!canComplete();document.getElementById('finish-status').textContent=!storageOK?'保存できませんでした。ブラウザの保存設定を確認してください。':canComplete()?'修了の記録を残せます。':'全24章の合格、家族の約束の保存、12項目の確認が必要です。';});
main.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const check=lessons[state.slide].check;slideChoice=Number(choice.dataset.choice);const good=slideChoice===check.answer;slideFeedback={good,text:check.explain};renderLearn();main.querySelector(`[data-choice="${slideChoice}"]`).focus({preventScroll:true});return;}const answer=e.target.closest('[data-answer]');if(answer&&exam){exam.answers[exam.index]=Number(answer.dataset.answer);renderQuestion();main.querySelector(`[data-answer="${answer.dataset.answer}"]`).focus({preventScroll:true});return;}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'complete-course':completeCourse();break;case'print-completion':if(canComplete()&&completion.completedAt)window.print();break;case'prev-slide':if(state.slide>0){state.slide--;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'next-slide':if(lessons[state.slide].check&&!slideFeedback?.good)return;if(state.slide===lessons.length-1){state.learned=true;save();exam=null;result=null;location.hash='/test';}else{state.slide++;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'start-exam':if(!state.learned)return;exam={items:createExam(),answers:[],index:0};result=null;renderQuestion();main.focus();window.scrollTo(0,0);break;case'prev-question':if(exam&&exam.index>0){exam.index--;renderQuestion();main.focus();window.scrollTo(0,0);}break;case'next-question':if(!exam||exam.answers[exam.index]===undefined)return;if(exam.index<9){exam.index++;renderQuestion();}else{result={...grade(exam.items,exam.answers),items:exam.items,answers:[...exam.answers]};state.attempts.push({correct:result.correct,passed:result.passed,at:new Date().toISOString()});state.attempts=state.attempts.slice(-20);save();exam=null;renderResult();}main.focus();window.scrollTo(0,0);break;case'exit-exam':if(confirm('テストを中断しますか？ 途中の回答は消えます。学習の進み具合は残ります。')){exam=null;renderTest();main.focus();}break;case'reset':if(confirm('この章の学習の進み具合とテスト結果をリセットしますか？ 家族の約束と他の章の記録は残ります。')){const rules=state.rules;state=freshState();state.rules=rules;exam=null;result=null;slideChoice=null;slideFeedback=null;save();progress();document.getElementById('reset-status').textContent=storageOK?'学習記録をリセットしました。':'保存領域を更新できませんでした。ブラウザのサイトデータ設定から削除してください。';}break;}});
window.addEventListener('hashchange',route);
route();
</script>
