/* Expanded lessons: illustration, reasons, examples, and actionable reading sections. */
.slide-content{align-items:start;min-height:0;grid-template-columns:1.05fr 1fr}

const chapters=[{"number":1,"title":"スマホを持つ目的と責任","description":"便利さを楽しむための、はじめの約束。"},{"lessons":[{"label":"つながりの全体像","title":"インターネットは、ネットワーク同士のつながり","body":"家のスマホや学校のパソコンは、近くの機器とつながるだけでなく、通信会社などのネットワークを通して遠くのコンピュータとも情報をやり取りできる。このように、たくさんのネットワークがつながった全体をインターネットというよ。どこか一つの会社が持つ巨大な箱、というわけではないんだ。","explanationTitle":"画面の向こうにも、機器と人がいる","body2":"検索した結果も動画も、スマホの中から何でも生まれてくるわけではない。遠くのコンピュータから届く情報も多いんだ。便利さの裏側では、通信する道や、情報を届ける機器を動かす人が支えている。だから、相手側の故障で使えなくなることもあるよ。","example":{"title":"離れた場所の情報に会いに行く","paragraphs":["家で図書館の開館時間を調べるとき、スマホは図書館の情報を届けるコンピュータなどと通信する。図書館まで歩かなくても情報を受け取れるのは、ネットワークがつながっているからだよ。","画面に表示された情報にも、作った人や届ける仕組みがある。「インターネットにあるから正しい」とは限らないことも、これから学んでいこう。"]},"actionTitle":"つながりを身近な例で考えよう","actions":["家でネットを使う機器を二つ思い浮かべる。","その機器で、遠くから受け取っている情報を一つ考える。","情報を届ける側にも機器や人がいると覚えておく。"],"reflect":"今日見た天気予報は、スマホの中だけで作られた情報かな？","key":"ネットの向こうには、情報を届ける機器と人がいる。","image":"assets/lessons/201-network.jpg","imageAlt":"家・学校・図書館の模型がつながった世界を、子どもとロボットが眺めている。","caption":"ネットの向こうには、情報を届ける機器と人がいる。"},{"label":"接続の入口","title":"Wi-Fiとインターネットは、同じもの？","body":"Wi-Fi（ワイファイ）は、近くの機器を無線でつなぐための仕組み。家ではスマホがWi-Fiルーターにつながり、その先の回線を通してインターネットを使うことが多いよ。一方、モバイル通信では携帯電話会社の基地局などを通してつながる。入口が違っても、同じWebサイトを開けるんだ。","explanationTitle":"Wi-Fiのマークだけでは判断できない","body2":"スマホとルーターがつながっていても、家の回線に問題があれば外のサイトを見られないことがある。Wi-Fiのマークは「インターネットが必ず使える」という保証ではないよ。また、知らないWi-Fiに勝手につながず、利用する接続先は家族と確認しよう。","example":{"title":"家のWi-Fiにはつながるのに、動画が止まる","paragraphs":["スマホにはWi-Fiのマークが出ている。でも家の回線が止まっていたら、ルーターまではつながっていても、その先へ情報を届けられないことがある。","Wi-Fiを切るとモバイル通信へ切り替わる設定の場合は、データ使用量が増えることもある。「見られたから直った」と決めず、どちらで通信しているか大人と確かめよう。"]},"actionTitle":"入口を確かめる練習","actions":["家族と一緒に、今の接続がWi-Fiかモバイル通信かを見る。","自宅で使ってよいWi-Fiの名前を確認する。","つながらないときは、知らない接続先を試す前に相談する。"],"reflect":"Wi-Fiのマークが出ているのに、Webサイトが開かないことはあるかな？","key":"Wi-Fiは接続の入口。インターネット全体とは別のもの。","image":"assets/lessons/202-network.jpg","imageAlt":"家のルーターと外の携帯電話の基地局を、親子が見比べている。","caption":"Wi-Fiは接続の入口。インターネット全体とは別のもの。","check":{"prompt":"Wi-Fiのマークが出ているのに、サイトが開かない。どう考える？","options":["マークがあるので、絶対にネットは使える","Wi-Fiの先の回線などに問題がある可能性もある","知らないWi-Fiへ片っ端からつなぐ"],"answer":1,"explain":"Wi-Fiとスマホがつながっていても、その先の回線などに問題があることがあるよ。家族と確認しよう。"}},{"label":"お願いと返事","title":"サイトを見るときも、情報を送っている","body":"天気のページを開くと、スマホは相手のコンピュータに「この情報を見せて」とお願いし、相手は表示に必要なデータを返す。お願いする側をクライアント、情報や機能を提供する側をサーバーというよ。難しい名前より、お願いと返事のやり取りを想像できれば大丈夫。","explanationTitle":"見るだけでも、通信は起きる","body2":"何も投稿しなくても、ページを開くためのお願いは送られる。通信相手には、接続元のIPアドレスなど、通信に必要な情報が伝わる。サイトによっては利用状況を記録することもあるよ。「見るだけなら、自分に関する情報は一切伝わらない」とは考えないでね。","example":{"title":"動画の再生ボタンを押したら","paragraphs":["再生を押すと、動画を届けるサーバーに必要なデータをお願いし、受け取ったデータをスマホが映像や音にする。再生中も少しずつデータを受け取ることがあるよ。","サーバーが混雑したり、通信が遅かったりすると、待ち時間が長くなる。ボタンを何十回も押す前に、一度待って様子を見よう。"]},"actionTitle":"お願いと返事を説明してみよう","actions":["ページを開く操作を「お願いを送る」と言い換えてみる。","画面に届く情報を「相手からの返事」と考える。","見るだけでも通信相手に伝わる情報があると覚える。"],"reflect":"動画が届く前に、スマホから何かお願いを送っているかな？","key":"「見る」操作にも、送る情報と受け取る情報がある。","image":"assets/lessons/203-network.jpg","imageAlt":"サーバーを守る図書館員のようなロボットに、子どもが本をお願いして受け取っている。","caption":"「見る」操作にも、送る情報と受け取る情報がある。"},{"label":"宛先を見つける","title":"名前から、通信する宛先を調べる","body":"人は「example.com」のようなドメイン名を使うけれど、通信ではIPアドレスという宛先の番号を使う。ドメイン名に対応するIPアドレスを調べる仕組みがDNS（ディーエヌエス）。人が使いやすい名前と、通信に使う宛先を結びつける住所録のような役割だよ。","explanationTitle":"住所録のたとえにも、限りがある","body2":"IPアドレスは人の名前や自宅の住所そのものではない。変わる場合も、複数の人が外向きの同じIPアドレスを使う場合もある。「IPアドレスだけで、必ずその人の名前や部屋まで分かる」というものではないよ。今は、通信の宛先に使う情報だと覚えよう。","example":{"title":"お店の名前から、行き先を探す","paragraphs":["初めて行くお店なら、名前を手がかりに住所を調べるね。DNSもそれに少し似ていて、ドメイン名を手がかりに通信先を調べる。実際の仕組みでは、いくつものサーバーが協力しているよ。","ただし、宛先が見つかったことは「そのサイトの内容が正しい」「安心して買い物できる」という証明ではない。行き先が分かることと、安全を確かめることは別なんだ。"]},"actionTitle":"用語は役割で覚えよう","actions":["ドメイン名は、人が使いやすい名前だと覚える。","IPアドレスは、通信の宛先に使う情報だと覚える。","DNSは、その対応を調べる仕組みだと説明してみる。"],"reflect":"住所が調べられたお店は、それだけで必ず信用できるかな？","key":"DNSは名前とIPアドレスの対応を調べる仕組み。安全の保証ではない。","image":"assets/lessons/204-network.jpg","imageAlt":"子どもとロボットが住所録を開き、家の絵と宛先のカードを見比べている。","caption":"DNSは名前とIPアドレスの対応を調べる仕組み。安全の保証ではない。","check":{"prompt":"DNSで宛先が分かったサイトなら、必ず信用できる？","options":["宛先が分かることと、信用できることは別","DNSが内容の正しさを審査しているので安心","IPアドレスがあるサイトに危険はない"],"answer":0,"explain":"DNSは名前とIPアドレスの対応を調べる仕組み。内容や運営者の信用まで保証するものではないよ。"}},{"label":"データの運び方","title":"写真や動画は、小さな単位で運ばれる","body":"大きな写真や動画のデータも、通信では小さな単位に分けて運ばれる。この単位をパケットというよ。途中のルーターなどの機器が宛先を手がかりに次の行き先へ送り、受け取る側では、必要な仕組みによってデータを元の形に組み立てる。","explanationTitle":"一枚の写真が、一つの箱で届くとは限らない","body2":"小分けの荷物を届けるように考えると分かりやすい。ただし、本物の通信は荷物とまったく同じではないよ。途中でデータが届かないこともあり、通信の方式によっては送り直しなどで補う。ここでは「機器を経由して小分けに運ぶ」とつかめれば十分だよ。","example":{"title":"動画が途中で止まったとき","paragraphs":["次に再生するためのデータが間に合わないと、動画が待ち状態になることがある。いつもスマホの性能だけが原因とは限らず、途中の通信や相手側の混雑が関係することもあるんだ。","焦ってアプリを入れ直したり、よく分からない「高速化アプリ」を入れたりしない。まず少し待つ、再生画質を家族と見直すなど、簡単な確認から始めよう。"]},"actionTitle":"運び方をたとえてみよう","actions":["写真のデータが、小分けに運ばれる様子を想像する。","途中に情報を送り渡す機器があると覚える。","遅いときに、知らないアプリで解決しようとしない。"],"reflect":"動画が止まったら、スマホ本体以外にも原因がありそうかな？","key":"情報は、小さな単位に分かれて機器を経由して届く。","image":"assets/lessons/205-network.jpg","imageAlt":"写真の絵を小さな封筒に分けて、子どもとロボットが運ぶ準備をしている。","caption":"情報は、小さな単位に分かれて機器を経由して届く。"},{"label":"通信量とお金","title":"動画を見ると、どれくらい運ぶ？","body":"文字だけの連絡より、写真や動画では多くのデータをやり取りすることが多い。通信したデータの量を通信量といい、MB（メガバイト）やGB（ギガバイト）などで表すよ。動画の画質や長さによっても量は変わる。何分なら必ず何GB、と一つの数字では決められないんだ。","explanationTitle":"Wi-Fiでも、データは流れている","body2":"Wi-Fiにするとデータが消えるわけではない。携帯電話の契約とは別の回線を使うことが多い、ということ。契約によって料金や容量の条件が違うので「Wi-Fiならどんな使い方でも無料」とは限らないよ。モバイル通信で容量を使い切ると、契約によって速度制限や追加料金などにつながる。","example":{"title":"外で動画を長く見たい日","paragraphs":["家では気にならなくても、外で高画質の動画を続けて見るとモバイル通信の使用量が増えやすい。家族と契約を確かめ、使える範囲や、動画を見てよい場面を決めよう。","事前に保存して見る機能があるサービスでも、保存するときには通信が必要。サービスの利用条件やスマホの空き容量もあるので、勝手に大量保存せず相談してね。"]},"actionTitle":"使う前に確かめること","actions":["家族と契約のデータ容量や追加料金の条件を確認する。","端末のデータ使用量の画面を、一緒に見てみる。","自動再生や画質の設定を、家族と確認する。"],"reflect":"Wi-Fiを使うと、動画のデータ量そのものがゼロになるかな？","key":"通信量と料金の条件を知って、使い方を家族と決めよう。","image":"assets/lessons/206-network.jpg","imageAlt":"親子がスマホの抽象的な使用量メーターと、写真の封筒の山を見ている。","caption":"通信量と料金の条件を知って、使い方を家族と決めよう。"},{"label":"つながらないとき","title":"使えない原因を、落ち着いて分ける","body":"ページが開かないとき、スマホ、Wi-Fi、家の回線、通信会社、相手のサービスなど、いろいろな場所で問題が起きている可能性がある。全部を自分で直す必要はないよ。エラーの内容と、何が使えて何が使えないかを大人に伝えるだけでも、確認の手がかりになる。","explanationTitle":"ネットがなくても、できることはある","body2":"端末に保存済みの写真を見るなど、通信なしでできる操作もある。ただし、アプリによっては本人確認やデータの読み込みに通信が必要。「アプリが起動する」と「すべての機能が使える」も別なんだ。何度も同じ操作を繰り返す前に、一呼吸おこう。","example":{"title":"一つのサイトだけ開かない","paragraphs":["ほかのサイトは見られるのに、一つだけ開かないなら、相手側の不調の可能性もある。でも、それだけで原因が確定するわけではない。困った画面を大人に見せて、一緒に確認しよう。","見知らぬ人が「直してあげるからパスワードや認証コードを送って」と言っても渡さない。困っているときほど、いつもの相談先を頼ろう。"]},"actionTitle":"困ったときの伝え方","actions":["「いつから」「何をしたら」「どんな表示か」を伝える。","設定の大幅な変更や、アプリの追加は大人と行う。","パスワードや認証コードを、修理を名乗る相手にも送らない。"],"reflect":"動画だけ動かないとき、どんなことを大人に伝えると分かりやすいかな？","key":"原因を決めつけず、いつもの大人に相談する。","image":"assets/lessons/207-network.jpg","imageAlt":"止まった動画を子どもが見せ、保護者がルーターを確認している。そばに本と音楽プレーヤーがある。","caption":"原因を決めつけず、いつもの大人に相談する。"},{"label":"仕組みを安全につなげる","title":"送った情報は、自分のスマホの外へ出る","body":"メッセージや写真を送ると、サービスのサーバーや相手の端末など、自分のスマホ以外の場所にもデータが届く。自分の画面から削除しても、相手が保存したものやサービス側の記録まで、必ず全部消せるわけではないよ。サービスによって保存の方法や削除の仕組みは違うんだ。","explanationTitle":"「送信」を押す前が、考える時間","body2":"限られたグループに送っても、受け取った人がコピーしたり、別の人に見せたりする可能性がある。ネットの仕組みを知ることは、怖がるためではなく、自分で止まって確かめるため。写真・名前・学校名などを送る前に、相手、内容、目的を見直そう。","example":{"title":"間違えて写真を送ってしまったら","paragraphs":["まず送信先を確認し、取り消し機能があれば使い、必要なら相手に削除をお願いする。ただし「取り消したから絶対に誰も見ていない」とは言い切れないよ。","個人情報や、見られて困る内容なら、すぐ信頼できる大人へ。消そうと焦って、お金を払ったり、追加の写真を送ったりしない。失敗したあとでも相談していいんだ。"]},"actionTitle":"送る前の三つの確認","actions":["誰に届くのか、送信先を確かめる。","自分や友達の情報が含まれていないか確認する。","送ってよいか迷ったら、そのまま送らず大人に相談する。"],"reflect":"自分のスマホから写真を消すと、相手が保存した写真も必ず消えるかな？","key":"送ったデータは、自分だけでは管理しきれなくなることがある。","image":"assets/lessons/208-network.jpg","imageAlt":"送信前に親子が立ち止まり、遠くの相手とロボットが写真の封筒を受け取る様子を想像している。","caption":"送ったデータは、自分だけでは管理しきれなくなることがある。","check":{"prompt":"写真を間違えて送った。自分のスマホから消せば十分？","options":["相手の保存分も必ず消えるので十分","何もしなくても時間がたてば必ず消える","全部消えるとは限らない。必要な対処をし、大人に相談する"],"answer":2,"explain":"相手の保存分などが残ることもある。取り消しだけで安心せず、困る内容なら大人と一緒に対処しよう。"}}],"questions":[{"id":"network-1","tag":"つながりの全体像","q":"インターネットとは？","options":["多くのネットワークがつながった全体","一つの動画アプリの別名","自分のスマホの保存場所だけ"],"answer":0,"why":"ネットワーク同士がつながり、離れた機器とも通信できる仕組みだよ。","slide":0},{"id":"network-2","tag":"つながりの全体像","q":"家で図書館のWebサイトを見るとき、情報はどこから来る？","options":["すべてスマホが想像して作る","情報を届けるコンピュータなどから通信で届く","家の充電器から届く"],"answer":1,"why":"画面の向こうには、情報を届ける機器や人がいるよ。","slide":0},{"id":"network-3","tag":"接続の入口","q":"Wi-Fiについて正しい説明は？","options":["インターネット全体の名前","どんな場所でも必ず無料の回線","近くの機器を無線でつなぐ仕組み"],"answer":2,"why":"Wi-Fiは接続の入口になる仕組み。インターネット全体とは別だよ。","slide":1},{"id":"network-4","tag":"接続の入口","q":"Wi-Fiのマークは出るが、Webサイトが開かない。どうする？","options":["家族と、回線や接続先を確認する","必ずスマホが壊れたので捨てる","知らないWi-Fiにつながるまで試す"],"answer":0,"why":"Wi-Fiの先の回線や相手側などにも原因があるかもしれないね。","slide":1},{"id":"network-5","tag":"お願いと返事","q":"動画を見るとき、スマホからも情報は送られる？","options":["見るだけなら何も送らない","必要なデータをお願いする通信などを送る","文字を入力したときだけ通信する"],"answer":1,"why":"見る操作にもお願いと返事の通信があるよ。","slide":2},{"id":"network-6","tag":"お願いと返事","q":"サーバーの役割として近いものは？","options":["スマホの画面を拭く道具","スマホを充電する電池","情報や機能を提供するコンピュータなど"],"answer":2,"why":"お願いに応じて情報や機能を提供する側をサーバーというよ。","slide":2},{"id":"network-7","tag":"宛先を見つける","q":"DNSの役割は？","options":["ドメイン名に対応するIPアドレスを調べる","サイトの情報が正しいか採点する","使いすぎを自動で防ぐ"],"answer":0,"why":"DNSは、名前と通信の宛先を結びつける役割を持つよ。","slide":3},{"id":"network-8","tag":"宛先を見つける","q":"IPアドレスについて、正しい考え方は？","options":["必ず一人だけが一生使う番号","通信の宛先に使われ、変わったり共有されたりすることもある","それだけで必ず部屋番号まで分かる"],"answer":1,"why":"IPアドレスは人の名前や自宅の住所そのものではないよ。","slide":3},{"id":"network-9","tag":"データの運び方","q":"パケットとは？","options":["動画を見るための有料チケット","スマホのケース","通信で運ばれるデータの小さな単位"],"answer":2,"why":"大きなデータも、小さな単位で機器を経由して運ばれるよ。","slide":4},{"id":"network-10","tag":"データの運び方","q":"動画が止まった。どう考えるとよい？","options":["通信や相手側の混雑も考え、落ち着いて確認する","必ずスマホだけが原因だと決める","広告の高速化アプリをすぐ入れる"],"answer":0,"why":"通信経路や相手側の状態も影響することがあるよ。","slide":4},{"id":"network-11","tag":"通信量とお金","q":"Wi-Fiで動画を見ると、データ量はどうなる？","options":["データ量は必ずゼロになる","Wi-Fiでもデータは流れる。料金などは契約による","どんな契約でも完全に無料になる"],"answer":1,"why":"使う回線が変わっても、動画のデータ自体は運ばれるよ。","slide":5},{"id":"network-12","tag":"通信量とお金","q":"外で動画を見る前に確認したいことは？","options":["スマホのケースの色だけ","何も確認しなくてよい","データ容量や追加料金の条件、家族の約束"],"answer":2,"why":"通信量と契約条件を知って使おう。","slide":5},{"id":"network-13","tag":"つながらないとき","q":"一つのサイトだけ見られない。まずどうする？","options":["何が使えないかを大人に伝え、一緒に確認する","すべての設定を勝手に変える","スマホ内の写真を全部消す"],"answer":0,"why":"原因を決めつけず、状況を伝えることが確認の手がかりになるよ。","slide":6},{"id":"network-14","tag":"つながらないとき","q":"知らない相手が「接続を直すから認証コードを送って」と言う。どうする？","options":["困っているので送る","送らず、いつもの信頼できる大人に相談する","一度だけなら送る"],"answer":1,"why":"認証コードやパスワードを渡さず、普段の相談先を頼ろう。","slide":6},{"id":"network-15","tag":"仕組みを安全につなげる","q":"自分のスマホから写真を削除したら？","options":["相手のコピーも必ず消える","サービス側の記録も必ず全部消える","相手の保存分などが残ることがある"],"answer":2,"why":"自分の端末で消すことと、すべての場所から消すことは別だよ。","slide":7},{"id":"network-16","tag":"仕組みを安全につなげる","q":"個人情報を間違えて送り、相手からお金を要求された。どうする？","options":["追加の情報やお金を送らず、すぐ信頼できる大人に相談する","払えば必ず全部消せると信じる","怒られるかもしれないので隠す"],"answer":0,"why":"送ってしまったあとでも相談していい。ひとりで要求に応じず、安全を優先しよう。","slide":7,"critical":true}],"number":2,"title":"インターネットの仕組み","description":"情報が届く仕組みを知って、安全な行動につなげよう。"}];

const lessons=activeChapter.lessons||[{"label":"はじめの一歩","title":"スマホで、何をしたい？","body":"家族に帰る時刻を伝える。分からない言葉を調べる。好きな曲の弾き方を練習する。スマホがあると、今まで誰かに頼んでいたことを、自分でできる場面が増えるよ。まずは「自分は何に使いたいのか」を考えてみよう。","body2":"「ギターのコードを一つ調べる」なら、調べ終わったところが一区切り。「何となく見る」だけだと、次の動画や通知が気になって、やめるきっかけを見失うことがある。楽しみのために使うのもいいけれど、始める前に目的と終わりを決めておこう。","key":"「何のために使うか」を、家族と話してみよう。","explanationTitle":"目的があると、終わりも決めやすい","example":{"title":"帰りが遅くなりそうな日","paragraphs":["部活が長引いて、いつもの帰宅時刻に間に合わなさそう。家族に「練習が延びた。これから帰るよ」と連絡できれば、待つ人も安心しやすいね。","連絡が終わったあと、関係のない動画をずっと見る必要はない。「今の用事は終わった」と気づいて、しまうところまでが一つの使い方だよ。"]},"actionTitle":"きみなら、何に使う？","actions":["「家族への連絡」「調べ物」「楽しみ」から、使いたい目的をそれぞれ一つ考える。","その用事が終わるタイミングも、一緒に考える。","困ったときに誰に聞くか、家族と話しておく。"],"reflect":"スマホがあったら便利になる場面を、一つ家族に説明してみよう。","image":"assets/lessons/01-purpose.jpg","imageAlt":"ギターをそばに置いた子どもが、スマホで調べたいことと使う目的を保護者に説明している。","caption":"「何をしたいか」が決まると、使い方も考えやすい。"},{"label":"持つことと、使ってよいこと","title":"自分のスマホでも、何でも自由？","body":"スマホを受け取ると、自分で押せるボタンがたくさん見つかる。でも、ボタンが押せることと、押してよいことは同じではないんだ。端末は自分のものでも、友達の写真、家族のお金、学校の決まりまで自分だけで決められるわけではないよ。","body2":"友達の写真を送れば、相手の顔や行動が他の人に伝わる。購入ボタンを押せば、お金の支払いにつながることがある。「自分の操作が、誰にどんな影響を与えるか」を一度考えることが、責任を持って使う第一歩だよ。","key":"自分の端末でも、他の人の権利と家族の約束を守ろう。","explanationTitle":"画面の向こうにも、相手がいる","example":{"title":"ゲームに「購入」のボタンが出たら","paragraphs":["欲しかったアイテムが見つかって、購入画面まで進めた。「買える状態だから、買ってもいい」と考えてよいかな？","家族が登録した支払い方法で、代金が請求されるかもしれない。金額が小さくても、先に決めた購入の約束を確認しよう。「これを買いたい。いくらかかるよ」と相談してから判断するんだ。"]},"actionTitle":"押す前に、3つを確認","actions":["自分以外の人の情報や、お金に関係していないか。","家族・学校・サービスのルールで、確認が必要な操作ではないか。","分からないときに、そのまま進めず質問できるか。"],"reflect":"「操作はできるけれど、先に相談したいこと」を一つ考えてみよう。","image":"assets/lessons/02-permission.jpg","imageAlt":"購入前のスマホを保護者に見せて相談する子ども。テーブルには財布と硬貨が置かれている。","caption":"購入画面に進めても、購入の許可があるとは限らない。"},{"label":"生活の中のスマホ","title":"楽しいことは、画面の外にも。","body":"動画もゲームも、友達とのやり取りも楽しいね。ただ、一日の時間には限りがある。スマホの時間が増えると、その分だけ寝る、食べる、学ぶ、体を動かす、家族と話す時間が少なくなることがあるんだ。どの時間も自分の生活をつくっているよ。","body2":"利用時間の数字だけでなく、生活の中で困ることが増えていないかも振り返ろう。「宿題を始めるのが遅くなった」「好きだった外遊びをしなくなった」などに気づいたら、使い方を調整する合図。我慢が足りないと責める前に、環境を変える方法を考えよう。","key":"気合いだけに任せず、やめやすい環境をつくろう。","explanationTitle":"「何分使ったか」と「何ができたか」","example":{"title":"宿題の途中で通知が気になる","paragraphs":["メッセージが来るたびに画面を開き、気づくと動画も見ていた。こんなとき、「絶対に見ないぞ」と思うだけでは難しいこともあるね。","勉強中は不要な通知を切り、スマホを家族と決めた置き場所へ。終わったら確認する時間をつくる。「やめる力」だけに頼らず、気になりにくい仕組みを使っていいんだよ。"]},"actionTitle":"画面の外の予定も入れよう","actions":["使う前に、終える時刻と、そのあとにすることを決める。","集中したい時間は、不要な通知と置き場所を見直す。","睡眠や楽しみにしていた活動が減っていないか、家族と振り返る。"],"reflect":"スマホ以外で、これからも大切にしたい楽しみは何かな？","image":"assets/lessons/03-balance.jpg","imageAlt":"スマホを充電かごに置き、バスケットボールを持って外へ向かう子ども。近くに本と食事がある。","caption":"スマホも、画面の外の楽しみも、どちらも大切に。"},{"label":"考えてみよう ①","title":"「あと1本」見たい夜。","body":"家族と決めた利用の終了時間になった。でも、「次の動画も面白そう」「ゲームの続きも気になる」と思うことはあるよね。楽しんでいる途中に切り替えるのは、簡単ではないこともある。そんなときの行動を、使い始める前から用意しておこう。","body2":"動画のおすすめや自動再生は、次の内容を続けて見られる仕組み。「おすすめがなくなったら終わる」では、区切りがつかないことがあるよ。決めた時間になったら閉じる、途中でも続きは次回にするなど、自分と家族で終わり方を決めよう。","key":"終わりを決めておくのは、自分の時間を守るため。","check":{"prompt":"決めた終了時間。どれを選ぶ？","options":["今日はここで終わり、続きは次の利用時間に見る","おすすめが出なくなるまで見続ける","家族に分からないように音を消して見る"],"answer":0,"explain":"おすすめは次々に出てくることがあるよ。自分で区切ろう。時間の約束を変えたいときは、隠して延ばさず、家族と相談してね。"},"explanationTitle":"おすすめに、終わりを任せない","example":{"title":"続きは明日の自分にまかせる","paragraphs":["たとえば、終了時刻の少し前にタイマーを鳴らしておく。「あと少しで終わる」と分かれば、新しい動画や長い対戦を始める前に立ち止まれるね。","時間になったら、気になる動画は後で見る一覧に入れてアプリを閉じ、決めた充電場所へ。「もう1本だけ」を何度も繰り返すより、次に楽しむ予定を残して終えよう。"],"note":"ここでの終了時刻やタイマーは工夫の例。家庭の生活に合わせて決めよう。"},"actionTitle":"終わるときの手順を決めよう","actions":["終わる少し前に気づけるよう、タイマーなどを使う。","決めた終了時間でアプリを閉じ、続きは次の利用時間にする。","学校の連絡などで例外が必要なら、隠して延ばさず家族に相談する。"],"reflect":"終了時間になったら、スマホをどこに置くと切り替えやすそう？","image":"assets/lessons/04-bedtime.jpg","imageAlt":"夜、スマホをリビングの充電台に置き、本を持って寝室へ向かう子ども。窓の外に月が見える。","caption":"続きは次の時間に。置く場所まで決めておこう。"},{"label":"考えてみよう ②","title":"友達の写真、送ってもいい？","body":"友達と撮った写真が、とてもいい感じに写っていた。「みんなにも見せたい」と思うのは自然だね。でも、その写真が他の人に届くと、友達の顔、服装、一緒にいた場所なども伝わる。自分がうれしくても、友達も同じ気持ちとは限らないよ。","body2":"一緒に撮影することを了承していても、クラス全員に送ることや、SNSに載せることまで了承したとは限らない。「どの写真を、誰に、どこで見せるのか」を伝えて確認しよう。返事がないときや、断られたときは、勝手に送らないことが大切だよ。","key":"自分の「いいね」の前に、相手の「いいよ」を確認。","check":{"prompt":"クラスのグループへ送る前に、どうする？","options":["グループなら外に出ないので、そのまま送る","写っている友達に、送る相手も伝えて確認する","自分が撮った写真なので、自分だけで決める"],"answer":1,"explain":"相手にも、写真を送ってほしくない理由があるかもしれないよ。断られたら送らない。送信先で保存・転送される可能性も考えよう。"},"explanationTitle":"撮影の「いいよ」と、共有の「いいよ」","example":{"title":"「これ、送ってもいい？」を具体的に","paragraphs":["「この写真を、クラスのグループに送ってもいい？」と聞いてみよう。相手が「家族にはいいけれど、クラスには送らないで」と言ったら、その範囲を守るんだ。","グループの中でも、画像が保存・転送される可能性はある。「送ったあとで消せば大丈夫」とは考えず、写っている人に確認してから共有しよう。"],"dialogue":[{"speaker":"きみ","text":"この写真、クラスのグループに送ってもいい？"},{"speaker":"友達","text":"その写真は送らないでほしいな。"},{"speaker":"きみ","text":"分かった。送らずに、自分で見るだけにするね。"}]},"actionTitle":"送信ボタンの前に","actions":["写っている人と、写真に含まれる情報を確かめる。","送る相手や公開する場所も伝えて、本人に確認する。","断られたら尊重する。名前を消すだけで解決したと決めつけない。"],"reflect":"自分が「送らないで」と言えることも大事。どんなふうに伝える？","image":"assets/lessons/05-photo-consent.jpg","imageAlt":"公園で撮った写真をスマホで見せ、友達と共有してよいか話し合う二人の子ども。","caption":"写真を撮る前と、他の人に送る前。それぞれ確認しよう。"},{"label":"判断に迷ったとき","title":"すぐ決めなくて、だいじょうぶ。","body":"「今だけ」「早く返事をして」「友達ならやってよ」。こう言われると、断りにくかったり、急いで決めたくなったりするね。でも、相手が急いでいるからといって、自分もすぐに応じなければならないわけではないよ。迷ったときには、決めるのを待っていいんだ。","body2":"安全かどうかを一人で全部見抜こうとしなくて大丈夫。何を求められているか、家族の約束に合っているか、自分や誰かが困らないかを確かめよう。「誰にも相談するな」と言われても、その要求に従う必要はない。信頼できる大人に話していいよ。","key":"止まる → 確かめる → 相談する。この順番を覚えよう。","explanationTitle":"分からないときに止まるのも、判断する力","example":{"title":"夜の返信を友達に求められたら","paragraphs":["家族と決めた利用時間のあとに、友達から「今すぐ返事して。友達でしょ」と言われたとする。友達を大切にすることと、いつでも返信することは別だよ。","「夜は見られないから、次に使える時間に返すね」と、普段から伝えておく方法もある。断っても何度も責められて困るときは、一人で抱えず保護者や先生に相談しよう。"]},"actionTitle":"迷ったら、この順番で","actions":["止まる：リンクを押す、送る、買うなどの操作や返事を急がない。","確かめる：相手の要求と、家族の約束や自分の気持ちを整理する。","相談する：保護者や先生など、信頼できる大人と一緒に考える。"],"reflect":"「少し待って」「大人に確認するね」。自分が使えそうな言い方を選ぼう。","image":"assets/lessons/06-pause-check.jpg","imageAlt":"急な通知が来たスマホをいったん置き、手のひらで待つ合図をして保護者に相談する子ども。","caption":"急がされても、いったん止まっていい。"},{"label":"考えてみよう ③","title":"約束を破ったあとでも、相談しよう。","body":"「約束を破ったことが分かったら怒られるかも」。失敗したあとほど、言い出しにくくなることがあるよね。でも、困りごとを隠したままだと、一人では止めにくい状況になることもある。どんなきっかけで起きたことでも、助けを求めていいんだよ。","body2":"知らない相手に写真を送ってしまい、「お金を払え」「もっと送れ」と要求されたとする。応じれば必ず終わるとは限らない。追加の写真やお金を送らず、すぐ信頼できる大人に相談しよう。相手に連絡を続けたり、言い返したりする必要はないよ。","key":"失敗したあとでも、助けを求めていい。","check":{"prompt":"相手から脅された。最初にどうする？","options":["誰にも言わず、お金を払って終わらせる","もっと写真を送れば許してくれるか試す","追加で送らず、すぐ信頼できる大人に相談する"],"answer":2,"explain":"脅している相手の要求に一人で応じないで。相談したこと自体を責めない、というのも家族で決めたい約束だよ。相談相手は保護者だけでなく先生などでもいい。"},"explanationTitle":"脅されたときは、一人で解決しない","example":{"title":"最初のひと言は、短くてもいい","paragraphs":["全部を上手に説明できなくても大丈夫。「怖いメッセージが来た。今、一緒に見てほしい」と伝えるだけでも、助けにつながるよ。","保護者にすぐ話せないときは、先生など別の信頼できる大人へ。「秘密にしろ」と言われていても、相談してよい。画面の扱い、ブロックや通報などの次の行動は、大人と一緒に考えよう。"],"dialogue":[{"speaker":"きみ","text":"約束を破ったあとに、怖いことが起きた。助けてほしい。"},{"speaker":"大人","text":"話してくれてありがとう。まず、今の安全を一緒に守ろう。"}]},"actionTitle":"困ったときの優先順位","actions":["追加の写真やお金を送らず、相手の要求に一人で応じない。","その場で信頼できる大人に相談し、一緒に状況を確認する。","家族は、相談したこと自体を罰しない。約束の振り返りは、安全を守ってから。"],"reflect":"保護者以外も含めて、助けを求められる大人を二人考えておこう。","image":"assets/lessons/07-ask-help.jpg","imageAlt":"困ったメッセージを保護者に見せる子ども。保護者は同じ目線で落ち着いて話を聞いている。","caption":"失敗したあとでも、話してくれてよかった。"},{"label":"第1章のまとめ","title":"ルールは、一緒につくって育てよう。","body":"スマホのルールは、子どもを困らせるためではなく、便利さを楽しみながら生活と安全を守るためのもの。使う目的、時間、置く場所、アプリやお金の扱い、困ったときの相談方法を、理由と一緒に家族で話し合おう。分からない約束は、そのままにせず質問していいよ。","body2":"子どもが利用時間を守るのと同じように、大人も「子どもの写真を勝手に公開しない」「相談を落ち着いて聞く」といった約束を守ろう。利用状況を何のために、どこまで確認するのかも先に説明してもらうと、お互いに納得して始めやすいね。","key":"きみだけの我慢ではなく、家族みんなの約束にしよう。","explanationTitle":"子どもにも、大人にも、守る約束がある","example":{"title":"使ってみたら、ルールが合わなくなった","paragraphs":["学校の連絡を確認したい時刻が、家族と決めた利用時間のあとだった。「隠れて使う」か「全部あきらめる」しか方法がないわけではないよ。","「この連絡の確認に困っている。ここだけ見られるようにできる？」と理由を伝えて相談しよう。例外をどう扱うか、いつ見直すかも、一緒に決め直していいんだ。"],"note":"教材の時間や置き場所は例。家族の生活に合わせて考えよう。"},"actionTitle":"家族と話して、確かめよう","actions":["子どもは、使う目的と困ったときの行動を自分の言葉で伝える。","大人からも、確認する範囲や相談を受けたときの約束を伝える。","「いつ見直すか」を決めておく。保存ボタンだけで、話し合いが終わるわけではない。"],"reflect":"きみが守る約束と、大人に守ってほしい約束を、一つずつ話してみよう。","image":"assets/lessons/08-family-agreement.jpg","imageAlt":"スマホを横に置き、時計や充電場所の絵がある家族の約束を、親子で一緒に指さして話し合っている。","caption":"理由を聞き合って、家族みんなの約束にしよう。"}];

const questions=activeChapter.questions||chapterOneQuestions;
function freshState(){return {version:CONTENT_VERSION,slide:0,learned:false,attempts:[],rules:null};}
function sanitizeState(raw,lessonCount=lessons.length){const clean=freshState();if(!raw||raw.version!==CONTENT_VERSION)return clean;clean.slide=Number.isInteger(raw.slide)?Math.max(0,Math.min(lessonCount-1,raw.slide)):0;clean.learned=raw.learned===true;clean.attempts=Array.isArray(raw.attempts)?raw.attempts.filter(a=>a&&Number.isInteger(a.correct)&&a.correct>=0&&a.correct<=10&&typeof a.passed==='boolean'&&typeof a.at==='string').slice(-20):[];if(raw.rules&&typeof raw.rules==='object'){const r=raw.rules;if(['30','60','90','120'].includes(r.minutes)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(r.end)&&['living','hall','family'].includes(r.place)&&['parent','adult'].includes(r.help))clean.rules={minutes:r.minutes,end:r.end,place:r.place,help:r.help};}return clean;}
let storageOK=true;
function readStored(key){try{return JSON.parse(localStorage.getItem(key));}catch{storageOK=false;return null;}}
function load(){const loaded=sanitizeState(readStored(STORAGE_KEY));const shared=readStored(RULES_KEY);const legacy=readStored(chapterStorageKey(1));loaded.rules=sanitizeState({version:1,rules:shared||legacy?.rules||loaded.rules}).rules;return loaded;}
let state=load(), slideChoice=null, slideFeedback=null, exam=null, result=null;
const main=document.getElementById('main');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageOK=false;}}
function shuffle(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function createExam(rng=Math.random){const critical=questions.find(q=>q.critical);return shuffle([critical,...shuffle(questions.filter(q=>!q.critical),rng).slice(0,9)],rng).map(q=>{const options=shuffle(q.options.map((text,i)=>({text,original:i})),rng);return {...q,options:options.map(o=>o.text),answer:options.findIndex(o=>o.original===q.answer)};});}
function grade(items,answers){const correct=items.reduce((n,q,i)=>n+Number(answers[i]===q.answer),0);const criticalOK=items.every((q,i)=>!q.critical||answers[i]===q.answer);return {correct,total:items.length,criticalOK,passed:correct/items.length>=.9&&criticalOK};}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function button(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;}
function progress(){document.getElementById('published-label').textContent=`第1〜${availableChapters.at(-1)}章 公開中`;const pct=state.learned?100:Math.round(state.slide/lessons.length*100);document.getElementById('side-percent').textContent=pct+'%';document.getElementById('side-track').style.width=pct+'%';document.getElementById('side-caption').textContent=state.learned?'学習完了。テストに挑戦しよう。':'自分のペースで、少しずつ。';}
function route(){const hash=location.hash;const match=hash.match(/^#\/learn\/(\d+)$/);if(match){const n=Number(match[1]);state.slide=Math.max(0,Math.min(n,state.learned?lessons.length-1:state.slide));save();slideChoice=null;slideFeedback=null;}const path=hash.replace(/^#\/?/,'').split('/')[0]||'home';const page=['home','learn','test','family','about'].includes(path)?path:'home';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===page);if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('breadcrumb').textContent={home:'はじめの一歩',learn:`第${chapterNumber}章を学ぶ`,test:`第${chapterNumber}章の確認テスト`,family:'家族の約束',about:'保護者の方へ'}[page];document.title=({home:'ホーム',learn:`第${chapterNumber}章 学習`,test:`第${chapterNumber}章 テスト`,family:'家族の約束',about:'保護者の方へ'}[page])+'｜スマホ安全活用検定';({home:renderHome,learn:renderLearn,test:renderTest,family:renderFamily,about:renderAbout}[page])();progress();if(!storageOK)main.insertAdjacentHTML('afterbegin','<p class="notice">このブラウザでは進み具合を保存できません。ページを閉じると記録が失われる場合があります。</p>');main.focus({preventScroll:true});window.scrollTo(0,0);}
function readChapterState(n){try{return sanitizeState(JSON.parse(localStorage.getItem(chapterStorageKey(n))),chapters.find(c=>c.number===n)?.lessons?.length||8);}catch{return freshState();}}
function renderHome(){const passedCount=availableChapters.filter(n=>(n===chapterNumber?state:readChapterState(n)).attempts.some(a=>a.passed)).length;main.innerHTML=`<section class="hero"><div><p class="eyebrow">LEARN TODAY. USE SMART TOMORROW.</p><h1>スマホと、<br>いい関係を。</h1><p class="lead">はじめてのスマホ。その前に、知っておこう。<br>自分も、友達も守れる使い方を、<br>ひとつずつ身につけよう。</p><div class="actions"><a class="btn" href="#/learn">${state.learned?'もう一度、学習する':state.slide?'学習のつづきへ':`第${chapterNumber}章をはじめる`} <span aria-hidden="true">→</span></a><a class="btn quiet" href="#/about">保護者の方へ ↗</a></div><p class="footnote">1章の目安 約15〜25分 / 途中で休んで、何度でも学習できます</p></div><img class="hero-image" src="${HERO}" alt="スマホの使い方について笑顔で話し合う親子と、盾を持つロボット。周りには本、バスケットボール、月のモチーフ。" width="1200" height="800"></section><section aria-labelledby="steps-title"><div class="section-title"><h2 id="steps-title">できるようになるまでの、3ステップ</h2></div><div class="steps"><article class="step"><span class="step-number">01 / LEARN</span><h3>イラストで学ぶ</h3><p>挿し絵と具体例を読み、<br>「こんなとき」を考えよう。</p></article><article class="step"><span class="step-number">02 / TRY</span><h3>テストで確かめる</h3><p>間違えてもだいじょうぶ。<br>解説を読んで、また挑戦。</p></article><article class="step"><span class="step-number">03 / TALK</span><h3>家族で話し合う</h3><p>わが家に合う使い方を、<br>一緒に決めていこう。</p></article></div></section><section aria-labelledby="chapter-title"><div class="section-title"><h2 id="chapter-title">学ぶ章を選ぼう</h2><span>全24章を順次作成予定</span></div><div class="course-overview"><strong>公開中 ${chapters.length}章</strong><span>学習画面 ${chapters.length*8}項目 · 確認テスト合格 ${passedCount} / ${chapters.length}章</span><p>一度に全部進めなくていいよ。1章ずつ学んで、家族と話し合おう。</p></div><div class="chapter-grid">${availableChapters.map(n=>{const record=n===chapterNumber?state:readChapterState(n);const course=chapters.find(c=>c.number===n);const title=course.title;const done=record.attempts.some(a=>a.passed);return `<article class="chapter"><div class="chapter-inner"><div class="chapter-num">${String(n).padStart(2,'0')}</div><div class="chapter-copy"><span class="badge">${done?'✓ 確認テスト合格':record.learned?'✓ 学習完了':'公開中'}</span><h3>${esc(title)}</h3><p>${esc(course.description)}</p></div><a class="btn secondary small" href="?chapter=${n}#/learn">学習する →</a></div><div class="chapter-bottom"><span>8つの学習画面 / 3つの考える問題 / 確認テスト10問</span><a href="?chapter=${n}#/test">確認テストへ →</a></div></article>`;}).join('')}</div><details><summary>これから学ぶテーマを見る（残り${roadmap.length-chapters.length}章・準備中）</summary><ol class="roadmap">${roadmap.slice(chapters.length).map((t,i)=>`<li><span class="num">${String(i+chapters.length+1).padStart(2,'0')}</span>${t} <span class="subtle">· 準備中</span></li>`).join('')}</ol></details></section><p class="footnote">現在は第1〜${availableChapters.at(-1)}章を公開しています。各章の合格は、全課程の修了やスマホを渡す最終判断を意味しません。</p>`;}
function chapterMenu(){return `<details class="chapter-picker"><summary>第${chapterNumber}章を学習中 · 別の章を選ぶ</summary><div class="chapter-links">${chapters.map(c=>`<a href="?chapter=${c.number}#/learn" ${c.number===chapterNumber?'aria-current="page"':''}><span>${String(c.number).padStart(2,'0')}</span>${esc(c.title)}</a>`).join('')}</div><p class="subtle">進み具合は章ごとに保存されます。</p></details>`;}
function chapterSources(){return chapters.filter(c=>c.sources?.length).map(c=>`<details class="chapter-sources"><summary>第${c.number}章 ${esc(c.title)} の参考資料</summary><ul class="source-list">${c.sources.map(source=>`<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} ↗</a><br>${esc(source.note)}<br><span class="subtle">確認日：${esc(source.checked)}</span></li>`).join('')}</ul></details>`).join('');}
function visual(lesson){const panel=lesson.imagePanel;const atlas=Number.isInteger(panel);return `<figure class="lesson-figure"><div class="illustration-frame ${atlas?'atlas-frame':''}"><img src="${esc(lesson.image)}" alt="${esc(lesson.imageAlt)}" ${atlas?`style="left:${-(panel%2)*100}%;top:${-Math.floor(panel/2)*100}%"`:'width="1200" height="675"'} decoding="async"></div><figcaption>${esc(lesson.caption)}</figcaption></figure>`;}
function renderExample(example){return `<section class="lesson-example" aria-labelledby="example-title"><p class="section-kicker">たとえば、こんな場面</p><h3 id="example-title">${esc(example.title)}</h3>${example.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}${example.dialogue?`<div class="dialogue" aria-label="伝え方の例">${example.dialogue.map(line=>`<p class="dialogue-line"><strong>${esc(line.speaker)}</strong><span>「${esc(line.text)}」</span></p>`).join('')}</div>`:''}${example.note?`<p class="example-note">${esc(example.note)}</p>`:''}</section>`;}
function renderLearn(){
  const s=lessons[state.slide],check=s.check;
  main.innerHTML=`${chapterMenu()}<div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode}</p><h1>${chapterTitle}</h1><p class="subtle">説明 → 具体例 → やってみること。ひとつずつ、読んでみよう。</p></div><span class="page-count">${state.slide+1} / ${lessons.length}</span></div>

  <div class="lesson-controls"><button class="btn secondary" data-action="prev-slide" ${state.slide===0?'disabled':''}>← 前へ</button><span class="subtle">${check?'答えを選ぶと進めるよ':'読み終わったら、次へ'}</span><button class="btn" data-action="next-slide" ${check&&(!slideFeedback||!slideFeedback.good)?'disabled':''}>${state.slide===lessons.length-1?'学習を終えて、テストへ':'次へ →'}</button></div><div class="bottom-links"><a href="#/">ホームへ戻る</a><a href="#/about">参考資料を見る</a></div>`;
}
function renderTest(){if(!state.learned){main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>まずは、お話を読んでみよう。</h1><div class="panel"><p>テストは、第${chapterNumber}章の${lessons.length}つの画面と、途中の考える問題を終えると受けられるよ。</p><p class="subtle">急がなくてだいじょうぶ。前の画面にも戻れるよ。</p><a class="btn" href="#/learn">学習${state.slide?'のつづき':'をはじめる'} →</a></div></div>`;return;}if(result){renderResult();return;}if(exam){renderQuestion();return;}const last=state.attempts.at(-1);main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>「わかった」を、確かめよう。</h1><p class="subtle">第${chapterNumber}章「${chapterTitle}」確認テスト</p><div class="panel"><span class="badge">✓ 学習完了</span><div class="exam-stats"><div class="stat"><strong>10問</strong>選択式の場面問題</div><div class="stat"><strong>90点以上</strong>合格の目安</div><div class="stat"><strong>何度でも</strong>時間制限なし</div></div><ul class="check-list"><li>合格には、10問中9問以上の正解が必要。</li><li>安全な行動を選ぶ重要問題は、必ず正解しよう。</li><li>答えを選んだあと、最後にまとめて採点するよ。</li><li>間違えた問題は、解説とお話を見て学び直せるよ。</li></ul><p class="subtle">問題と選択肢の順番は、受けるたびに変わります。途中の回答はページを再読み込みすると失われます。</p>${button('テストをはじめる →','start-exam')}<div class="bottom-links"><a href="#/learn">学習を読み返す</a></div></div>${last?`<p class="subtle">前回の結果：${last.correct*10}点 · ${last.passed?`第${chapterNumber}章 合格`:'学び直して、もう一度挑戦しよう'}</p>`:''}</div>`;}
function renderQuestion(){const q=exam.items[exam.index];main.innerHTML=`<div class="narrow"><div class="lesson-head"><div><p class="eyebrow">CHAPTER ${chapterCode} / CHECK</p><h1>第${chapterNumber}章 確認テスト</h1></div><span class="page-count">${exam.index+1} / 10 問</span></div><div class="track"><span style="width:${(exam.index+1)*10}%"></span></div><section class="panel" aria-labelledby="question-title"><p class="question-meta">Q${String(exam.index+1).padStart(2,'0')} / ${q.tag}</p><h2 class="question-title" id="question-title">${q.q}</h2><div class="options" role="group" aria-label="答えを1つ選んでください">${q.options.map((o,i)=>`<button class="option ${exam.answers[exam.index]===i?'chosen':''}" data-answer="${i}" aria-pressed="${exam.answers[exam.index]===i}"><span class="option-label" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div class="exam-nav"><button class="btn secondary" data-action="prev-question" ${exam.index===0?'disabled':''}>← 前の問題</button><button class="btn" data-action="next-question" ${exam.answers[exam.index]===undefined?'disabled':''}>${exam.index===9?'採点する':'次の問題 →'}</button></div></section><p class="subtle">選んだ答えは、採点するまで変更できます。回答済み ${exam.answers.filter(x=>x!==undefined).length} / 10問</p><button class="btn quiet small" data-action="exit-exam">テストを中断する</button></div>`;}
function renderResult(){const r=result;main.innerHTML=`<div class="narrow"><p class="eyebrow">CHAPTER ${chapterCode} / RESULT</p><section class="panel"><div class="results-score"><span class="result-icon" aria-hidden="true">${r.passed?'✦':'▤'}</span><h1>${r.passed?`第${chapterNumber}章、合格！`:'もう一度、確かめてみよう。'}</h1><div class="score">${r.correct*10}<small> / 100点</small></div><p class="subtle">${r.correct} / ${r.total}問正解 · 重要問題 ${r.criticalOK?'正解':'学び直そう'}</p></div><div class="callout">${r.passed?'安全に使うための、はじめの一歩ができたね。<br>次は家族と、わが家の約束を話し合おう。':'間違いは、気づくチャンス。下の解説を読んで、お話に戻ってみよう。<br>合格は90点以上、かつ重要問題の正解が条件だよ。'}</div><div class="actions">${r.passed?'<a class="btn" href="#/family">家族の約束を話し合う →</a>':''}${r.passed&&availableChapters.includes(chapterNumber+1)?`<a class="btn secondary" href="?chapter=${chapterNumber+1}#/learn">第${chapterNumber+1}章へ →</a>`:''}${button('もう一度テストする','start-exam',r.passed?'secondary':'')}<a class="btn secondary" href="#/learn">学習に戻る</a></div><p class="footnote">第${chapterNumber}章のみの合格です。全24章の修了証や、スマホを渡す許可ではありません。</p></section><h2>答えと解説</h2><div class="panel">${r.items.map((q,i)=>{const ok=r.answers[i]===q.answer;return `<article class="review-item"><p class="${ok?'status-good':'status-miss'}">${ok?'✓ 正解':'↻ 学び直し'} · Q${i+1}${q.critical?' · 重要問題':''}</p><h3>${q.q}</h3><p>あなたの答え：${esc(q.options[r.answers[i]])}</p>${!ok?`<p class="status-good">正解：${q.options[q.answer]}</p>`:''}<p>${q.why}</p><a class="subtle" href="#/learn/${q.slide}">学習画面 ${q.slide+1} に戻る →</a></article>`;}).join('')}</div><a href="#/" class="subtle">ホームへ戻る</a></div>`;}
function renderFamily(){const shared=readStored(RULES_KEY);if(shared)state.rules=sanitizeState({version:1,rules:shared}).rules;const r=state.rules||{minutes:'60',end:'20:30',place:'living',help:'parent'};const places={living:'リビングで充電する',hall:'廊下など、寝室以外で充電する',family:'家族で決めた場所に置く'};main.innerHTML=`<div class="narrow"><p class="eyebrow">FAMILY TALK</p><h1>わが家の約束を、話そう。</h1><p>子どもだけでなく、大人にも守る約束がある。<br>理由を聞き合いながら、一緒に決めてみよう。</p><div class="callout">これは話し合うための下書きです。表示されている時間は例で、すべての家庭への推奨値ではありません。</div><form id="rules-form" class="panel"><h2>まずは、4つから。</h2><div class="form-grid"><label class="field">娯楽で使う1日の時間の目安<select name="minutes">${['30','60','90','120'].map(n=>`<option value="${n}" ${r.minutes===n?'selected':''}>${n}分</option>`).join('')}</select></label><label class="field">夜に利用を終える時刻<input type="time" name="end" value="${r.end}" required></label><label class="field">夜、スマホを置く場所<select name="place">${Object.entries(places).map(([v,t])=>`<option value="${v}" ${r.place===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">困ったときの相談先<select name="help"><option value="parent" ${r.help==='parent'?'selected':''}>保護者。話せないときは先生など</option><option value="adult" ${r.help==='adult'?'selected':''}>先生など、信頼できる大人</option></select></label></div><p class="subtle" style="margin-top:20px">緊急連絡や学校の連絡など、例外が必要な場合も話し合おう。課金・アプリ追加・外出時の約束は、次の章以降も学びながら決めていきます。</p><button class="btn" type="submit">この端末に下書きを保存</button><p id="rules-status" role="status" class="subtle" style="margin:12px 0 0">${state.rules?'下書きが保存されています。':''}</p></form><section class="panel"><h2>大人からの約束</h2><ul class="check-list"><li>困ったことを相談した、そのこと自体は罰しません。</li><li>まず安全を守り、ルールの振り返りは落ち着いてから。</li><li>子どもの写真を投稿するときも、本人に確認します。</li><li>使い方を確認する範囲は、先に説明します。</li><li>家族の生活や成長に合わせて、一緒に見直します。</li></ul><p class="subtle">この画面の保存だけで、保護者の承認やスマホの設定が完了するわけではありません。実際に親子で話し合って確認してください。</p></section><p class="footnote">保存先は、このブラウザの中だけです。保護者への自動送信・端末間同期はありません。</p></div>`;document.getElementById('rules-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.rules={minutes:f.get('minutes'),end:f.get('end'),place:f.get('place'),help:f.get('help')};try{localStorage.setItem(RULES_KEY,JSON.stringify(state.rules));}catch{storageOK=false;}save();document.getElementById('rules-status').textContent=storageOK?'下書きを保存しました。家族と話し合って、必要なら変更しよう。':'保存できませんでした。このブラウザの保存設定を確認してください。';});}
function renderAbout(){main.innerHTML=`<div class="narrow"><p class="eyebrow">FOR PARENTS</p><h1>「使わない」より、<br>安全に使う力を。</h1><p>スマホを受け取る前に、親子で学ぶための教材です。現在は、第1・2章を公開しています。各章の学習とテストは独立して進められます。</p><section class="panel"><h2>今回、確認できること</h2><ul class="check-list"><li>各項目に挿し絵・理由・具体例・行動例を付けた各章8画面と、途中の3つの判断練習。</li><li>各章16問の問題バンクから、重要問題を含む10問を出題。</li><li>問題・選択肢の並べ替え、採点、全問の解説、再受験。</li><li>家族の約束の下書きと、学習進度のブラウザ内保存。</li></ul><p class="subtle">合格条件は90点以上、かつ各章の重要問題への正答です。今後の全課程の合格条件は、教材を拡張する際に調整します。</p></section><section class="panel"><h2>親子で使うときに</h2><p>点数だけで判断せず、「なぜその答えを選んだか」「実際に困ったとき、誰にどう話すか」も確かめてください。学習と家庭内ルールに加え、端末の安全設定も必要です。</p><p>ルール違反の振り返りと、被害相談への対応は分けます。まずは安全の確保を優先し、相談したこと自体を罰しない関係をつくることを、この教材では大切にしています。</p><p class="subtle">保護者向けの画面に認証はありません。子どもも閲覧できます。これは監視アプリや利用制限アプリではなく、学習用のサイトです。</p></section><section class="panel"><h2>参考にした一次情報</h2><p class="subtle">各章の教材設計で参照。家庭での約束例や合格基準は、本サイト独自の提案です。確認日：2026年11月17日。</p><ul class="source-list"><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/leaflet/" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発リーフレット集 ↗</a><br>家庭のルール、安全設定、ネットでのトラブルについて。</li><li><a href="https://www.cfa.go.jp/policies/youth-kankyou/internet_use_keihatu" target="_blank" rel="noopener noreferrer">こども家庭庁：普及啓発コンテンツ ↗</a><br>親子のルールづくりと、安全に利用するための教材。</li><li><a href="https://www.npa.go.jp/bureau/cyber/countermeasures/defamation.html" target="_blank" rel="noopener noreferrer">警察庁：インターネット上の誹謗中傷等への対応 ↗</a><br>写真や個人情報を安易に掲載しないなどの被害防止策。</li><li><a href="https://www.nic.ad.jp/ja/basics/beginners/dns.html" target="_blank" rel="noopener noreferrer">JPNIC：DNSとは ↗</a><br>第2章：ドメイン名とIPアドレスの関係。</li><li><a href="https://developer.mozilla.org/ja/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works" target="_blank" rel="noopener noreferrer">MDN：ウェブのしくみ ↗</a><br>第2章：クライアント・サーバー、通信とパケット。</li></ul>${chapterSources()}</section><section class="panel"><h2>記録とプライバシー</h2><p>本サイトには、名前・メールアドレス・本物のパスワードを入力する欄はありません。学習進度、章ごとの直近20回の点数、家族ルールの下書きは、このブラウザのlocalStorageに保存します。</p><p>本サイトのコードから学習記録を外部へ送信する機能や、アクセス解析、広告は入れていません。配信基盤のGitHub Pagesでは、通信に伴う情報が処理されます。別の端末との同期はなく、ブラウザのデータを消すと記録も消えます。</p><p class="subtle">イラストは生成AIで制作した教材用の画像です。実在する親子の写真ではありません。</p><button class="btn secondary small" data-action="reset">この章の学習記録をリセット</button><p id="reset-status" role="status" class="subtle"></p></section><div class="bottom-links"><a href="https://github.com/inamuu/smartphone-safe-use-cert" target="_blank" rel="noopener noreferrer">ソースコード ↗</a><a href="https://inamuu.github.io/links/">inamuu links ↗</a><a href="#/">ホームへ</a></div></div>`;}
main.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const check=lessons[state.slide].check;slideChoice=Number(choice.dataset.choice);const good=slideChoice===check.answer;slideFeedback={good,text:check.explain};renderLearn();main.querySelector(`[data-choice="${slideChoice}"]`).focus({preventScroll:true});return;}const answer=e.target.closest('[data-answer]');if(answer&&exam){exam.answers[exam.index]=Number(answer.dataset.answer);renderQuestion();main.querySelector(`[data-answer="${answer.dataset.answer}"]`).focus({preventScroll:true});return;}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'prev-slide':if(state.slide>0){state.slide--;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'next-slide':if(lessons[state.slide].check&&!slideFeedback?.good)return;if(state.slide===lessons.length-1){state.learned=true;save();exam=null;result=null;location.hash='/test';}else{state.slide++;slideChoice=null;slideFeedback=null;save();renderLearn();progress();main.focus();window.scrollTo(0,0);}break;case'start-exam':if(!state.learned)return;exam={items:createExam(),answers:[],index:0};result=null;renderQuestion();main.focus();window.scrollTo(0,0);break;case'prev-question':if(exam&&exam.index>0){exam.index--;renderQuestion();main.focus();window.scrollTo(0,0);}break;case'next-question':if(!exam||exam.answers[exam.index]===undefined)return;if(exam.index<9){exam.index++;renderQuestion();}else{result={...grade(exam.items,exam.answers),items:exam.items,answers:[...exam.answers]};state.attempts.push({correct:result.correct,passed:result.passed,at:new Date().toISOString()});state.attempts=state.attempts.slice(-20);save();exam=null;renderResult();}main.focus();window.scrollTo(0,0);break;case'exit-exam':if(confirm('テストを中断しますか？ 途中の回答は消えます。学習の進み具合は残ります。')){exam=null;renderTest();main.focus();}break;case'reset':if(confirm('この章の学習の進み具合とテスト結果をリセットしますか？ 家族の約束と他の章の記録は残ります。')){const rules=state.rules;state=freshState();state.rules=rules;exam=null;result=null;slideChoice=null;slideFeedback=null;save();progress();document.getElementById('reset-status').textContent=storageOK?'学習記録をリセットしました。':'保存領域を更新できませんでした。ブラウザのサイトデータ設定から削除してください。';}break;}});
window.addEventListener('hashchange',route);
route();
